<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Analyzing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-success: #4CAF50;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 20px 28px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
  min-height: 0;
}

/* ============================================
   BRAIN VISUAL
============================================ */
.brain-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.7);
  animation: brainIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
}

@keyframes brainIn {
  to { opacity: 1; transform: scale(1); }
}

.brain-glow {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 124, 123, 0.25) 0%, transparent 65%);
  filter: blur(30px);
  animation: glowPulse 2.6s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.15); }
}

.brain-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Orbiting ring */
.orbit-ring {
  position: absolute;
  inset: 5px;
  border: 1.5px dashed rgba(155, 126, 222, 0.35);
  border-radius: 50%;
  animation: orbit 12s linear infinite;
}

.orbit-ring-inner {
  position: absolute;
  inset: 25px;
  border: 1px dashed rgba(14, 124, 123, 0.3);
  border-radius: 50%;
  animation: orbit 8s linear infinite reverse;
}

@keyframes orbit {
  to { transform: rotate(360deg); }
}

/* Neural pulses */
.neural-node {
  animation: nodePulse 1.8s ease-in-out infinite;
  transform-origin: center;
}

.neural-node:nth-child(1) { animation-delay: 0s; }
.neural-node:nth-child(2) { animation-delay: 0.3s; }
.neural-node:nth-child(3) { animation-delay: 0.6s; }
.neural-node:nth-child(4) { animation-delay: 0.9s; }
.neural-node:nth-child(5) { animation-delay: 1.2s; }
.neural-node:nth-child(6) { animation-delay: 1.5s; }

@keyframes nodePulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.4); }
}

/* ============================================
   TEXT
============================================ */
.text-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 320px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.7s ease 0.5s forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.title {
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
}

html[lang="ar"] .title { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.subtitle {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.6;
}

html[lang="ar"] .subtitle { font-family: var(--f-ar); font-size: 14.5px; }

/* ============================================
   MESSAGE
============================================ */
.message-box {
  position: relative;
  width: 100%;
  max-width: 320px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  box-shadow: 0 6px 20px rgba(15, 44, 76, 0.05);
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.7s ease 0.65s forwards;
  overflow: hidden;
}

.message-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(14, 124, 123, 0.04), rgba(155, 126, 222, 0.04));
  z-index: 0;
}

.message-text {
  position: relative;
  z-index: 1;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  transition: opacity 0.4s ease, transform 0.4s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

html[lang="ar"] .message-text { font-family: var(--f-ar); font-size: 14.5px; letter-spacing: 0; }

.message-text.fade-out {
  opacity: 0;
  transform: translateY(-8px);
}

.message-text.fade-in {
  opacity: 0;
  transform: translateY(8px);
}

/* Spinner dots */
.spinner {
  display: inline-flex;
  gap: 3px;
}

.spinner span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c-primary);
  animation: dotBounce 1.2s ease-in-out infinite;
}

.spinner span:nth-child(1) { animation-delay: 0s; }
.spinner span:nth-child(2) { animation-delay: 0.15s; }
.spinner span:nth-child(3) { animation-delay: 0.3s; }

@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%           { opacity: 1; transform: translateY(-4px); }
}

/* ============================================
   PROGRESS
============================================ */
.progress-wrap {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.7s ease 0.8s forwards;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.progress-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .progress-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12.5px;
}

.progress-percent {
  font-size: 13px;
  font-weight: 700;
  color: var(--c-primary);
  font-feature-settings: "tnum";
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(14, 124, 123, 0.08);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 0%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  box-shadow: 0 0 12px rgba(14, 124, 123, 0.5);
  transition: width 0.5s cubic-bezier(0.65, 0, 0.35, 1);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

/* ============================================
   STEPS LIST
============================================ */
.steps-list {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.7s ease 0.95s forwards;
}

.step-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  transition: all 0.4s ease;
  opacity: 0.5;
}

.step-item.active {
  opacity: 1;
  border-color: rgba(14, 124, 123, 0.3);
  box-shadow: 0 4px 14px rgba(14, 124, 123, 0.08);
}

.step-item.done {
  opacity: 0.85;
  border-color: rgba(76, 175, 80, 0.3);
  background: rgba(76, 175, 80, 0.04);
}

.step-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--c-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
  position: relative;
}

.step-item.active .step-dot {
  border-color: var(--c-primary);
  background: rgba(14, 124, 123, 0.1);
}

.step-item.active .step-dot::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c-primary);
  animation: dotBounce 1.2s ease-in-out infinite;
}

.step-item.done .step-dot {
  background: var(--c-success);
  border-color: var(--c-success);
}

.step-item.done .step-dot::after {
  content: '';
  width: 8px;
  height: 5px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

.step-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  flex: 1;
  text-align: start;
}

html[lang="ar"] .step-text { font-family: var(--f-ar); font-size: 13px; letter-spacing: 0; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Brain Visual -->
        <div class="brain-wrap">
          <div class="brain-glow"></div>
          <div class="orbit-ring"></div>
          <div class="orbit-ring-inner"></div>

          <svg class="brain-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brainG" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0E7C7B"/>
                <stop offset="50%" stop-color="#5B9BD5"/>
                <stop offset="100%" stop-color="#9B7EDE"/>
              </linearGradient>
              <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#9B7EDE"/>
                <stop offset="100%" stop-color="#9B7EDE" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Brain shape -->
            <path d="M 68 88 C 58 88, 52 80, 54 72
                     C 48 68, 48 58, 56 54
                     C 56 44, 66 38, 76 42
                     C 80 34, 92 32, 100 38
                     C 108 32, 120 36, 124 44
                     C 134 42, 142 50, 140 60
                     C 146 64, 146 74, 138 78
                     C 138 84, 132 90, 124 88
                     C 120 94, 110 96, 104 92
                     C 100 98, 90 100, 84 96
                     C 78 100, 70 96, 68 88 Z"
                  fill="url(#brainG)" opacity="0.95"/>

            <!-- Brain folds -->
            <path d="M 72 72 Q 82 68 90 74" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
            <path d="M 92 58 Q 102 55 110 61" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
            <path d="M 114 70 Q 122 67 128 74" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
            <path d="M 82 86 Q 96 82 110 86" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

            <!-- Neural nodes -->
            <g class="neural-node"><circle cx="70" cy="65" r="3" fill="url(#nodeGlow)"/><circle cx="70" cy="65" r="2" fill="#fff"/></g>
            <g class="neural-node"><circle cx="100" cy="52" r="3" fill="url(#nodeGlow)"/><circle cx="100" cy="52" r="2" fill="#fff"/></g>
            <g class="neural-node"><circle cx="132" cy="60" r="3" fill="url(#nodeGlow)"/><circle cx="132" cy="60" r="2" fill="#fff"/></g>
            <g class="neural-node"><circle cx="60" cy="85" r="3" fill="url(#nodeGlow)"/><circle cx="60" cy="85" r="2" fill="#fff"/></g>
            <g class="neural-node"><circle cx="140" cy="82" r="3" fill="url(#nodeGlow)"/><circle cx="140" cy="82" r="2" fill="#fff"/></g>
            <g class="neural-node"><circle cx="100" cy="90" r="3" fill="url(#nodeGlow)"/><circle cx="100" cy="90" r="2" fill="#fff"/></g>

            <!-- Connection lines -->
            <line x1="70" y1="65" x2="100" y2="52" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="100" y1="52" x2="132" y2="60" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="70" y1="65" x2="60" y2="85" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="132" y1="60" x2="140" y2="82" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="60" y1="85" x2="100" y2="90" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="100" y1="90" x2="140" y2="82" stroke="#fff" stroke-width="0.6" opacity="0.35"/>
            <line x1="100" y1="90" x2="100" y2="52" stroke="#fff" stroke-width="0.6" opacity="0.25"/>
          </svg>
        </div>

        <!-- Text -->
        <div class="text-wrap">
          <h1 class="title" id="title">Analyzing Your Results</h1>
          <p class="subtitle" id="subtitle">Our AI is processing your cognitive data to build your personalized profile.</p>
        </div>

        <!-- Message -->
        <div class="message-box">
          <div class="message-text" id="messageText">
            <span id="messageLabel">Analyzing memory patterns</span>
            <span class="spinner"><span></span><span></span><span></span></span>
          </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-head">
            <div class="progress-label" id="progressLabel">Processing</div>
            <div class="progress-percent"><span id="progressPercent">0</span>%</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <!-- Steps -->
        <div class="steps-list" id="stepsList">
          <!-- Filled by JS -->
        </div>

      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    title: 'Analyzing Your Results',
    subtitle: 'Our AI is processing your cognitive data to build your personalized profile.',
    progressLabel: 'Processing',

    steps: [
      { key: 'memory',    text: 'Analyzing memory patterns' },
      { key: 'attention', text: 'Evaluating attention focus' },
      { key: 'speed',     text: 'Calculating processing speed' },
      { key: 'visual',    text: 'Comparing visual recognition' },
      { key: 'profile',   text: 'Generating your cognitive profile' }
    ]
  },
  ar: {
    title: 'نحلل نتائجك',
    subtitle: 'الذكاء الاصطناعي يعالج بياناتك الذهنية لبناء ملفك المخصص.',
    progressLabel: 'جاري المعالجة',

    steps: [
      { key: 'memory',    text: 'تحليل أنماط الذاكرة' },
      { key: 'attention', text: 'تقييم تركيز الانتباه' },
      { key: 'speed',     text: 'حساب سرعة المعالجة' },
      { key: 'visual',    text: 'مقارنة التمييز البصري' },
      { key: 'profile',   text: 'إنشاء ملفك الذهني' }
    ]
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('title').textContent    = t.title;
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('progressLabel').textContent = t.progressLabel;

  // Update message text if currently showing
  if (currentStepIndex < t.steps.length) {
    document.getElementById('messageLabel').textContent = t.steps[currentStepIndex].text;
  }

  // Re-render steps
  renderSteps();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   STEPS RENDER
============================================ */
let currentStepIndex = 0;

function renderSteps() {
  const t = I18N[currentLang];
  const list = document.getElementById('stepsList');
  list.innerHTML = '';

  t.steps.forEach((step, i) => {
    const item = document.createElement('div');
    item.className = 'step-item';
    if (i < currentStepIndex) item.classList.add('done');
    if (i === currentStepIndex) item.classList.add('active');

    item.innerHTML = `
      <div class="step-dot"></div>
      <div class="step-text">${step.text}</div>
    `;
    list.appendChild(item);
  });
}

/* ============================================
   ANIMATION TIMELINE
============================================ */
const TOTAL_DURATION = 10000; // 10 seconds
const STEP_DURATION = TOTAL_DURATION / 5; // 2 seconds per step

let startTime = 0;

function startAnalysis() {
  startTime = Date.now();
  renderSteps();
  tick();
}

function tick() {
  const now = Date.now();
  const elapsed = now - startTime;
  const progress = Math.min(elapsed / TOTAL_DURATION, 1);

  // Update progress bar
  document.getElementById('progressFill').style.width = (progress * 100) + '%';

  // Update percentage
  const percent = Math.round(progress * 100);
  document.getElementById('progressPercent').textContent = percent;

  // Determine current step
  const newStep = Math.min(Math.floor(elapsed / STEP_DURATION), 4);

  if (newStep !== currentStepIndex) {
    currentStepIndex = newStep;
    updateStepUI();
  }

  // When done, navigate
  if (progress >= 1) {
    setTimeout(() => {
      window.location.href = 'cognitive-profile.html';
    }, 400);
    return;
  }

  requestAnimationFrame(tick);
}

function updateStepUI() {
  const t = I18N[currentLang];

  // Fade message out
  const msg = document.getElementById('messageText');
  msg.classList.add('fade-out');

  setTimeout(() => {
    // Update text
    document.getElementById('messageLabel').textContent = t.steps[currentStepIndex].text;

    // Fade in
    msg.classList.remove('fade-out');
    msg.classList.add('fade-in');

    setTimeout(() => {
      msg.classList.remove('fade-in');
    }, 50);
  }, 380);

  // Update step items
  const items = document.querySelectorAll('.step-item');
  items.forEach((item, i) => {
    item.classList.remove('active', 'done');
    if (i < currentStepIndex) item.classList.add('done');
    if (i === currentStepIndex) item.classList.add('active');
  });
}

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
startAnalysis();
</script>
