<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-warning: #FF9800;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);
  --sh-focus: 0 0 0 4px rgba(14, 124, 123, 0.12);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.screen::-webkit-scrollbar { display: none; }

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 24px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* Logo mini */
.logo-mini {
  width: 52px; height: 52px;
  align-self: center;
  margin-top: 8px;
  opacity: 0;
  transform: scale(0.8);
  animation: logoMiniIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
}

@keyframes logoMiniIn {
  to { opacity: 1; transform: scale(1); }
}

/* Heading */
.heading-wrap {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

.heading {
  font-size: 24px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
}

html[lang="ar"] .heading { font-family: var(--f-ar); font-size: 24px; letter-spacing: 0; }

.subheading {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.5;
}

html[lang="ar"] .subheading { font-family: var(--f-ar); font-size: 14px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   TABS (Sign Up / Login)
============================================ */
.tabs {
  position: relative;
  display: flex;
  background: rgba(14, 124, 123, 0.06);
  border-radius: var(--r-pill);
  padding: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.35s forwards;
}

.tab {
  flex: 1;
  padding: 10px 12px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--c-slate);
  border-radius: var(--r-pill);
  position: relative;
  z-index: 2;
  transition: color 0.3s ease;
  text-align: center;
}

.tab.active { color: #fff; }

html[lang="ar"] .tab { font-family: var(--f-ar); font-size: 14px; }

.tab-indicator {
  position: absolute;
  top: 4px;
  left: 4px;
  width: calc(50% - 4px);
  height: calc(100% - 8px);
  background: var(--g-brand);
  border-radius: var(--r-pill);
  z-index: 1;
  transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 6px 16px rgba(14, 124, 123, 0.3);
}

html[dir="rtl"] .tab-indicator { left: auto; right: 4px; }

.tabs[data-mode="login"] .tab-indicator {
  transform: translateX(100%);
}

html[dir="rtl"] .tabs[data-mode="login"] .tab-indicator {
  transform: translateX(-100%);
}

/* ============================================
   FORM
============================================ */
.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.45s forwards;
}

.field {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  padding-inline-start: 4px;
}

html[lang="ar"] .field-label { font-family: var(--f-ar); font-size: 13px; }

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  transition: all 0.25s ease;
  overflow: hidden;
}

.input-wrap:focus-within {
  border-color: var(--c-primary);
  box-shadow: var(--sh-focus);
}

.input-wrap.error {
  border-color: var(--c-error);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

.input-icon {
  width: 18px; height: 18px;
  margin-inline-start: 14px;
  stroke: var(--c-slate);
  stroke-width: 2;
  fill: none;
  flex-shrink: 0;
  transition: stroke 0.25s ease;
}

.input-wrap:focus-within .input-icon { stroke: var(--c-primary); }

.input-field {
  flex: 1;
  padding: 15px 14px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--c-navy);
  border: none;
  outline: none;
  background: transparent;
  letter-spacing: 0.1px;
}

.input-field::placeholder {
  color: #B0B8C1;
  font-weight: 400;
}

html[lang="ar"] .input-field {
  font-family: var(--f-ar);
  font-size: 15px;
  letter-spacing: 0;
}

/* Password toggle */
.pass-toggle {
  width: 40px; height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s ease;
}

.pass-toggle svg {
  width: 18px; height: 18px;
  stroke: var(--c-slate);
  stroke-width: 2;
  fill: none;
  transition: stroke 0.2s ease;
}

.pass-toggle:hover svg { stroke: var(--c-primary); }

/* Error message */
.err-msg {
  font-size: 11.5px;
  color: var(--c-error);
  font-weight: 500;
  padding-inline-start: 4px;
  min-height: 0;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.3s ease;
}

.field.has-error .err-msg {
  min-height: 16px;
  max-height: 30px;
  opacity: 1;
  margin-top: 2px;
}

html[lang="ar"] .err-msg { font-family: var(--f-ar); font-size: 12.5px; }

/* Password strength */
.strength {
  display: flex;
  gap: 4px;
  padding: 0 4px;
  margin-top: 2px;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.3s ease;
}

.strength.visible {
  max-height: 20px;
  opacity: 1;
}

.strength-bar {
  flex: 1;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--c-border);
  transition: background 0.3s ease;
}

.strength-bar.active-weak   { background: var(--c-error); }
.strength-bar.active-medium { background: var(--c-warning); }
.strength-bar.active-strong { background: var(--c-success); }

/* ============================================
   FORGOT PASSWORD
============================================ */
.forgot {
  align-self: flex-end;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--c-primary);
  padding: 4px;
  transition: opacity 0.2s ease;
  display: none;
}

html[lang="ar"] .forgot { font-family: var(--f-ar); font-size: 13px; }

.forgot:hover { opacity: 0.7; }

.form[data-mode="login"] .forgot { display: inline-block; }
.form[data-mode="login"] .field-signup { display: none; }

/* ============================================
   PRIMARY BUTTON
============================================ */
.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 4px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 124, 123, 0.35);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

/* Loading state */
.btn-primary.loading { pointer-events: none; }
.btn-primary.loading .arrow { display: none; }
.btn-primary.loading::after {
  content: '';
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================
   DIVIDER
============================================ */
.divider-line {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--c-slate);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.55s forwards;
}

html[lang="ar"] .divider-line {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12.5px;
}

.divider-line::before,
.divider-line::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--c-border);
}

/* ============================================
   SOCIAL BUTTONS
============================================ */
.socials {
  display: flex;
  gap: 12px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.65s forwards;
}

.social-btn {
  flex: 1;
  padding: 14px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--c-navy);
  transition: all 0.25s ease;
}

.social-btn:hover {
  border-color: var(--c-primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(15, 44, 76, 0.08);
}

.social-btn:active { transform: scale(0.97); }

.social-btn svg { width: 18px; height: 18px; }

html[lang="ar"] .social-btn { font-family: var(--f-ar); font-size: 14px; }

/* ============================================
   FOOTER
============================================ */
.footer {
  text-align: center;
  font-size: 12.5px;
  color: var(--c-slate);
  padding: 8px 0 4px;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.75s forwards;
}

html[lang="ar"] .footer { font-family: var(--f-ar); font-size: 13px; }

.footer a {
  color: var(--c-primary);
  font-weight: 600;
  text-decoration: none;
  transition: opacity 0.2s ease;
}

.footer a:hover { opacity: 0.7; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Mini Logo -->
        <svg class="logo-mini" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="brandGradSm" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0E7C7B"/>
              <stop offset="50%" stop-color="#5B9BD5"/>
              <stop offset="100%" stop-color="#9B7EDE"/>
            </linearGradient>
            <linearGradient id="brainGradSm" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0E7C7B"/>
              <stop offset="100%" stop-color="#4DB6AC"/>
            </linearGradient>
            <linearGradient id="faceGradSm" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#5B9BD5"/>
              <stop offset="100%" stop-color="#9B7EDE"/>
            </linearGradient>
          </defs>

          <path d="M 105 175 C 100 160, 96 148, 94 138 C 91 124, 90 112, 92 102
                   C 94 88, 100 76, 110 70 C 118 65, 128 64, 136 68
                   C 143 72, 146 79, 145 86 C 144 92, 141 96, 141 100
                   C 141 104, 143 107, 146 108 C 149 110, 150 112, 148 114
                   C 146 116, 143 117, 142 120 C 141 123, 143 125, 146 126
                   C 148 127, 148 129, 146 130 C 143 131, 140 133, 138 137
                   C 135 142, 134 150, 135 162 C 136 170, 138 175, 138 175 Z"
                fill="url(#faceGradSm)" opacity="0.95"/>

          <path d="M 118 98 Q 124 104 130 98"
                fill="none" stroke="#0F2C4C" stroke-width="1.8"
                stroke-linecap="round" opacity="0.7"/>

          <path d="M 68 78 C 58 78, 52 70, 54 62 C 48 58, 48 48, 56 44
                   C 56 34, 66 28, 76 32 C 80 24, 92 22, 100 28
                   C 108 22, 120 26, 124 34 C 134 32, 142 40, 140 50
                   C 146 54, 146 64, 138 68 C 138 74, 132 80, 124 78
                   C 120 84, 110 86, 104 82 C 100 88, 90 90, 84 86
                   C 78 90, 70 86, 68 78 Z"
                fill="url(#brainGradSm)" opacity="0.92"/>

          <path d="M 40 100 C 45 130, 60 155, 90 165 C 70 150, 58 125, 56 100
                   C 54 78, 60 60, 76 46"
                fill="none" stroke="url(#brandGradSm)" stroke-width="3.2"
                stroke-linecap="round" opacity="0.85"/>

          <path d="M 148 26 L 151 35 L 160 38 L 151 41 L 148 50 L 145 41 L 136 38 L 145 35 Z"
                fill="url(#brandGradSm)"/>
        </svg>

        <!-- Heading -->
        <div class="heading-wrap">
          <h1 class="heading" id="heading">Create your account</h1>
          <p class="subheading" id="subheading">Let's start your cognitive journey.</p>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs" data-mode="signup">
          <div class="tab-indicator"></div>
          <button class="tab active" data-tab="signup" id="tabSignup">Sign Up</button>
          <button class="tab" data-tab="login" id="tabLogin">Login</button>
        </div>

        <!-- Form -->
        <form class="form" id="authForm" data-mode="signup" novalidate>

          <!-- Name (Sign Up only) -->
          <div class="field field-signup" data-field="name">
            <label class="field-label" id="labelName">Full Name</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" class="input-field" id="nameInput" placeholder="Lamia Ahmed" autocomplete="name">
            </div>
            <div class="err-msg" id="errName"></div>
          </div>

          <!-- Email -->
          <div class="field" data-field="email">
            <label class="field-label" id="labelEmail">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" class="input-field" id="emailInput" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="err-msg" id="errEmail"></div>
          </div>

          <!-- Password -->
          <div class="field" data-field="password">
            <label class="field-label" id="labelPassword">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" class="input-field" id="passwordInput" placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="pass-toggle" id="passToggle" aria-label="Toggle password">
                <svg id="eyeIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <!-- Strength (Sign Up only) -->
            <div class="strength" id="strength">
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
            </div>
            <div class="err-msg" id="errPassword"></div>
          </div>

          <!-- Forgot (Login only) -->
          <a href="#" class="forgot" id="forgotLink">Forgot password?</a>

          <!-- Submit -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span id="submitLabel">Create Account</span>
            <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

        </form>

        <!-- Divider -->
        <div class="divider-line" id="orText">Or continue with</div>

        <!-- Socials -->
        <div class="socials">
          <button class="social-btn" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Google</span>
          </button>
          <button class="social-btn" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#000" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Footer -->
        <div class="footer" id="footer">
          <span id="footerText">Already have an account?</span>
          <a href="#" id="footerLink">Login</a>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    headingSignup: 'Create your account',
    headingLogin:  'Welcome back',
    subSignup: "Let's start your cognitive journey.",
    subLogin:  'Continue where you left off.',

    tabSignup: 'Sign Up',
    tabLogin:  'Login',

    labelName: 'Full Name',
    labelEmail: 'Email',
    labelPassword: 'Password',
    phName: 'Lamia Ahmed',
    phEmail: 'you@example.com',
    phPassword: '••••••••',

    forgot: 'Forgot password?',

    btnSignup: 'Create Account',
    btnLogin:  'Login',

    orText: 'Or continue with',

    footerSignup: 'Already have an account?',
    footerLogin:  'New here?',
    footerLinkSignup: 'Login',
    footerLinkLogin:  'Sign Up',

    errName: 'Please enter your full name',
    errEmail: 'Please enter a valid email',
    errPassword: 'Password must be at least 6 characters'
  },
  ar: {
    headingSignup: 'أنشئ حسابك',
    headingLogin:  'مرحبًا بعودتك',
    subSignup: 'هيا نبدأ رحلتك الذهنية.',
    subLogin:  'أكمل من حيث توقفت.',

    tabSignup: 'حساب جديد',
    tabLogin:  'دخول',

    labelName: 'الاسم بالكامل',
    labelEmail: 'البريد الإلكتروني',
    labelPassword: 'كلمة المرور',
    phName: 'لمياء أحمد',
    phEmail: 'you@example.com',
    phPassword: '••••••••',

    forgot: 'نسيت كلمة المرور؟',

    btnSignup: 'إنشاء الحساب',
    btnLogin:  'دخول',

    orText: 'أو تابع باستخدام',

    footerSignup: 'لديك حساب بالفعل؟',
    footerLogin:  'مستخدم جديد؟',
    footerLinkSignup: 'دخول',
    footerLinkLogin:  'إنشاء حساب',

    errName: 'الرجاء إدخال الاسم بالكامل',
    errEmail: 'الرجاء إدخال بريد إلكتروني صحيح',
    errPassword: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

let mode = 'signup'; // 'signup' | 'login'

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  // Heading & sub
  document.getElementById('heading').textContent    = mode === 'signup' ? I18N[lang].headingSignup : I18N[lang].headingLogin;
  document.getElementById('subheading').textContent = mode === 'signup' ? I18N[lang].subSignup    : I18N[lang].subLogin;

  // Tabs
  document.getElementById('tabSignup').textContent = I18N[lang].tabSignup;
  document.getElementById('tabLogin').textContent  = I18N[lang].tabLogin;

  // Labels & placeholders
  document.getElementById('labelName').textContent       = I18N[lang].labelName;
  document.getElementById('labelEmail').textContent      = I18N[lang].labelEmail;
  document.getElementById('labelPassword').textContent   = I18N[lang].labelPassword;

  document.getElementById('nameInput').placeholder     = I18N[lang].phName;
  document.getElementById('emailInput').placeholder    = I18N[lang].phEmail;
  document.getElementById('passwordInput').placeholder = I18N[lang].phPassword;

  // Forgot
  document.getElementById('forgotLink').textContent = I18N[lang].forgot;

  // Submit button
  document.getElementById('submitLabel').textContent = mode === 'signup' ? I18N[lang].btnSignup : I18N[lang].btnLogin;

  // Divider
  document.getElementById('orText').textContent = I18N[lang].orText;

  // Footer
  document.getElementById('footerText').textContent = mode === 'signup' ? I18N[lang].footerSignup : I18N[lang].footerLogin;
  document.getElementById('footerLink').textContent = mode === 'signup' ? I18N[lang].footerLinkSignup : I18N[lang].footerLinkLogin;

  // Error messages
  refreshErrors();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   TAB SWITCHING
============================================ */
const tabs         = document.getElementById('tabs');
const tabSignup    = document.getElementById('tabSignup');
const tabLogin     = document.getElementById('tabLogin');
const authForm     = document.getElementById('authForm');
const footerLink   = document.getElementById('footerLink');

function setMode(newMode) {
  mode = newMode;
  tabs.dataset.mode = newMode;
  authForm.dataset.mode = newMode;

  tabSignup.classList.toggle('active', newMode === 'signup');
  tabLogin.classList.toggle('active',  newMode === 'login');

  clearErrors();
  applyLanguage(currentLang);
}

tabSignup.addEventListener('click', () => setMode('signup'));
tabLogin.addEventListener('click',  () => setMode('login'));
footerLink.addEventListener('click', (e) => {
  e.preventDefault();
  setMode(mode === 'signup' ? 'login' : 'signup');
});

/* ============================================
   PASSWORD VISIBILITY
============================================ */
const passToggle = document.getElementById('passToggle');
const passInput  = document.getElementById('passwordInput');
const eyeIcon    = document.getElementById('eyeIcon');

const EYE_OPEN = `
  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
  <circle cx="12" cy="12" r="3"></circle>
`;
const EYE_CLOSED = `
  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
  <line x1="1" y1="1" x2="23" y2="23"></line>
`;

passToggle.addEventListener('click', () => {
  const isPass = passInput.type === 'password';
  passInput.type = isPass ? 'text' : 'password';
  eyeIcon.innerHTML = isPass ? EYE_CLOSED : EYE_OPEN;
});

/* ============================================
   PASSWORD STRENGTH
============================================ */
const strengthBars = document.querySelectorAll('.strength-bar');
const strengthWrap = document.getElementById('strength');

passInput.addEventListener('input', () => {
  const val = passInput.value;
  strengthWrap.classList.toggle('visible', val.length > 0);

  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  score = Math.min(score, 4);

  const cls = score <= 1 ? 'active-weak' : score <= 3 ? 'active-medium' : 'active-strong';

  strengthBars.forEach((bar, i) => {
    bar.className = 'strength-bar' + (i < score ? ' ' + cls : '');
  });
});

/* ============================================
   VALIDATION
============================================ */
const fields = {
  name:     document.getElementById('nameInput'),
  email:    document.getElementById('emailInput'),
  password: document.getElementById('passwordInput')
};

const errEls = {
  name:     document.getElementById('errName'),
  email:    document.getElementById('errEmail'),
  password: document.getElementById('errPassword')
};

const fieldWraps = {
  name:     document.querySelector('[data-field="name"]'),
  email:    document.querySelector('[data-field="email"]'),
  password: document.querySelector('[data-field="password"]')
};

const errKeys = {
  name:     'errName',
  email:    'errEmail',
  password: 'errPassword'
};

function showError(field, key) {
  fieldWraps[field].classList.add('has-error');
  fieldWraps[field].querySelector('.input-wrap').classList.add('error');
  errEls[field].textContent = I18N[currentLang][key];
}

function clearFieldError(field) {
  fieldWraps[field].classList.remove('has-error');
  fieldWraps[field].querySelector('.input-wrap').classList.remove('error');
  errEls[field].textContent = '';
}

function clearErrors() {
  Object.keys(fields).forEach(clearFieldError);
}

function refreshErrors() {
  Object.keys(fields).forEach(field => {
    if (fieldWraps[field].classList.contains('has-error')) {
      errEls[field].textContent = I18N[currentLang][errKeys[field]];
    }
  });
}

function validate() {
  let valid = true;
  clearErrors();

  if (mode === 'signup') {
    // Name
    if (!fields.name.value.trim() || fields.name.value.trim().length < 2) {
      showError('name', 'errName');
      valid = false;
    }
  }

  // Email
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(fields.email.value.trim())) {
    showError('email', 'errEmail');
    valid = false;
  }

  // Password
  if (fields.password.value.length < 6) {
    showError('password', 'errPassword');
    valid = false;
  }

  return valid;
}

/* Clear error on input */
Object.keys(fields).forEach(field => {
  fields[field].addEventListener('input', () => {
    if (fieldWraps[field].classList.contains('has-error')) {
      clearFieldError(field);
    }
  });
});

/* ============================================
   FORM SUBMIT
============================================ */
const submitBtn = document.getElementById('submitBtn');

authForm.addEventListener('submit', (e) => {
  e.preventDefault();

  if (!validate()) return;

  submitBtn.classList.add('loading');

  setTimeout(() => {
    submitBtn.classList.remove('loading');

    if (mode === 'signup') {
      localStorage.setItem('memento_user_name', fields.name.value.trim());
      window.location.href = 'account-type.html';
    } else {
      localStorage.setItem('memento_user_name', 'User');
      window.location.href = 'home.html';
    }
  }, 1400);
});

/* ============================================
   BACK BUTTON
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'onboarding.html';
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
</script>

</body>
</html>
