<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Account Type</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-care: linear-gradient(135deg, #9B7EDE 0%, #5B9BD5 100%);
  --g-user: linear-gradient(135deg, #0E7C7B 0%, #4DB6AC 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);
  --sh-focus: 0 0 0 4px rgba(14, 124, 123, 0.12);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* PHONE FRAME */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* SCREEN */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.screen::-webkit-scrollbar { display: none; }

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 32px 26px 30px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.15s forwards;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(14, 124, 123, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 33%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 0 10px rgba(14, 124, 123, 0.3);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

.progress-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.4px;
  white-space: nowrap;
}

html[lang="ar"] .progress-text { font-family: var(--f-ar); letter-spacing: 0; font-size: 12.5px; }

/* HEADING */
.heading-wrap {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

.heading {
  font-size: 25px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
}

html[lang="ar"] .heading { font-family: var(--f-ar); font-size: 24px; letter-spacing: 0; }

.subheading {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.55;
  max-width: 300px;
  margin: 0 auto;
}

html[lang="ar"] .subheading { font-family: var(--f-ar); font-size: 14.5px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* OPTIONS */
.options {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 4px;
}

.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 20px;
  background: #fff;
  border: 2px solid var(--c-border);
  border-radius: var(--r-xl);
  text-align: start;
  transition: all 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
}

.option:nth-child(1) { animation: fadeUp 0.6s ease 0.4s forwards; }
.option:nth-child(2) { animation: fadeUp 0.6s ease 0.52s forwards; }

.option::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--g-brand);
  opacity: 0;
  transition: opacity 0.35s ease;
  z-index: 0;
}

.option:hover {
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(15, 44, 76, 0.08);
}

.option.selected {
  border-color: transparent;
  box-shadow: 0 16px 40px rgba(14, 124, 123, 0.22);
  transform: translateY(-3px);
}

.option.selected::before { opacity: 1; }

/* Illustration */
.option-illus {
  position: relative;
  z-index: 2;
  width: 62px;
  height: 62px;
  flex-shrink: 0;
  border-radius: var(--r-lg);
  background: rgba(14, 124, 123, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.35s ease;
}

.option.selected .option-illus {
  background: rgba(255, 255, 255, 0.18);
}

.option-illus svg {
  width: 38px;
  height: 38px;
}

/* Text */
.option-text {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: color 0.35s ease;
}

.option-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  transition: color 0.35s ease;
}

html[lang="ar"] .option-title { font-family: var(--f-ar); font-size: 17px; letter-spacing: 0; }

.option-desc {
  font-size: 12.5px;
  color: var(--c-slate);
  line-height: 1.5;
  transition: color 0.35s ease;
}

html[lang="ar"] .option-desc { font-family: var(--f-ar); font-size: 13.5px; }

.option.selected .option-title { color: #fff; }
.option.selected .option-desc  { color: rgba(255, 255, 255, 0.85); }

/* Check */
.option-check {
  position: relative;
  z-index: 2;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(14, 124, 123, 0.08);
  border: 2px solid var(--c-border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.option-check svg {
  width: 14px;
  height: 14px;
  stroke: #fff;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.option.selected .option-check {
  background: #fff;
  border-color: #fff;
}

.option.selected .option-check svg {
  stroke: var(--c-primary);
  opacity: 1;
  transform: scale(1);
}

/* INFO NOTE */
.info-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(155, 126, 222, 0.08);
  border-radius: var(--r-md);
  border: 1px solid rgba(155, 126, 222, 0.18);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.65s forwards;
  margin-top: auto;
}

.info-note svg {
  width: 16px;
  height: 16px;
  stroke: var(--c-secondary);
  stroke-width: 2.2;
  fill: none;
  flex-shrink: 0;
  margin-top: 2px;
}

.info-text {
  font-size: 12px;
  color: var(--c-slate);
  line-height: 1.55;
}

html[lang="ar"] .info-text { font-family: var(--f-ar); font-size: 13px; }

/* BOTTOM */
.bottom {
  position: relative;
  z-index: 10;
  padding: 20px 26px 44px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 124, 123, 0.35);
}

.btn-primary:active:not(:disabled) { transform: scale(0.97); }

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.15);
}

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover:not(:disabled) .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">Step 1 of 3</div>
        </div>

        <!-- Heading -->
        <div class="heading-wrap">
          <h1 class="heading" id="heading">Who is this account for?</h1>
          <p class="subheading" id="subheading">We'll tailor the experience to match the right cognitive profile.</p>
        </div>

        <!-- Options -->
        <div class="options">

          <!-- Myself -->
          <button class="option" data-value="myself" id="optMyself">
            <div class="option-illus">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0E7C7B"/>
                    <stop offset="100%" stop-color="#4DB6AC"/>
                  </linearGradient>
                  <linearGradient id="userGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0E7C7B" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#4DB6AC" stop-opacity="0.2"/>
                  </linearGradient>
                </defs>
                <circle cx="32" cy="24" r="10" fill="url(#userGrad)"/>
                <path d="M 14 52 C 14 42, 22 36, 32 36 C 42 36, 50 42, 50 52 L 50 56 C 50 57.1, 49.1 58, 48 58 L 16 58 C 14.9 58, 14 57.1, 14 56 Z"
                      fill="url(#userGradLight)"/>
                <path d="M 14 52 C 14 42, 22 36, 32 36 C 42 36, 50 42, 50 52 L 50 56 C 50 57.1, 49.1 58, 48 58 L 16 58 C 14.9 58, 14 57.1, 14 56 Z"
                      fill="none" stroke="url(#userGrad)" stroke-width="1.5" opacity="0.7"/>
              </svg>
            </div>
            <div class="option-text">
              <div class="option-title" id="titleMyself">Myself</div>
              <div class="option-desc" id="descMyself">I'll be training on my own.</div>
            </div>
            <div class="option-check">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </button>

          <!-- Someone I Care For -->
          <button class="option" data-value="caregiver" id="optCaregiver">
            <div class="option-illus">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#9B7EDE"/>
                    <stop offset="100%" stop-color="#5B9BD5"/>
                  </linearGradient>
                  <linearGradient id="careGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#9B7EDE" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#5B9BD5" stop-opacity="0.2"/>
                  </linearGradient>
                </defs>

                <!-- Smaller person (the one being cared for) -->
                <circle cx="22" cy="26" r="7" fill="url(#careGrad)"/>
                <path d="M 10 48 C 10 41, 15 37, 22 37 C 29 37, 34 41, 34 48 L 34 51 C 34 52, 33.1 53, 32 53 L 12 53 C 10.9 53, 10 52, 10 51 Z"
                      fill="url(#careGradLight)"/>

                <!-- Bigger person (caregiver) -->
                <circle cx="43" cy="22" r="9" fill="url(#careGrad)"/>
                <path d="M 28 50 C 28 40, 35 34, 43 34 C 51 34, 58 40, 58 50 L 58 54 C 58 55, 57.1 56, 56 56 L 30 56 C 28.9 56, 28 55, 28 54 Z"
                      fill="url(#careGradLight)"/>
                <path d="M 28 50 C 28 40, 35 34, 43 34 C 51 34, 58 40, 58 50 L 58 54 C 58 55, 57.1 56, 56 56 L 30 56 C 28.9 56, 28 55, 28 54 Z"
                      fill="none" stroke="url(#careGrad)" stroke-width="1.5" opacity="0.7"/>

                <!-- Heart -->
                <path d="M 32 22 C 32 18, 28 16, 26 18 C 24 20, 26 23, 32 27 C 38 23, 40 20, 38 18 C 36 16, 32 18, 32 22 Z"
                      fill="#E8A0BF" opacity="0.9"/>
              </svg>
            </div>
            <div class="option-text">
              <div class="option-title" id="titleCaregiver">Someone I care for</div>
              <div class="option-desc" id="descCaregiver">A family member or loved one I support.</div>
            </div>
            <div class="option-check">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </button>

        </div>

        <!-- Info Note -->
        <div class="info-note">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div class="info-text" id="infoText">
            If you choose "Someone I care for", we'll help you build a personalized memory bank and cognitive training plan for them.
          </div>
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="continueBtn" disabled>
          <span id="continueLabel">Continue</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    progress: 'Step 1 of 3',
    heading: 'Who is this account for?',
    subheading: "We'll tailor the experience to match the right cognitive profile.",

    titleMyself: 'Myself',
    descMyself: "I'll be training on my own.",

    titleCaregiver: 'Someone I care for',
    descCaregiver: "A family member or loved one I support.",

    infoText: 'If you choose "Someone I care for", we\'ll help you build a personalized memory bank and cognitive training plan for them.',

    continue: 'Continue'
  },
  ar: {
    progress: 'الخطوة 1 من 3',
    heading: 'لمن هذا الحساب؟',
    subheading: 'سنقوم بتخصيص التجربة لتتناسب مع الملف الذهني المناسب.',

    titleMyself: 'لنفسي',
    descMyself: 'سأتدرب بنفسي.',

    titleCaregiver: 'شخص أعتني به',
    descCaregiver: 'فرد من العائلة أو شخص عزيز أدعمه.',

    infoText: 'إذا اخترت "شخص أعتني به"، سنساعدك على بناء بنك ذكريات شخصي وخطة تدريب ذهني مخصصة له.',

    continue: 'متابعة'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('progressText').textContent = t.progress;
  document.getElementById('heading').textContent      = t.heading;
  document.getElementById('subheading').textContent   = t.subheading;

  document.getElementById('titleMyself').textContent  = t.titleMyself;
  document.getElementById('descMyself').textContent   = t.descMyself;

  document.getElementById('titleCaregiver').textContent   = t.titleCaregiver;
  document.getElementById('descCaregiver').textContent    = t.descCaregiver;

  document.getElementById('infoText').textContent     = t.infoText;
  document.getElementById('continueLabel').textContent = t.continue;
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   OPTION SELECTION
============================================ */
const options     = document.querySelectorAll('.option');
const continueBtn = document.getElementById('continueBtn');

let selectedValue = null;

options.forEach(opt => {
  opt.addEventListener('click', () => {
    options.forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedValue = opt.dataset.value;
    continueBtn.disabled = false;
    localStorage.setItem('memento_account_type', selectedValue);
  });
});

/* ============================================
   CONTINUE
============================================ */
continueBtn.addEventListener('click', () => {
  if (!selectedValue) return;

  continueBtn.style.transform = 'scale(0.96)';
  setTimeout(() => { continueBtn.style.transform = ''; }, 150);

  setTimeout(() => {
    if (selectedValue === 'myself') {
      window.location.href = 'profile-setup.html';
    } else {
      // ✅ Caregiver Mode: go to Care Profile Setup
      window.location.href = 'care-profile-setup.html';
    }
  }, 250);
});

/* ============================================
   BACK BUTTON
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'signup.html';
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
</script>

</body>
</html>
