<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Weekly Schedule</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-warning: #FF9800;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);
  --sh-today: 0 12px 32px rgba(14, 124, 123, 0.28);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }

/* ============================================
   HEADER
============================================ */
.header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.1s forwards;
}

.header-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.2;
}

html[lang="ar"] .header-title { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.header-sub {
  font-size: 13px;
  color: var(--c-slate);
  line-height: 1.5;
}

html[lang="ar"] .header-sub { font-family: var(--f-ar); font-size: 14px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   STATS CARDS
============================================ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

.stat-card {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
}

.stat-card.s1::before { background: var(--g-brand); }
.stat-card.s2::before { background: linear-gradient(180deg, #FF9800, #FFB74D); }

.stat-icon {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.stat-card.s1 .stat-icon { background: linear-gradient(135deg, #0E7C7B, #4DB6AC); }
.stat-card.s2 .stat-icon { background: linear-gradient(135deg, #FF9800, #FFB74D); }

.stat-icon svg {
  width: 15px;
  height: 15px;
  stroke: #fff;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.8px;
  line-height: 1;
  font-feature-settings: "tnum";
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.stat-value small {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0;
}

.stat-label {
  font-size: 10.5px;
  color: var(--c-slate);
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

/* ============================================
   SECTION HEAD
============================================ */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline-start: 4px;
  margin-top: 2px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.4s forwards;
}

.section-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; letter-spacing: 0; }

/* ============================================
   DAYS LIST
============================================ */
.days-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 4px;
}

.day-card {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(14px);
  animation: dayIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes dayIn {
  to { opacity: 1; transform: translateY(0); }
}

.day-card:nth-child(1) { animation-delay: 0.45s; }
.day-card:nth-child(2) { animation-delay: 0.50s; }
.day-card:nth-child(3) { animation-delay: 0.55s; }
.day-card:nth-child(4) { animation-delay: 0.60s; }
.day-card:nth-child(5) { animation-delay: 0.65s; }
.day-card:nth-child(6) { animation-delay: 0.70s; }
.day-card:nth-child(7) { animation-delay: 0.75s; }

/* Today's card */
.day-card.today {
  border-color: transparent;
  background:
    linear-gradient(#fff, #fff) padding-box,
    var(--g-brand) border-box;
  border: 2px solid transparent;
  box-shadow: var(--sh-today);
  transform: scale(1.01);
}

.day-card.today::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%;
  transform: translateX(-50%);
  padding: 2px 10px;
  background: var(--g-brand);
  color: #fff;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  text-transform: uppercase;
  box-shadow: 0 4px 10px rgba(14, 124, 123, 0.3);
}

html[lang="ar"] .day-card.today::before {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 9.5px;
}

/* Rest day */
.day-card.rest {
  background: rgba(14, 124, 123, 0.03);
  border-style: dashed;
}

.day-card.rest .day-card-inner {
  opacity: 0.6;
}

/* Day head */
.day-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  min-width: 46px;
}

.day-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

html[lang="ar"] .day-name {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
}

.day-card.today .day-name {
  color: var(--c-primary);
}

.day-num {
  font-size: 20px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.8px;
  font-feature-settings: "tnum";
  line-height: 1;
}

.day-card.today .day-num {
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Divider */
.day-divider {
  width: 1px;
  height: 34px;
  background: var(--c-border);
  flex-shrink: 0;
}

/* Sessions */
.day-sessions {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.session-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.session-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.session-icon svg {
  width: 13px;
  height: 13px;
  stroke: #fff;
  stroke-width: 2.3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  position: relative;
  z-index: 2;
}

.session-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
}

.session-icon.memory::before    { background: linear-gradient(135deg, #0E7C7B, #4DB6AC); }
.session-icon.attention::before { background: linear-gradient(135deg, #E57373, #FF9800); }
.session-icon.speed::before     { background: linear-gradient(135deg, #5B9BD5, #4DB6AC); }
.session-icon.problem::before   { background: linear-gradient(135deg, #9B7EDE, #5B9BD5); }
.session-icon.visual::before    { background: linear-gradient(135deg, #4DB6AC, #9B7EDE); }
.session-icon.language::before  { background: linear-gradient(135deg, #FF9800, #E8A0BF); }
.session-icon.numerical::before { background: linear-gradient(135deg, #5B9BD5, #9B7EDE); }

.session-text {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}

.session-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .session-name { font-family: var(--f-ar); font-size: 13.5px; letter-spacing: 0; }

.session-time {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--c-primary);
  background: rgba(14, 124, 123, 0.1);
  padding: 2px 7px;
  border-radius: var(--r-pill);
  flex-shrink: 0;
  font-feature-settings: "tnum";
}

html[lang="ar"] .session-time { font-family: var(--f-ar); font-size: 11.5px; }

/* Rest content */
.rest-content {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.rest-icon {
  font-size: 18px;
  line-height: 1;
}

.rest-text {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--c-slate);
  font-style: italic;
  letter-spacing: 0.1px;
}

html[lang="ar"] .rest-text { font-family: var(--f-ar); font-size: 13.5px; letter-spacing: 0; }

/* Day total */
.day-total {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  background: rgba(14, 124, 123, 0.08);
  border-radius: var(--r-pill);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--c-primary);
  flex-shrink: 0;
  font-feature-settings: "tnum";
}

html[lang="ar"] .day-total { font-family: var(--f-ar); font-size: 11.5px; }

.day-total svg {
  width: 11px;
  height: 11px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ============================================
   BOTTOM
============================================ */
.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 18px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.32);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.7s ease 0.9s forwards;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(14, 124, 123, 0.4);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16.5px; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Header -->
        <div class="header">
          <h1 class="header-title" id="headerTitle">This Week</h1>
          <p class="header-sub" id="headerSub">Your personalized training schedule.</p>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card s1">
            <div class="stat-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <div class="stat-value"><span id="statSessions">0</span><small id="statSessionsUnit">/ week</small></div>
            <div class="stat-label" id="statSessionsLabel">Sessions</div>
          </div>

          <div class="stat-card s2">
            <div class="stat-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <div class="stat-value"><span id="statMinutes">0</span><small id="statMinutesUnit">min</small></div>
            <div class="stat-label" id="statMinutesLabel">Total Time</div>
          </div>
        </div>

        <!-- Section Head -->
        <div class="section-head">
          <div class="section-title" id="sectionTitle">Weekly Plan</div>
        </div>

        <!-- Days List -->
        <div class="days-list" id="daysList">
          <!-- Filled by JS -->
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="nextBtn">
          <span id="nextLabel">Go to Home</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    headerTitle: 'This Week',
    headerSub: 'Your personalized training schedule.',
    sectionTitle: 'Weekly Plan',
    nextLabel: 'Go to Home',

    today: 'Today',
    restDay: 'Rest day',
    sessionsUnit: '/ week',
    minutesUnit: 'min',
    sessionsLabel: 'Sessions',
    minutesLabel: 'Total Time',

    dayFullNames: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
    dayShortNames: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],

    skills: {
      memory:    'Memory',
      attention: 'Attention',
      speed:     'Processing Speed',
      problem:   'Problem Solving',
      visual:    'Visual Skills',
      language:  'Language',
      numerical: 'Numerical'
    }
  },
  ar: {
    headerTitle: 'هذا الأسبوع',
    headerSub: 'جدولك التدريبي المخصص.',
    sectionTitle: 'الخطة الأسبوعية',
    nextLabel: 'الذهاب للرئيسية',

    today: 'اليوم',
    restDay: 'يوم راحة',
    sessionsUnit: '/ أسبوع',
    minutesUnit: 'دقيقة',
    sessionsLabel: 'الجلسات',
    minutesLabel: 'الوقت الإجمالي',

    dayFullNames: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'],
    dayShortNames: ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'],

    skills: {
      memory:    'الذاكرة',
      attention: 'الانتباه',
      speed:     'سرعة المعالجة',
      problem:   'حل المشكلات',
      visual:    'المهارات البصرية',
      language:  'اللغة',
      numerical: 'الرقمي'
    }
  }
};

/* ============================================
   SKILL ICONS
============================================ */
const SKILL_ICONS = {
  memory: `<svg viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path></svg>`,
  attention: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`,
  speed: `<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`,
  problem: `<svg viewBox="0 0 24 24"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg>`,
  visual: `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  language: `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
  numerical: `<svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>`
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

let currentSchedule = null;

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('headerTitle').textContent   = t.headerTitle;
  document.getElementById('headerSub').textContent     = t.headerSub;
  document.getElementById('sectionTitle').textContent  = t.sectionTitle;
  document.getElementById('nextLabel').textContent     = t.nextLabel;
  document.getElementById('statSessionsUnit').textContent  = t.sessionsUnit;
  document.getElementById('statMinutesUnit').textContent   = t.minutesUnit;
  document.getElementById('statSessionsLabel').textContent = t.sessionsLabel;
  document.getElementById('statMinutesLabel').textContent  = t.minutesLabel;

  renderSchedule();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   BUILD SCHEDULE
============================================ */
function buildSchedule() {
  // Read plan
  let plan = [];
  try {
    plan = JSON.parse(localStorage.getItem('memento_personalized_plan') || '[]');
  } catch (e) { plan = []; }

  // Fallback plan (لو مفيش بيانات)
  if (!plan || plan.length === 0) {
    plan = [
      { key: 'memory',    rank: 1, sessions: 3, minutes: 10 },
      { key: 'attention', rank: 2, sessions: 2, minutes: 10 },
      { key: 'speed',     rank: 3, sessions: 2, minutes: 8  }
    ];
  }

  // Read training days (from profile-setup)
  let trainingDays = [];
  try {
    trainingDays = JSON.parse(localStorage.getItem('memento_days') || '[]');
  } catch (e) { trainingDays = []; }

  // Fallback days
  if (!trainingDays || trainingDays.length === 0) {
    trainingDays = ['sun', 'tue', 'thu', 'sat'];
  }

  // Order days correctly (sun → sat)
  const dayOrder = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const dayMap = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  const sortedDays = [...trainingDays].sort((a, b) => dayMap[a] - dayMap[b]);

  // Build a flat list of all sessions from priorities
  // Priority 1 → repeat more; Priority 3 → less
  const allSessions = [];
  plan.forEach(p => {
    for (let i = 0; i < p.sessions; i++) {
      allSessions.push({
        key: p.key,
        minutes: p.minutes,
        rank: p.rank
      });
    }
  });

  // Distribute round-robin across training days
  const daySessions = {};
  sortedDays.forEach(d => { daySessions[d] = []; });

  allSessions.forEach((sess, i) => {
    const day = sortedDays[i % sortedDays.length];
    daySessions[day].push(sess);
  });

  // Today's index (JS: 0=Sun, ... 6=Sat)
  const todayIdx = new Date().getDay();
  const todayKey = dayOrder[todayIdx];

  // Build schedule array (7 days)
  const schedule = dayOrder.map((dayKey, idx) => ({
    key: dayKey,
    dayIndex: idx,
    isToday: idx === todayIdx,
    sessions: daySessions[dayKey] || [],
    isRest: !daySessions[dayKey] || daySessions[dayKey].length === 0
  }));

  // Compute totals
  const totalSessions = allSessions.length;
  const totalMinutes = allSessions.reduce((sum, s) => sum + s.minutes, 0);

  return { schedule, totalSessions, totalMinutes };
}

/* ============================================
   RENDER SCHEDULE
============================================ */
function renderSchedule() {
  const t = I18N[currentLang];
  const data = buildSchedule();
  currentSchedule = data;

  // Update stats
  document.getElementById('statSessions').textContent = data.totalSessions;
  document.getElementById('statMinutes').textContent  = data.totalMinutes;

  // Render days
  const container = document.getElementById('daysList');
  container.innerHTML = '';

  data.schedule.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card';
    if (day.isToday) card.classList.add('today');
    if (day.isRest)  card.classList.add('rest');

    // Day head
    let inner = `
      <div class="day-head">
        <div class="day-name">${t.dayShortNames[day.dayIndex]}</div>
      </div>
      <div class="day-divider"></div>
    `;

    // Sessions or rest
    if (day.isRest) {
      inner += `
        <div class="rest-content">
          <span class="rest-icon">😴</span>
          <span class="rest-text">${t.restDay}</span>
        </div>
      `;
    } else {
      const totalMin = day.sessions.reduce((s, x) => s + x.minutes, 0);
      const sessionsHtml = day.sessions.map(s => `
        <div class="session-row">
          <div class="session-icon ${s.key}">${SKILL_ICONS[s.key]}</div>
          <div class="session-text">
            <span class="session-name">${t.skills[s.key]}</span>
            <span class="session-time">${s.minutes} ${t.minutesUnit}</span>
          </div>
        </div>
      `).join('');

      inner += `
        <div class="day-sessions">
          ${sessionsHtml}
        </div>
        <div class="day-total">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          ${totalMin} ${t.minutesUnit}
        </div>
      `;
    }

    card.innerHTML = inner;

    // Set today badge content
    if (day.isToday) {
      card.setAttribute('data-today-label', t.today);
    }

    container.appendChild(card);
  });

  // Insert "TODAY" text into the ::before via dynamic CSS
  // (::before can't be set via JS directly, so we inject a style)
  injectTodayStyle();
}

function injectTodayStyle() {
  const t = I18N[currentLang];
  const styleId = 'today-badge-style';
  let styleEl = document.getElementById(styleId);
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = styleId;
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `
    .day-card.today::before {
      content: '${t.today}';
    }
  `;
}

/* ============================================
   BACK
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'personalized-plan.html';
});

/* ============================================
   NEXT
============================================ */
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => { btn.style.transform = ''; }, 150);

  setTimeout(() => {
    window.location.href = 'home.html';
  }, 250);
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
</script>

</body>
</html>
