<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Splash</title>

<!-- Fonts: Inter + IBM Plex Sans Arabic -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS — Omega Design System
============================================ */
:root {
  /* Brand Colors */
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;

  /* Status */
  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;

  /* Neutrals */
  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;

  /* Gradients */
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);

  /* Radii */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* Shadows */
  --sh-soft: 0 8px 30px rgba(15, 23, 42, 0.06);

  /* Fonts */
  --f-en: 'Inter', system-ui, sans-serif;
  --f-ar: 'IBM Plex Sans Arabic', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

/* ============================================
   SPLASH CONTENT
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 25% 15%, rgba(139, 92, 246, 0.10), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(14, 148, 135, 0.10), transparent 50%);
  pointer-events: none;
}

/* ============================================
   TOP BAR — Language Toggle
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 52px 22px 0;
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   MAIN
============================================ */
.main {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 30px;
  gap: 24px;
  margin-top: -20px;
}

/* ============ LOGO ICON ============ */
.logo-wrap {
  position: relative;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.6);
  animation: logoIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
}

.logo-wrap::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 148, 135, 0.22) 0%, transparent 60%);
  filter: blur(24px);
  z-index: -1;
  animation: pulseGlow 3s ease-in-out infinite;
}

@keyframes logoIn {
  0%   { opacity: 0; transform: scale(0.6) rotate(-8deg); }
  60%  { opacity: 1; transform: scale(1.06) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50%      { opacity: 0.9; transform: scale(1.1); }
}

.logo-svg { width: 100%; height: 100%; overflow: visible; }

/* Sprout gentle sway */
.sprout {
  transform-origin: 100px 118px;
  animation: sproutSway 4s ease-in-out infinite;
}

@keyframes sproutSway {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(3deg); }
}

/* Sparkle twinkle */
.sparkle {
  transform-origin: center;
  animation: sparkleTwinkle 2.5s ease-in-out infinite;
}

@keyframes sparkleTwinkle {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  50%      { transform: scale(1.3) rotate(45deg); opacity: 0.7; }
}

/* ============ WORDMARK ============ */
.wordmark-wrap {
  text-align: center;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.7s ease 0.9s forwards;
}

.wordmark {
  font-family: var(--f-en);
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

html[lang="ar"] .wordmark {
  font-family: var(--f-ar);
  letter-spacing: 0;
  font-size: 44px;
}

/* ============ TAGLINE ============ */
.tagline {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-slate);
  text-align: center;
  line-height: 1.6;
  letter-spacing: 0.3px;
  max-width: 260px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.7s ease 1.15s forwards;
}

html[lang="ar"] .tagline {
  font-family: var(--f-ar);
  font-size: 14px;
  letter-spacing: 0;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============ BOTTOM ============ */
.bottom {
  position: relative;
  z-index: 5;
  padding: 0 40px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  opacity: 0;
  animation: fadeUp 0.7s ease 1.5s forwards;
}

.loading-bar {
  width: 100%;
  max-width: 180px;
  height: 4px;
  background: rgba(14, 148, 135, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.loading-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 0%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  animation: loadBar 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  box-shadow: 0 0 12px rgba(14, 148, 135, 0.4);
}

@keyframes loadBar {
  0%   { width: 0%; }
  30%  { width: 45%; }
  70%  { width: 78%; }
  100% { width: 100%; }
}

.loading-text {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--c-slate);
  opacity: 0.7;
}

html[lang="ar"] .loading-text {
  font-family: var(--f-ar);
  letter-spacing: 0;
  text-transform: none;
  font-size: 12px;
}

/* ============ PAGE TRANSITION ============ */
.screen.fade-out {
  animation: fadeOutScreen 0.5s ease forwards;
}

@keyframes fadeOutScreen {
  to { opacity: 0; transform: scale(1.02); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen">

      <!-- Language Toggle -->
      <div class="topbar">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Main Content -->
      <div class="main">

        <!-- ============ LOGO ICON — Omega with Sprout ============ -->
        <div class="logo-wrap">
          <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Omega shape gradient: Teal → Light Teal → Blue -->
              <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#0E9487"/>
                <stop offset="55%"  stop-color="#2EC4B6"/>
                <stop offset="100%" stop-color="#3B82F6"/>
              </linearGradient>

              <!-- Sprout gradient: Dark teal → Teal -->
              <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"   stop-color="#2EC4B6"/>
                <stop offset="100%" stop-color="#076B5F"/>
              </linearGradient>
            </defs>

            <!-- ============================================
                 THE OMEGA (Ω) SHAPE
            ============================================ -->
            <g>
              <!-- Main omega body -->
              <path d="M 60 142
                       C 44 122 36 98 44 74
                       C 54 44 76 28 100 28
                       C 124 28 146 44 156 74
                       C 164 98 156 122 140 142"
                    fill="none"
                    stroke="url(#omegaGrad)"
                    stroke-width="21"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

              <!-- Left foot -->
              <path d="M 60 142
                       Q 52 150 42 152"
                    fill="none"
                    stroke="url(#omegaGrad)"
                    stroke-width="21"
                    stroke-linecap="round"/>

              <!-- Right foot -->
              <path d="M 140 142
                       Q 148 150 158 152"
                    fill="none"
                    stroke="url(#omegaGrad)"
                    stroke-width="21"
                    stroke-linecap="round"/>

              <!-- Subtle inner highlight -->
              <path d="M 74 88
                       C 68 74 76 56 92 46"
                    fill="none"
                    stroke="#fff"
                    stroke-width="3"
                    stroke-linecap="round"
                    opacity="0.25"/>
            </g>

            <!-- ============================================
                 THE SPROUT — Growth inside the mind
            ============================================ -->
            <g class="sprout">
              <!-- Stem -->
              <path d="M 100 78 L 100 118"
                    stroke="url(#sproutGrad)"
                    stroke-width="4.5"
                    stroke-linecap="round"/>

              <!-- Left leaf -->
              <path d="M 100 108
                       Q 84 104 76 86
                       Q 92 84 100 100
                       Z"
                    fill="url(#sproutGrad)"/>

              <!-- Right leaf -->
              <path d="M 100 100
                       Q 116 96 124 78
                       Q 108 76 100 92
                       Z"
                    fill="url(#sproutGrad)"/>
            </g>

            <!-- Sparkle (top right) -->
            <g class="sparkle" style="transform-origin: 162px 42px;">
              <path d="M 162 30
                       L 164.5 39
                       L 173 41.5
                       L 164.5 44
                       L 162 53
                       L 159.5 44
                       L 151 41.5
                       L 159.5 39
                       Z"
                    fill="#3B82F6"
                    opacity="0.85"/>
            </g>

            <!-- Small dot accent -->
            <circle cx="38" cy="70" r="3.5"
                    fill="#2EC4B6"
                    opacity="0.55"/>
          </svg>
        </div>

        <!-- ============ WORDMARK: Omega ============ -->
        <div class="wordmark-wrap">
          <h1 class="wordmark">Omega</h1>
          <p class="tagline" id="taglineText">Train Your Mind. Support Your Memories.</p>
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <div class="loading-bar"></div>
        <div class="loading-text" id="loadingText">Loading your experience...</div>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    tagline: 'Train Your Mind. Support Your Memories.',
    loading: 'Loading your experience...'
  },
  ar: {
    tagline: 'درّب عقلك. ادعم ذاكرتك.',
    loading: 'جاري تجهيز التجربة...'
  }
};

/* ============================================
   LANGUAGE STATE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const taglineEl   = document.getElementById('taglineText');
const loadingEl   = document.getElementById('loadingText');
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);

  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  taglineEl.textContent = I18N[lang].tagline;
  loadingEl.textContent = I18N[lang].loading;

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

applyLanguage(currentLang);

/* ============================================
   AUTO NAVIGATE
============================================ */
const screenEl = document.getElementById('screen');
const NEXT_PAGE = 'onboarding.html';
const REDIRECT_DELAY = 3800;

setTimeout(() => {
  screenEl.classList.add('fade-out');
  setTimeout(() => {
    window.location.href = NEXT_PAGE;
  }, 480);
}, REDIRECT_DELAY);
</script>

</body>
</html>
