 <!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Profile Setup</title>

<!-- ✅ الخطوط الأصلية: Poppins + Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS — Omega Design System
============================================ */
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;

  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;

  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;

  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 23, 42, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 148, 135, 0.18);
  --sh-focus: 0 0 0 4px rgba(14, 148, 135, 0.12);

  /* ✅ الخطوط الأصلية */
  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.screen::-webkit-scrollbar { display: none; }

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 148, 135, 0.05), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 32px 26px 30px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.15s forwards;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(14, 148, 135, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 66%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 0 10px rgba(14, 148, 135, 0.3);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

.progress-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.4px;
  white-space: nowrap;
}

html[lang="ar"] .progress-text { font-family: var(--f-ar); letter-spacing: 0; font-size: 12.5px; }

/* Heading */
.heading-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

.heading {
  font-size: 24px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
}

html[lang="ar"] .heading { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.subheading {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.55;
}

html[lang="ar"] .subheading { font-family: var(--f-ar); font-size: 14.5px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   ✅ SECTION — العمر بس (مبسط)
============================================ */
.section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.6s ease 0.4s forwards;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title .num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--g-brand);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(14, 148, 135, 0.25);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14px; letter-spacing: 0; }

/* ============================================
   AGE STEPPER
============================================ */
.age-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  transition: all 0.25s ease;
}

.age-wrap:focus-within {
  border-color: var(--c-primary);
  box-shadow: var(--sh-focus);
}

.age-wrap.error {
  border-color: var(--c-error);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

.age-btn {
  width: 44px; height: 44px;
  border-radius: var(--r-sm);
  background: rgba(14, 148, 135, 0.08);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.age-btn:hover { background: rgba(14, 148, 135, 0.15); transform: scale(1.05); }
.age-btn:active { transform: scale(0.92); }

.age-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
}

.age-input {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  border: none;
  outline: none;
  background: transparent;
  -moz-appearance: textfield;
  appearance: textfield;
  letter-spacing: 0.5px;
}

.age-input::-webkit-outer-spin-button,
.age-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.age-unit {
  font-size: 13px;
  color: var(--c-slate);
  font-weight: 500;
  padding-inline-end: 10px;
}

html[lang="ar"] .age-unit { font-family: var(--f-ar); font-size: 14px; }

.err-msg {
  font-size: 11.5px;
  color: var(--c-error);
  font-weight: 500;
  padding-inline-start: 4px;
  min-height: 0;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.3s ease;
}

.section.has-error .err-msg {
  min-height: 16px;
  max-height: 30px;
  opacity: 1;
}

html[lang="ar"] .err-msg { font-family: var(--f-ar); font-size: 12.5px; }

/* ============================================
   ✅ INFO NOTE (نضيف ملاحظة بسيطة)
============================================ */
.info-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(139, 92, 246, 0.08);
  border-radius: var(--r-md);
  border: 1px solid rgba(139, 92, 246, 0.18);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.55s forwards;
  margin-top: auto;
}

.info-note svg {
  width: 16px;
  height: 16px;
  stroke: var(--c-purple);
  stroke-width: 2.2;
  fill: none;
  flex-shrink: 0;
  margin-top: 2px;
}

.info-text {
  font-size: 12px;
  color: var(--c-slate);
  line-height: 1.55;
}

html[lang="ar"] .info-text { font-family: var(--f-ar); font-size: 13px; }

/* ============================================
   BOTTOM
============================================ */
.bottom {
  position: relative;
  z-index: 10;
  padding: 20px 26px 44px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 148, 135, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 148, 135, 0.35);
}

.btn-primary:active:not(:disabled) { transform: scale(0.97); }

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: 0 8px 20px rgba(14, 148, 135, 0.15);
}

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover:not(:disabled) .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="progress-text" id="progressText">Step 2 of 3</div>
        </div>

        <!-- Heading -->
        <div class="heading-wrap">
          <h1 class="heading" id="heading">Let's build your profile</h1>
          <p class="subheading" id="subheading">Just one detail to shape your personalized training plan.</p>
        </div>

        <!-- ✅ Section: Age Only -->
        <div class="section" id="sectionAge">
          <div class="section-title">
            <span class="num">1</span>
            <span id="titleAge">Your Age</span>
          </div>
          <div class="age-wrap" id="ageWrap">
            <button class="age-btn" id="ageMinus" aria-label="Decrease">
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="number" class="age-input" id="ageInput" value="24" min="6" max="120" />
            <span class="age-unit" id="ageUnit">years</span>
            <button class="age-btn" id="agePlus" aria-label="Increase">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
          <div class="err-msg" id="errAge"></div>
        </div>

        <!-- Info Note -->
        <div class="info-note">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div class="info-text" id="infoText">
            We use your age to personalize exercise difficulty. Your data stays private and secure.
          </div>
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="continueBtn" disabled>
          <span id="continueLabel">Continue</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    progress: 'Step 2 of 3',
    heading: "Let's build your profile",
    subheading: 'Just one detail to shape your personalized training plan.',

    titleAge: 'Your Age',
    ageUnit: 'years',

    infoText: 'We use your age to personalize exercise difficulty. Your data stays private and secure.',

    continue: 'Continue',

    errAge: 'Age must be between 6 and 120'
  },
  ar: {
    progress: 'الخطوة 2 من 3',
    heading: 'هيا نبني ملفك',
    subheading: 'تفصيلة واحدة فقط لتشكيل خطة التدريب المخصصة لك.',

    titleAge: 'عمرك',
    ageUnit: 'سنة',

    infoText: 'نستخدم عمرك لتخصيص صعوبة التمارين. بياناتك محفوظة بشكل خاص وآمن.',

    continue: 'متابعة',

    errAge: 'العمر يجب أن يكون بين 6 و 120'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('progressText').textContent = t.progress;
  document.getElementById('heading').textContent      = t.heading;
  document.getElementById('subheading').textContent   = t.subheading;

  document.getElementById('titleAge').textContent = t.titleAge;
  document.getElementById('ageUnit').textContent  = t.ageUnit;

  document.getElementById('infoText').textContent     = t.infoText;
  document.getElementById('continueLabel').textContent = t.continue;

  refreshErrors();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   STATE
============================================ */
const state = {
  age: 24
};

/* ============================================
   AGE INPUT
============================================ */
const ageInput   = document.getElementById('ageInput');
const ageMinus   = document.getElementById('ageMinus');
const agePlus    = document.getElementById('agePlus');
const ageWrap    = document.getElementById('ageWrap');
const sectionAge = document.getElementById('sectionAge');

function setAge(val) {
  val = Math.max(6, Math.min(120, val));
  state.age = val;
  ageInput.value = val;
  clearError('age');
  checkComplete();
}

ageMinus.addEventListener('click', () => setAge(state.age - 1));
agePlus.addEventListener('click',  () => setAge(state.age + 1));

ageInput.addEventListener('input', () => {
  const v = parseInt(ageInput.value);
  if (!isNaN(v)) state.age = v;
  checkComplete();
});

ageInput.addEventListener('blur', () => {
  let v = parseInt(ageInput.value);
  if (isNaN(v) || v < 6 || v > 120) {
    showError('age', 'errAge');
  } else {
    setAge(v);
  }
});

/* ============================================
   VALIDATION
============================================ */
function checkComplete() {
  const ageOk = state.age >= 6 && state.age <= 120;
  document.getElementById('continueBtn').disabled = !ageOk;
}

const errEls = {
  age: document.getElementById('errAge')
};

const sections = {
  age: sectionAge
};

const errKeys = {
  age: 'errAge'
};

function showError(field, key) {
  sections[field].classList.add('has-error');
  errEls[field].textContent = I18N[currentLang][key];
  if (field === 'age') ageWrap.classList.add('error');
}

function clearError(field) {
  sections[field].classList.remove('has-error');
  errEls[field].textContent = '';
  if (field === 'age') ageWrap.classList.remove('error');
}

function refreshErrors() {
  Object.keys(sections).forEach(field => {
    if (sections[field].classList.contains('has-error')) {
      errEls[field].textContent = I18N[currentLang][errKeys[field]];
    }
  });
}

/* ============================================
   CONTINUE
============================================ */
document.getElementById('continueBtn').addEventListener('click', () => {
  // Save age only (بقية البيانات للـ Child Mode)
  localStorage.setItem('omega_age', state.age);
  localStorage.setItem('omega_user_age', state.age);

  // Animation
  const btn = document.getElementById('continueBtn');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => { btn.style.transform = ''; }, 150);

  setTimeout(() => {
    window.location.href = 'daily-context.html';
  }, 250);
});

/* ============================================
   BACK
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'account-type.html';
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
checkComplete();
</script>
