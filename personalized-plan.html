<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Personalized Plan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-warning: #FF9800;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-p1: linear-gradient(135deg, #E57373, #FF9800);
  --g-p2: linear-gradient(135deg, #FF9800, #FFB74D);
  --g-p3: linear-gradient(135deg, #5B9BD5, #9B7EDE);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }

/* ============================================
   HERO
============================================ */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  padding: 4px 0;
}

.ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  background: linear-gradient(135deg, rgba(155, 126, 222, 0.15), rgba(91, 155, 213, 0.12));
  border: 1px solid rgba(155, 126, 222, 0.3);
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.1s forwards;
}

.ai-badge svg {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  stroke-width: 2.2;
  fill: none;
  animation: sparkPulse 2s ease-in-out infinite;
}

@keyframes sparkPulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.15) rotate(15deg); }
}

html[lang="ar"] .ai-badge {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
}

.hero-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
  max-width: 320px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

html[lang="ar"] .hero-title { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.hero-desc {
  font-size: 13px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 320px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.4s forwards;
}

html[lang="ar"] .hero-desc { font-family: var(--f-ar); font-size: 14px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   SECTION HEAD
============================================ */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline-start: 4px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.55s forwards;
}

.section-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; letter-spacing: 0; }

/* ============================================
   PRIORITY CARDS
============================================ */
.priority-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.priority-card {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  padding: 16px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(18px);
  animation: cardIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.priority-card:nth-child(1) { animation-delay: 0.65s; }
.priority-card:nth-child(2) { animation-delay: 0.8s; }
.priority-card:nth-child(3) { animation-delay: 0.95s; }

@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

.priority-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 4px;
}

.priority-card.p1::before { background: var(--g-p1); }
.priority-card.p2::before { background: var(--g-p2); }
.priority-card.p3::before { background: var(--g-p3); }

.priority-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(15, 44, 76, 0.08);
}

/* Top row: rank badge + skill info */
.prio-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.rank-badge {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(15, 44, 76, 0.12);
}

.priority-card.p1 .rank-badge { background: var(--g-p1); }
.priority-card.p2 .rank-badge { background: var(--g-p2); }
.priority-card.p3 .rank-badge { background: var(--g-p3); }

.rank-num {
  font-size: 17px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.5px;
}

.rank-label {
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 0.9;
  margin-top: 1px;
}

html[lang="ar"] .rank-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 8.5px;
}

.prio-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.prio-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  line-height: 1.2;
}

html[lang="ar"] .prio-name { font-family: var(--f-ar); font-size: 16px; letter-spacing: 0; }

.prio-sub {
  font-size: 11px;
  color: var(--c-slate);
  font-weight: 500;
  letter-spacing: 0.1px;
}

html[lang="ar"] .prio-sub { font-family: var(--f-ar); font-size: 12px; }

/* Skill score mini circle */
.prio-score-mini {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  flex-shrink: 0;
}

.prio-score-num {
  font-size: 16px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  font-feature-settings: "tnum";
  line-height: 1;
}

.prio-score-num.low { color: var(--c-error); }
.prio-score-num.mid { color: var(--c-warning); }
.prio-score-num.high { color: var(--c-success); }

.prio-score-label {
  font-size: 8.5px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .prio-score-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 9.5px;
}

/* Reason row */
.prio-reason {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(14, 124, 123, 0.04);
  border-radius: var(--r-md);
  border: 1px dashed rgba(14, 124, 123, 0.15);
}

.prio-reason svg {
  width: 14px;
  height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
  flex-shrink: 0;
  margin-top: 1px;
}

.prio-reason-text {
  font-size: 11.5px;
  color: var(--c-navy);
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: 0.1px;
}

html[lang="ar"] .prio-reason-text { font-family: var(--f-ar); font-size: 12.5px; }

/* Stats row (sessions + time) */
.prio-stats {
  display: flex;
  gap: 8px;
}

.prio-stat {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 10px;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
}

.prio-stat svg {
  width: 13px;
  height: 13px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
  flex-shrink: 0;
}

.prio-stat-text {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  font-feature-settings: "tnum";
}

html[lang="ar"] .prio-stat-text { font-family: var(--f-ar); font-size: 12.5px; }

/* ============================================
   BOTTOM
============================================ */
.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 18px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.32);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.7s ease 1.15s forwards;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(14, 124, 123, 0.4);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16.5px; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Hero -->
        <div class="hero">
          <div class="ai-badge">
            <svg viewBox="0 0 24 24">
              <path d="M12 3 L13.5 9 L19.5 10.5 L13.5 12 L12 18 L10.5 12 L4.5 10.5 L10.5 9 Z"></path>
            </svg>
            <span id="aiBadge">AI Generated Plan</span>
          </div>
          <h1 class="hero-title" id="heroTitle">We've created a plan for you</h1>
          <p class="hero-desc" id="heroDesc">Based on your assessment, we've prioritized the skills that need the most attention.</p>
        </div>

        <!-- Section Head -->
        <div class="section-head">
          <div class="section-title" id="sectionTitle">Your Priorities</div>
        </div>

        <!-- Priority Cards -->
        <div class="priority-list" id="priorityList">
          <!-- Filled by JS -->
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="nextBtn">
          <span id="nextLabel">See Weekly Schedule</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    aiBadge: 'AI Generated Plan',
    heroTitle: "We've created a plan for you",
    heroDesc: "Based on your assessment, we've prioritized the skills that need the most attention.",
    sectionTitle: 'Your Priorities',
    nextLabel: 'See Weekly Schedule',

    priority: 'Priority',
    currentScore: 'Current',

    reasonLow:  'This skill is a top focus area. Consistent practice will build it up.',
    reasonMid:  'This skill needs strengthening. Regular sessions will help.',
    reasonHigh: 'This is a strong skill — we\'ll keep it sharp with light training.',

    sessionsUnit: '/ week',
    minutesUnit: 'min',

    skills: {
      memory:    'Memory',
      attention: 'Attention',
      speed:     'Processing Speed',
      problem:   'Problem Solving',
      visual:    'Visual Skills',
      language:  'Language',
      numerical: 'Numerical'
    }
  },
  ar: {
    aiBadge: 'خطة من الذكاء الاصطناعي',
    heroTitle: 'أنشأنا خطة مخصصة لك',
    heroDesc: 'بناءً على تقييمك، رتبنا المهارات التي تحتاج أكبر قدر من الاهتمام.',
    sectionTitle: 'أولوياتك',
    nextLabel: 'شاهد الجدول الأسبوعي',

    priority: 'أولوية',
    currentScore: 'الحالي',

    reasonLow:  'هذه المهارة هي أكبر أولوية. التدريب المنتظم سيرفعها.',
    reasonMid:  'هذه المهارة تحتاج تقوية. الجلسات المنتظمة ستساعد.',
    reasonHigh: 'هذه مهارة قوية — سنحافظ عليها بتدريب خفيف.',

    sessionsUnit: '/ أسبوع',
    minutesUnit: 'دقيقة',

    skills: {
      memory:    'الذاكرة',
      attention: 'الانتباه',
      speed:     'سرعة المعالجة',
      problem:   'حل المشكلات',
      visual:    'المهارات البصرية',
      language:  'اللغة',
      numerical: 'الرقمي'
    }
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('aiBadge').textContent     = t.aiBadge;
  document.getElementById('heroTitle').textContent   = t.heroTitle;
  document.getElementById('heroDesc').textContent    = t.heroDesc;
  document.getElementById('sectionTitle').textContent = t.sectionTitle;
  document.getElementById('nextLabel').textContent   = t.nextLabel;

  renderPriorities();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   SKILLS CONFIG
============================================ */
const SKILLS = [
  { key: 'memory',    storageKey: 'memento_memory_result' },
  { key: 'attention', storageKey: 'memento_attention_result' },
  { key: 'speed',     storageKey: 'memento_speed_result' },
  { key: 'problem',   storageKey: 'memento_problem_result' },
  { key: 'visual',    storageKey: 'memento_visual_result' },
  { key: 'language',  storageKey: 'memento_language_result' },
  { key: 'numerical', storageKey: 'memento_numerical_result' }
];

/* ============================================
   GET SCORES
============================================ */
function getScore(storageKey) {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
    if (typeof data.accuracy === 'number') return data.accuracy;
    return 0;
  } catch (e) {
    return 0;
  }
}

function getScoreClass(score) {
  if (score >= 70) return 'high';
  if (score >= 40) return 'mid';
  return 'low';
}

/* ============================================
   BUILD PLAN
   Lower score → higher priority
============================================ */
function buildPlan() {
  const scores = SKILLS.map(s => ({
    key: s.key,
    score: getScore(s.storageKey)
  }));

  // Sort ascending (lowest score first → highest priority)
  scores.sort((a, b) => a.score - b.score);

  // Take top 3 (lowest 3 scores = top 3 priorities)
  const priorities = scores.slice(0, 3);

  // Assign sessions & minutes based on rank
  const plan = priorities.map((item, i) => {
    let sessionsPerWeek, minutesPerSession;
    if (i === 0)      { sessionsPerWeek = 3; minutesPerSession = 10; }
    else if (i === 1) { sessionsPerWeek = 2; minutesPerSession = 10; }
    else              { sessionsPerWeek = 2; minutesPerSession = 8;  }

    return {
      ...item,
      rank: i + 1,
      sessions: sessionsPerWeek,
      minutes: minutesPerSession
    };
  });

  // Save to localStorage for schedule page
  localStorage.setItem('memento_personalized_plan', JSON.stringify(plan));

  return plan;
}

/* ============================================
   RENDER PRIORITIES
============================================ */
function renderPriorities() {
  const t = I18N[currentLang];
  const plan = buildPlan();
  const container = document.getElementById('priorityList');
  container.innerHTML = '';

  plan.forEach(item => {
    const cls = getScoreClass(item.score);
    const reasonKey = item.score >= 70 ? 'reasonHigh' : (item.score >= 40 ? 'reasonMid' : 'reasonLow');
    const reason = t[reasonKey];

    const card = document.createElement('div');
    card.className = `priority-card p${item.rank}`;

    card.innerHTML = `
      <div class="prio-top">
        <div class="rank-badge">
          <div class="rank-num">${item.rank}</div>
          <div class="rank-label">${t.priority}</div>
        </div>
        <div class="prio-info">
          <div class="prio-name">${t.skills[item.key]}</div>
          <div class="prio-sub">${t.currentScore}</div>
        </div>
        <div class="prio-score-mini">
          <div class="prio-score-num ${cls}">${item.score}%</div>
        </div>
      </div>

      <div class="prio-reason">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <div class="prio-reason-text">${reason}</div>
      </div>

      <div class="prio-stats">
        <div class="prio-stat">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="prio-stat-text">${item.sessions} ${t.sessionsUnit}</span>
        </div>
        <div class="prio-stat">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="prio-stat-text">${item.minutes} ${t.minutesUnit}</span>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

   BACK
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'cognitive-profile.html';
});

applyLanguage(currentLang);
</script>
