<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Cognitive Training Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: var(--c-bg);
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 15%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(14, 124, 123, 0.08), transparent 50%),
    var(--c-bg);
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* Container */
.container {
  max-width: 640px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  text-align: center;
}

/* Logo */
.logo-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.6);
  animation: logoIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
}

@keyframes logoIn {
  0%   { opacity: 0; transform: scale(0.6) rotate(-8deg); }
  60%  { opacity: 1; transform: scale(1.06) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.logo-wrap::after {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 124, 123, 0.18) 0%, transparent 65%);
  filter: blur(24px);
  z-index: -1;
  animation: pulseGlow 3s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.1); }
}

.logo-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 10px 30px rgba(14, 124, 123, 0.25));
}

.sparkle {
  transform-origin: center;
  animation: sparkle 2.4s ease-in-out infinite;
}

@keyframes sparkle {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  50%      { transform: scale(1.25) rotate(20deg); opacity: 0.85; }
}

/* Text */
.text-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.7s ease 0.6s forwards;
}

.app-name {
  font-size: 42px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1.5px;
  line-height: 1;
}

.app-name .ai {
  font-weight: 300;
  opacity: 0.85;
}

.tagline {
  font-size: 15px;
  color: var(--c-slate);
  font-weight: 500;
  letter-spacing: 0.2px;
  max-width: 400px;
  line-height: 1.6;
}

.badge-row {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 6px;
  flex-wrap: wrap;
}

.badge {
  padding: 5px 12px;
  background: rgba(14, 124, 123, 0.08);
  color: var(--c-primary);
  font-size: 10.5px;
  font-weight: 700;
  border-radius: var(--r-pill);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* Options */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.7s ease 0.85s forwards;
}

@media (max-width: 560px) {
  .options { grid-template-columns: 1fr; }
}

.option {
  position: relative;
  padding: 24px 20px;
  background: #fff;
  border: 2px solid var(--c-border);
  border-radius: var(--r-xl);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: all 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  overflow: hidden;
  text-align: center;
}

.option::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--g-brand);
  opacity: 0;
  transition: opacity 0.35s ease;
  z-index: 0;
}

.option:hover {
  border-color: transparent;
  transform: translateY(-4px);
  box-shadow: 0 20px 45px rgba(14, 124, 123, 0.22);
}

.option:hover::before { opacity: 1; }

.option:hover .option-icon,
.option:hover .option-title,
.option:hover .option-desc {
  color: #fff;
  stroke: #fff;
  position: relative;
  z-index: 2;
}

.option:hover .option-icon-bg {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.25);
}

.option-icon-bg {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: rgba(14, 124, 123, 0.06);
  border: 1px solid rgba(14, 124, 123, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.35s ease;
  position: relative;
  z-index: 2;
}

.option-icon {
  width: 32px;
  height: 32px;
  stroke: var(--c-primary);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.35s ease;
}

.option-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  transition: color 0.35s ease;
  position: relative;
  z-index: 2;
}

.option-desc {
  font-size: 12px;
  color: var(--c-slate);
  font-weight: 500;
  line-height: 1.5;
  transition: color 0.35s ease;
  position: relative;
  z-index: 2;
}

.option-arrow {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 18px;
  height: 18px;
  stroke: var(--c-slate);
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: translateX(-6px);
  transition: all 0.3s ease;
  z-index: 2;
}

.option:hover .option-arrow {
  opacity: 1;
  transform: translateX(0);
  stroke: #fff;
}

/* Footer */
.footer {
  font-size: 12px;
  color: var(--c-slate);
  font-weight: 500;
  letter-spacing: 0.2px;
  opacity: 0;
  animation: fadeUp 0.7s ease 1.1s forwards;
}

.footer b {
  color: var(--c-primary);
  font-weight: 700;
}
</style>
</head>

<body>

<div class="container">

  <!-- Logo -->
  <div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0E7C7B"/>
          <stop offset="50%" stop-color="#5B9BD5"/>
          <stop offset="100%" stop-color="#9B7EDE"/>
        </linearGradient>
        <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0E7C7B"/>

        </linearGradient>
        <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5B9BD5"/>

          <stop offset="100%" stop-color="#C9B6F0"/>
        </linearGradient>
        <linearGradient id="photo1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFE0B2"/>
          <stop offset="100%" stop-color="#FFB74D"/>
        </linearGradient>
        <linearGradient id="photo2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#B2DFDB"/>
          <stop offset="100%" stop-color="#4DB6AC"/>
        </linearGradient>
        <linearGradient id="photo3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E1BEE7"/>
          <stop offset="100%" stop-color="#9B7EDE"/>
        </linearGradient>
      </defs>

      <circle cx="100" cy="100" r="95" fill="none" stroke="url(#brandGrad)" stroke-width="0.5" opacity="0.15"/>

      <!-- Face Profile -->
      <path d="M 105 175 C 100 160, 96 148, 94 138 C 91 124, 90 112, 92 102
               C 94 88, 100 76, 110 70 C 118 65, 128 64, 136 68
               C 143 72, 146 79, 145 86 C 144 92, 141 96, 141 100
               C 141 104, 143 107, 146 108 C 149 110, 150 112, 148 114
               C 146 116, 143 117, 142 120 C 141 123, 143 125, 146 126
               C 148 127, 148 129, 146 130 C 143 131, 140 133, 138 137
               C 135 142, 134 150, 135 162 C 136 170, 138 175, 138 175 Z"
            fill="url(#faceGrad)" opacity="0.95"/>

      <path d="M 118 98 Q 124 104 130 98" fill="none" stroke="#0F2C4C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

      <!-- Brain -->
      <path d="M 68 78 C 58 78, 52 70, 54 62 C 48 58, 48 48, 56 44
               C 56 34, 66 28, 76 32 C 80 24, 92 22, 100 28
               C 108 22, 120 26, 124 34 C 134 32, 142 40, 140 50
               C 146 54, 146 64, 138 68 C 138 74, 132 80, 124 78
               C 120 84, 110 86, 104 82 C 100 88, 90 90, 84 86
               C 78 90, 70 86, 68 78 Z"
            fill="url(#brainGrad)" opacity="0.92"/>

      <path d="M 70 60 Q 80 55 88 62" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      <path d="M 90 45 Q 100 42 108 48" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      <path d="M 112 58 Q 120 55 126 62" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

      <!-- Photo Cards -->
      <g transform="rotate(-15 68 62)">
        <rect x="56" y="46" width="24" height="20" rx="3" fill="#fff"/>
        <rect x="58" y="48" width="20" height="14" rx="1.5" fill="url(#photo1)"/>
        <circle cx="63" cy="53" r="1.5" fill="#fff" opacity="0.9"/>
        <path d="M 58 60 L 63 55 L 68 58 L 74 52 L 78 60 Z" fill="#fff" opacity="0.7"/>
      </g>

      <g transform="rotate(-5 92 62)">
        <rect x="80" y="44" width="26" height="22" rx="3" fill="#fff"/>
        <rect x="82" y="46" width="22" height="16" rx="1.5" fill="url(#photo2)"/>
        <path d="M 88 62 L 88 55 Q 90 52 92 55 L 92 62 Z" fill="#0F2C4C" opacity="0.55"/>
        <circle cx="90" cy="53" r="2" fill="#0F2C4C" opacity="0.55"/>
      </g>

      <g transform="rotate(8 116 66)">
        <rect x="104" y="48" width="26" height="22" rx="3" fill="#fff"/>
        <rect x="106" y="50" width="22" height="16" rx="1.5" fill="url(#photo3)"/>
        <circle cx="112" cy="56" r="2.2" fill="#0F2C4C" opacity="0.55"/>
        <circle cx="120" cy="58" r="2.2" fill="#0F2C4C" opacity="0.45"/>
      </g>

      <!-- Swirl -->
      <path d="M 40 100 C 45 130, 60 155, 90 165 C 70 150, 58 125, 56 100
               C 54 78, 60 60, 76 46"
            fill="none" stroke="url(#brandGrad)" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>

      <!-- Sparkle -->
      <g class="sparkle" style="transform-origin: 148px 38px;">
        <path d="M 148 26 L 151 35 L 160 38 L 151 41 L 148 50 L 145 41 L 136 38 L 145 35 Z"
              fill="url(#brandGrad)"/>
      </g>
    </svg>
  </div>

  <!-- Text -->
  <div class="text-wrap">
    <h1 class="app-name">Memento <span class="ai">AI</span></h1>
    <p class="tagline">Train Your Mind. Support Your Memories.</p>
    <div class="badge-row">
      <span class="badge">Prototype v1.0</span>
      <span class="badge">28 Pages</span>
      <span class="badge">EN + AR</span>
    </div>
  </div>

  <!-- Options -->
  <div class="options">

    <!-- Start Experience -->
    <button class="option" onclick="window.location.href='splash.html'">
      <svg class="option-arrow" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
      <div class="option-icon-bg">
        <svg class="option-icon" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <div class="option-title">Start the Experience</div>
      <div class="option-desc">Launch the app from the splash screen and walk through the full user flow.</div>
    </button>

    <!-- View Prototype -->
    <button class="option" onclick="window.location.href='prototype.html'">
      <svg class="option-arrow" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
      <div class="option-icon-bg">
        <svg class="option-icon" viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div class="option-title">View All Pages</div>
      <div class="option-desc">Browse every screen in a phone frame with quick navigation between them.</div>
    </button>

  </div>

  <!-- Footer -->
  <div class="footer">
    Built with <b>HTML · CSS · JS</b> · Ready for Flutter Migration
  </div>

</div>

</body>
</html>
