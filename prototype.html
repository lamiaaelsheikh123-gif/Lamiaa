<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F2C4C" />
<title>Memento AI — Interactive Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-success: #4CAF50;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-deep: 0 20px 60px rgba(15, 44, 76, 0.15);

  --sidebar-bg: #0F2C4C;
  --sidebar-bg2: #0B2238;
  --sidebar-text: rgba(255, 255, 255, 0.85);
  --sidebar-text-dim: rgba(255, 255, 255, 0.5);
  --sidebar-hover: rgba(255, 255, 255, 0.06);
  --sidebar-active: rgba(91, 155, 213, 0.18);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
  --sidebar-w: 300px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
}

/* SIDEBAR */
.sidebar {
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.sidebar::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 0% 0%, rgba(91, 155, 213, 0.15), transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(155, 126, 222, 0.12), transparent 45%);
  pointer-events: none;
}

.sidebar-header {
  position: relative;
  z-index: 2;
  padding: 24px 22px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.brand-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--g-brand);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.4);
}

.brand-icon svg {
  width: 18px; height: 18px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.brand-info { display: flex; flex-direction: column; gap: 1px; }

.brand-name {
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.2px;
}

.brand-sub {
  font-size: 10.5px;
  color: var(--sidebar-text-dim);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  font-weight: 600;
}

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 12px;
  width: 14px; height: 14px;
  stroke: var(--sidebar-text-dim);
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

html[dir="rtl"] .search-icon { left: auto; right: 12px; }

.search-input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--r-md);
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  outline: none;
  transition: all 0.25s ease;
}

html[dir="rtl"] .search-input { padding: 9px 34px 9px 12px; }
.search-input::placeholder { color: var(--sidebar-text-dim); }

.search-input:focus {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(91, 155, 213, 0.5);
  box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
}

.sidebar-list {
  position: relative;
  z-index: 2;
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px 22px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
}

.sidebar-list::-webkit-scrollbar { width: 6px; }
.sidebar-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.group { margin-bottom: 16px; }

.group-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--sidebar-text-dim);
  padding: 6px 10px 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.group-title::before {
  content: '';
  width: 3px; height: 10px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

/* Special style for Caregiver group */
.group.caregiver .group-title::before {
  background: linear-gradient(180deg, #9B7EDE, #5B9BD5);
}

.page-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--sidebar-text);
  text-align: start;
  transition: all 0.2s ease;
  position: relative;
  margin-bottom: 2px;
}

.page-btn:hover {
  background: var(--sidebar-hover);
  color: #fff;
}

.page-btn.active {
  background: var(--sidebar-active);
  color: #fff;
  font-weight: 600;
  box-shadow: inset 0 0 0 1px rgba(91, 155, 213, 0.3);
}

.page-btn .num {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.08);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--sidebar-text-dim);
  flex-shrink: 0;
  font-feature-settings: "tnum";
  transition: all 0.2s ease;
}

.page-btn.active .num {
  background: var(--g-brand);
  color: #fff;
  box-shadow: 0 4px 10px rgba(14, 124, 123, 0.4);
}

.page-btn .name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.page-btn .status {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c-success);
  box-shadow: 0 0 6px rgba(76, 175, 80, 0.6);
  flex-shrink: 0;
}

/* STAGE */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.10), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.08), transparent 50%),
    #E8E4DC;
}

.stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(15, 44, 76, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15, 44, 76, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}

.stage-topbar {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 24px;
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(15, 44, 76, 0.08);
  flex-shrink: 0;
}

.page-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.page-info-num {
  padding: 4px 10px;
  background: var(--g-brand);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: var(--r-pill);
  letter-spacing: 0.3px;
  box-shadow: 0 4px 12px rgba(14, 124, 123, 0.3);
  font-feature-settings: "tnum";
  flex-shrink: 0;
}

.page-info-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.ctrl-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid rgba(15, 44, 76, 0.08);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.22s ease;
  color: var(--c-navy);
  box-shadow: 0 4px 12px rgba(15, 44, 76, 0.05);
}

.ctrl-btn:hover {
  transform: translateY(-2px);
  border-color: var(--c-primary);
  color: var(--c-primary);
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.15);
}

.ctrl-btn:active { transform: scale(0.94); }
.ctrl-btn:disabled { opacity: 0.35; pointer-events: none; }

.ctrl-btn svg {
  width: 16px; height: 16px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

html[dir="rtl"] .ctrl-btn.prev svg,
html[dir="rtl"] .ctrl-btn.next svg {
  transform: scaleX(-1);
}

.ctrl-divider {
  width: 1px;
  height: 22px;
  background: rgba(15, 44, 76, 0.1);
  margin: 0 4px;
}

/* PHONE PREVIEW */
.stage-body {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 30px 40px;
  overflow: hidden;
  min-height: 0;
}

.phone-frame-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 480px;
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.phone-frame-wrap::before,
.phone-frame-wrap::after {
  content: '';
  position: absolute;
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(40px);
}

.phone-frame-wrap::before {
  width: 200px; height: 200px;
  top: 0; left: 0;
  background: rgba(14, 124, 123, 0.15);
  transform: translate(-30%, -30%);
}

.phone-frame-wrap::after {
  width: 220px; height: 220px;
  bottom: 0; right: 0;
  background: rgba(155, 126, 222, 0.15);
  transform: translate(30%, 30%);
}

.phone-shell {
  position: relative;
  width: calc(var(--phone-w) * 1.05);
  height: calc(var(--phone-h) * 1.05);
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: var(--phone-w) / var(--phone-h);
  background: #1a1a1a;
  border-radius: 52px;
  padding: 12px;
  box-shadow:
    0 0 0 2px #0a0a0a inset,
    0 0 0 12px #1a1a1a,
    0 0 0 13px #2a2a2a,
    0 50px 100px rgba(0, 0, 0, 0.4),
    0 30px 60px rgba(0, 0, 0, 0.25);
  z-index: 1;
  transition: all 0.3s ease;
}

.phone-shell::before {
  content: '';
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 28px;
  background: #1a1a1a;
  border-radius: 0 0 20px 20px;
  z-index: 10;
  pointer-events: none;
}

.phone-shell::after {
  content: '';
  position: absolute;
  right: -14px;
  top: 200px;
  width: 3px;
  height: 70px;
  background: #2a2a2a;
  border-radius: 0 3px 3px 0;
}

.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--c-bg);
  border-radius: 42px;
  overflow: hidden;
  border: none;
}

.phone-iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: var(--c-bg);
}

.iframe-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-bg);
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.iframe-loading.show {
  opacity: 1;
  pointer-events: auto;
}

.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(14, 124, 123, 0.15);
  border-top-color: var(--c-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* MOBILE MENU */
.mobile-menu-btn {
  display: none;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--c-navy);
  color: #fff;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(15, 44, 76, 0.25);
}

.mobile-menu-btn svg {
  width: 18px; height: 18px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 300px;
    height: 100vh;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 100;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
  }

  html[dir="rtl"] .sidebar {
    left: auto; right: 0;
    transform: translateX(100%);
  }

  .sidebar.open { transform: translateX(0); }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 44, 76, 0.4);
    backdrop-filter: blur(4px);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .mobile-menu-btn { display: inline-flex; }

  .phone-shell {
    border-radius: 40px;
    padding: 9px;
    box-shadow:
      0 0 0 2px #0a0a0a inset,
      0 0 0 8px #1a1a1a,
      0 0 0 9px #2a2a2a,
      0 30px 70px rgba(0, 0, 0, 0.35);
  }

  .phone-shell::before {
    width: 110px;
    height: 22px;
    top: 9px;
  }

  .phone-screen { border-radius: 32px; }
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--c-navy);
  color: #fff;
  padding: 12px 22px;
  border-radius: var(--r-pill);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.2px;
  box-shadow: 0 12px 30px rgba(15, 44, 76, 0.35);
  z-index: 300;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3 L13.5 9 L19.5 10.5 L13.5 12 L12 18 L10.5 12 L4.5 10.5 L10.5 9 Z"></path>
            <path d="M19 3 L19.8 6 L22.5 6.8 L19.8 7.5 L19 10.5 L18.2 7.5 L15.5 6.8 L18.2 6 Z" opacity="0.7"></path>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-name">Memento AI</div>
          <div class="brand-sub">Prototype v1.1</div>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search pages...">
      </div>
    </div>

    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ STAGE ============ -->
  <main class="stage">

    <div class="stage-topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="page-info">
        <div class="page-info-num" id="pageInfoNum">1 / 32</div>
        <div class="page-info-name" id="pageInfoName">Splash Screen</div>
      </div>

      <div class="controls">
        <button class="ctrl-btn prev" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="ctrl-btn next" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" id="reloadBtn" aria-label="Reload">
          <svg viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="ctrl-btn" id="openBtn" aria-label="Open in new tab">
          <svg viewBox="0 0 24 24">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="stage-body">
      <div class="phone-frame-wrap">
        <div class="phone-shell">
          <div class="phone-screen">
            <iframe class="phone-iframe" id="phoneIframe" src="splash.html" title="Page Preview"></iframe>
            <div class="iframe-loading show" id="iframeLoading">
              <div class="loading-spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

</div>

<div class="toast" id="toast">Page loaded</div>

      { file: 'exercise-instructions.html', name: 'Exercise Instructions' },
      { file: 'exercise-play.html',         name: 'Exercise Play (Memory)' },
      { file: 'session-complete.html',      name: 'Session Complete' }
    ]
  },
  {
    group: 'Progress & Settings',
    items: [
      { file: 'progress.html',              name: 'Progress' },
      { file: 'profile-settings.html',      name: 'Profile Settings' },
      { file: 'parent-dashboard.html',      name: 'Parent Dashboard' }
    ]
  },
  {
    group: 'Design & Docs',
    items: [
      { file: 'style-guide.html',           name: 'Style Guide' }
    ]
  }
];

/* Flatten */
const FLAT_PAGES = [];
PAGES.forEach(group => {
  group.items.forEach(item => {
    FLAT_PAGES.push({ ...item, group: group.group });
  });
});

/* ============================================
   STATE
============================================ */
let currentIdx = 0;
let searchQuery = '';

const sidebarList = document.getElementById('sidebarList');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const searchInput = document.getElementById('searchInput');
const phoneIframe = document.getElementById('phoneIframe');
const iframeLoading = document.getElementById('iframeLoading');
const pageInfoNum = document.getElementById('pageInfoNum');
const pageInfoName = document.getElementById('pageInfoName');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const reloadBtn = document.getElementById('reloadBtn');
const openBtn = document.getElementById('openBtn');
const mobileMenuBtn = document.getElementById('mobileMenuBtn');

/* ============================================
   RENDER SIDEBAR
============================================ */
function renderSidebar() {
  const query = searchQuery.toLowerCase().trim();
  sidebarList.innerHTML = '';

  let hasResults = false;

  PAGES.forEach(group => {
    const filtered = group.items.filter(item =>
      item.name.toLowerCase().includes(query) ||
      item.file.toLowerCase().includes(query)
    );

    if (filtered.length === 0) return;

    hasResults = true;
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    if (group.caregiver) groupEl.classList.add('caregiver');

    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group.group;
    groupEl.appendChild(title);

    filtered.forEach(item => {
      const absIdx = FLAT_PAGES.findIndex(p => p.file === item.file);

      const btn = document.createElement('button');
      btn.className = 'page-btn';
      if (absIdx === currentIdx) btn.classList.add('active');
      btn.dataset.idx = absIdx;

      btn.innerHTML = `
        <span class="num">${absIdx + 1}</span>
        <span class="name">${item.name}</span>
        <span class="status"></span>
      `;

      btn.addEventListener('click', () => {
        loadPage(absIdx);
        closeSidebarMobile();
      });

      groupEl.appendChild(btn);
    });

    sidebarList.appendChild(groupEl);
  });

  if (!hasResults) {
    sidebarList.innerHTML = `
      <div style="text-align:center;padding:40px 20px;color:var(--sidebar-text-dim);font-size:12.5px;">
        No pages match your search.
      </div>
    `;
  }
}

/* ============================================
   LOAD PAGE
============================================ */
function loadPage(idx) {
  if (idx < 0 || idx >= FLAT_PAGES.length) return;
  currentIdx = idx;

  const page = FLAT_PAGES[idx];
  iframeLoading.classList.add('show');

  pageInfoNum.textContent = `${idx + 1} / ${FLAT_PAGES.length}`;
  pageInfoName.textContent = page.name;

  phoneIframe.src = page.file;

  phoneIframe.onload = () => {
    setTimeout(() => {
      iframeLoading.classList.remove('show');
    }, 200);
  };

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === FLAT_PAGES.length - 1;

  document.querySelectorAll('.page-btn').forEach(btn => {
    const bIdx = parseInt(btn.dataset.idx);
    btn.classList.toggle('active', bIdx === idx);
  });

  const activeBtn = sidebarList.querySelector('.page-btn.active');
  if (activeBtn && !searchQuery) {
    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  showToast(page.name);
}

/* ============================================
   NAVIGATION
============================================ */
prevBtn.addEventListener('click', () => loadPage(currentIdx - 1));
nextBtn.addEventListener('click', () => loadPage(currentIdx + 1));

reloadBtn.addEventListener('click', () => {
  iframeLoading.classList.add('show');
  phoneIframe.src = phoneIframe.src;
});

openBtn.addEventListener('click', () => {
  const page = FLAT_PAGES[currentIdx];
  window.open(page.file, '_blank');
});

/* ============================================
   SEARCH
============================================ */
searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderSidebar();
});

/* ============================================
   KEYBOARD
============================================ */
document.addEventListener('keydown', (e) => {
  if (e.target === searchInput) return;

  if (e.key === 'ArrowLeft') {
    const dir = document.documentElement.dir === 'rtl' ? 1 : -1;
    if (dir === -1) loadPage(currentIdx - 1);
    else loadPage(currentIdx + 1);
  } else if (e.key === 'ArrowRight') {
    const dir = document.documentElement.dir === 'rtl' ? -1 : 1;
    if (dir === 1) loadPage(currentIdx + 1);
    else loadPage(currentIdx - 1);
  } else if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    reloadBtn.click();
  }
});

/* ============================================
   MOBILE SIDEBAR
============================================ */
function openSidebarMobile() {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('open');
}

function closeSidebarMobile() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('open');
}

mobileMenuBtn.addEventListener('click', openSidebarMobile);
sidebarOverlay.addEventListener('click', closeSidebarMobile);

/* ============================================
   TOAST
============================================ */
let toastTimeout = null;

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 1400);
}

/* ============================================
   INIT
============================================ */
renderSidebar();
loadPage(0);
</script>

</body>
</html>
