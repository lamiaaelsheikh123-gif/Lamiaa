<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Achievements</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B; --c-primary-light: #4DB6AC; --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5; --c-navy: #0F2C4C; --c-slate: #5A6C7D;
  --c-bg: #FAF8F3; --c-card: #FFFFFF; --c-border: #EAE6DE;
  --c-error: #E57373; --c-success: #4CAF50; --c-warning: #FF9800;
  --c-gold: #FFC107; --c-silver: #B0BEC5; --c-bronze: #CD7F32;
  --c-fire: #FF6B35;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-fire: linear-gradient(135deg, #FF6B35, #FF9800, #FFB74D);
  --g-gold: linear-gradient(135deg, #FFC107, #FFD54F, #FFE082);
  --g-heart: linear-gradient(135deg, #E8A0BF, #9B7EDE);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(255, 193, 7, 0.08), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(155, 126, 222, 0.10), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* CONFETTI */
.confetti-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover { background: #fff; border-color: rgba(14, 124, 123, 0.35); transform: translateX(-2px); }
html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg { width: 16px; height: 16px; stroke: var(--c-primary); stroke-width: 2.4; fill: none; }
html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600;
  color: var(--c-navy);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover { background: #fff; border-color: rgba(14, 124, 123, 0.35); transform: translateY(-1px); }
.lang-toggle svg { width: 14px; height: 14px; stroke: var(--c-primary); stroke-width: 2.2; fill: none; }

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }
.content > * { flex-shrink: 0; }

@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* PAGE HEAD */
.page-head {
  display: flex; flex-direction: column; gap: 4px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.1s forwards;
}

.page-title {
  font-size: 24px; font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px; line-height: 1.15;
}

html[lang="ar"] .page-title { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.page-sub { font-size: 13px; color: var(--c-slate); font-weight: 500; line-height: 1.5; }
html[lang="ar"] .page-sub { font-family: var(--f-ar); font-size: 14px; }

/* PROGRESS HEADER */
.progress-header {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative;
  overflow: hidden;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.2s forwards;
}

.progress-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 4px;
  background: var(--g-gold);
}

.ph-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}

.ph-info { display: flex; flex-direction: column; gap: 2px; }

.ph-label {
  font-size: 11.5px; font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

html[lang="ar"] .ph-label {
  font-family: var(--f-ar);
  text-transform: none; letter-spacing: 0;
  font-size: 12.5px;
}

.ph-value {
  font-size: 22px; font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.5px;
  font-feature-settings: "tnum";
  display: flex; align-items: baseline; gap: 3px;
}

.ph-value small {
  font-size: 13px; font-weight: 700;
  color: var(--c-slate);
}

.ph-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: var(--g-gold);
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(255, 193, 7, 0.35);
  animation: trophyPulse 2.4s ease-in-out infinite;
}

@keyframes trophyPulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.08) rotate(-3deg); }
}

.ph-icon svg {
  width: 24px; height: 24px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.ph-bar {
  width: 100%;
  height: 8px;
  background: rgba(255, 193, 7, 0.15);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.ph-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--r-pill);
  background: var(--g-gold);
  box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
  transition: width 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.6s;
}

/* SECTION HEAD */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-inline-start: 4px; margin-top: 4px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease forwards;
}

.section-head.s1 { animation-delay: 0.35s; }
.section-head.s2 { animation-delay: 0.45s; }
.section-head.s3 { animation-delay: 0.55s; }
.section-head.s4 { animation-delay: 0.65s; }

.section-title {
  font-size: 13.5px; font-weight: 700;
  color: var(--c-navy);
  display: flex; align-items: center; gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px; height: 14px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; }

.section-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-slate);
  background: rgba(14, 124, 123, 0.08);
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-feature-settings: "tnum";
}

html[lang="ar"] .section-count { font-family: var(--f-ar); font-size: 12px; }

/* BADGES GRID */
.badges-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease forwards;
}

.badges-grid.s1 { animation-delay: 0.4s; }
.badges-grid.s2 { animation-delay: 0.5s; }
.badges-grid.s3 { animation-delay: 0.6s; }
.badges-grid.s4 { animation-delay: 0.7s; }

.badge-card {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 10px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  overflow: hidden;
  text-align: center;
  min-height: 140px;
  justify-content: center;
}

.badge-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(15, 44, 76, 0.1);
}

.badge-card.unlocked {
  border-color: rgba(255, 193, 7, 0.35);
  background: linear-gradient(135deg, rgba(255, 193, 7, 0.04), rgba(255, 179, 71, 0.02));
}

.badge-card.unlocked:hover {
  border-color: rgba(255, 193, 7, 0.6);
  box-shadow: 0 12px 28px rgba(255, 193, 7, 0.2);
}

.badge-card.locked {
  opacity: 0.55;
  filter: grayscale(0.5);
}

.badge-card.locked:hover {
  opacity: 0.75;
  filter: grayscale(0.2);
}

/* Icon */
.badge-icon {
  position: relative;
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 26px;
  line-height: 1;
  overflow: hidden;
}

.badge-card.unlocked .badge-icon {
  background: var(--g-gold);
  box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
  animation: badgeGlow 3s ease-in-out infinite;
}

@keyframes badgeGlow {
  0%, 100% { box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4); }
  50%      { box-shadow: 0 8px 30px rgba(255, 193, 7, 0.65); }
}

.badge-card.locked .badge-icon {
  background: #E8E4DC;
}

/* Icon variants per category */
.badge-card.streak.unlocked .badge-icon { background: var(--g-fire); }
.badge-card.session.unlocked .badge-icon { background: var(--g-brand); }
.badge-card.skill.unlocked .badge-icon { background: var(--g-brand); }
.badge-card.special.unlocked .badge-icon { background: var(--g-gold); }

/* Icon text emoji */
.badge-icon-emoji {
  font-size: 26px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  z-index: 2;
}

.badge-card.locked .badge-icon-emoji {
  filter: grayscale(1) opacity(0.4);
}

/* Lock overlay */
.badge-lock {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15, 44, 76, 0.35);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.badge-card.locked .badge-lock { opacity: 1; }

.badge-lock svg {
  width: 20px; height: 20px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Name + Desc */
.badge-name {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  line-height: 1.2;
  text-align: center;
}

html[lang="ar"] .badge-name { font-family: var(--f-ar); font-size: 12.5px; letter-spacing: 0; }

.badge-desc {
  font-size: 10px;
  color: var(--c-slate);
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
}

html[lang="ar"] .badge-desc { font-family: var(--f-ar); font-size: 11px; }

/* Mini progress bar for locked with partial */
.badge-progress {
  width: 100%;
  height: 4px;
  background: rgba(14, 124, 123, 0.08);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
  margin-top: 2px;
}

.badge-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--g-gold);
  border-radius: var(--r-pill);
  transition: width 1s cubic-bezier(0.65, 0, 0.35, 1) 0.8s;
}

.badge-card.locked .badge-progress-fill {
  background: linear-gradient(90deg, #B0BEC5, #CFD8DC);
}

.badge-progress-text {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--c-slate);
  font-feature-settings: "tnum";
}

html[lang="ar"] .badge-progress-text { font-family: var(--f-ar); font-size: 10.5px; }

/* ============================================
   BADGE DETAIL MODAL
============================================ */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 44, 76, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  display: flex; align-items: center; justify-content: center;
  padding: 30px;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #fff;
  border-radius: var(--r-xl);
  padding: 24px 22px 20px;
  width: 100%;
  max-width: 320px;
  text-align: center;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes modalPop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); }
}

.modal-badge-icon {
  width: 80px; height: 80px;
  border-radius: 50%;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  position: relative;
  overflow: hidden;
}

.modal-badge-icon.unlocked { background: var(--g-gold); box-shadow: 0 12px 30px rgba(255, 193, 7, 0.4); }
.modal-badge-icon.locked { background: #E8E4DC; }
.modal-badge-icon .badge-lock { opacity: 1; }
.modal-badge-icon.unlocked .badge-lock { display: none; }

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.2px;
}

html[lang="ar"] .modal-title { font-family: var(--f-ar); font-size: 17px; letter-spacing: 0; }

.modal-desc {
  font-size: 12.5px;
  color: var(--c-slate);
  line-height: 1.6;
  font-weight: 500;
}

html[lang="ar"] .modal-desc { font-family: var(--f-ar); font-size: 13.5px; }

.modal-progress-wrap {
  display: flex; flex-direction: column; gap: 6px;
  padding: 12px;
  background: rgba(14, 124, 123, 0.04);
  border-radius: var(--r-md);
  border: 1px dashed rgba(14, 124, 123, 0.2);
}

.modal-progress-labels {
  display: flex; justify-content: space-between; align-items: center;
}

.modal-progress-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--c-slate);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

html[lang="ar"] .modal-progress-label {
  font-family: var(--f-ar);
  text-transform: none; letter-spacing: 0;
  font-size: 12px;
}

.modal-progress-value {
  font-size: 13px;
  font-weight: 800;
  color: var(--c-navy);
  font-feature-settings: "tnum";
}

.modal-progress-track {
  width: 100%;
  height: 6px;
  background: rgba(14, 124, 123, 0.08);
  border-radius: var(--r-pill);
  overflow: hidden;
}

.modal-progress-fill {
  height: 100%;
  background: var(--g-gold);
  border-radius: var(--r-pill);
  transition: width 0.8s ease;
}

.modal-status {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r-pill);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  align-self: center;
}

.modal-status.unlocked {
  background: rgba(76, 175, 80, 0.12);
  color: var(--c-success);
}

.modal-status.locked {
  background: rgba(90, 108, 125, 0.12);
  color: var(--c-slate);
}

.modal-status svg {
  width: 13px; height: 13px;
  stroke: currentColor; stroke-width: 2.6; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .modal-status { font-family: var(--f-ar); font-size: 13.5px; letter-spacing: 0; }

.modal-close-btn {
  padding: 12px;
  background: var(--g-brand);
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  border-radius: var(--r-md);
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.3);
  transition: all 0.25s ease;
  margin-top: 4px;
}

.modal-close-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(14, 124, 123, 0.4); }
.modal-close-btn:active { transform: scale(0.97); }
html[lang="ar"] .modal-close-btn { font-family: var(--f-ar); font-size: 14.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .confetti-canvas { display: none; }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Confetti -->
      <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="langLabel">EN</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Page Head -->
        <div class="page-head">
          <h1 class="page-title" id="pageTitle">Achievements</h1>
          <p class="page-sub" id="pageSub">Track your milestones and celebrate your progress.</p>
        </div>

        <!-- Progress Header -->
        <div class="progress-header">
          <div class="ph-top">
            <div class="ph-info">
              <div class="ph-label" id="phLabel">Unlocked</div>
              <div class="ph-value">
                <span id="phCount">0</span>
                <small>/ <span id="phTotal">0</span></small>
              </div>
            </div>
            <div class="ph-icon">
              <svg viewBox="0 0 24 24">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>

/* ============================================

const BADGES = [

const SKILL_KEYS = ['memory', 'attention', 'speed', 'problem', 'visual', 'language', 'numerical'];

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   LOAD PROGRESS
============================================ */
function getScore(key) {
  try {
    const data = JSON.parse(localStorage.getItem('memento_' + key + '_result') || '{}');
    return typeof data.accuracy === 'number' ? data.accuracy : 0;
  } catch (e) { return 0; }
}

function getProgressData() {
  const streak = parseInt(localStorage.getItem('memento_streak') || '0');
  const sessions = parseInt(localStorage.getItem('memento_total_sessions') || '0');

  // Skills scores
  const skillScores = {};
  SKILL_KEYS.forEach(k => { skillScores[k] = getScore(k); });

  // Perfect score check
  let hasPerfect = false;
  SKILL_KEYS.forEach(k => {
    if (getScore(k) >= 100) hasPerfect = true;
  });

  // All high check (all skills >= 70%)
  const allHigh = SKILL_KEYS.every(k => getScore(k) >= 70);

  // Comeback check — from memento_starting_accuracy vs current avg
  const starting = parseInt(localStorage.getItem('memento_starting_accuracy') || '0');
  const currentAvg = SKILL_KEYS.reduce((sum, k) => sum + getScore(k), 0) / SKILL_KEYS.length;
  const comeback = starting > 0 && (currentAvg - starting) >= 30;

  return {
    streak,
    sessions,
    skillScores,
    hasPerfect,
    allHigh,
    comeback,
    currentAvg: Math.round(currentAvg),
    starting
  };
}

/* ============================================
   CHECK BADGE UNLOCKED
============================================ */
function checkBadge(badge, data) {
  let current = 0;
  let target = badge.target;
  let unlocked = false;

  switch (badge.type) {
    case 'streak':
      current = data.streak;
      unlocked = current >= target;
      break;

    case 'sessions':
      current = data.sessions;
      unlocked = current >= target;
      break;

    case 'skill':
      current = data.skillScores[badge.skillKey] || 0;
      unlocked = current >= target;
      break;

    case 'perfect':
      current = data.hasPerfect ? 1 : 0;
      target = 1;
      unlocked = data.hasPerfect;
      break;

    case 'allHigh':
      current = SKILL_KEYS.filter(k => getScore(k) >= 70).length;
      target = 7;
      unlocked = current >= 7;
      break;

    case 'comeback':
      current = data.starting > 0 ? Math.max(0, Math.round(data.currentAvg - data.starting)) : 0;
      unlocked = current >= target;
      break;
  }

  const progress = target > 0 ? Math.min(100, Math.round((current / target) * 100)) : 0;

  return { current, target, unlocked, progress };
}

/* ============================================
   RENDER
============================================ */
let currentData = null;
let currentBadgeStates = {};

function renderBadgeCard(badge, state) {
  const t = I18N[currentLang];
  const card = document.createElement('div');
  card.className = `badge-card ${badge.category} ${state.unlocked ? 'unlocked' : 'locked'}`;
  card.dataset.badgeId = badge.id;

  let progressHtml = '';
  if (!state.unlocked && state.progress > 0) {
    progressHtml = `
      <div class="badge-progress">
        <div class="badge-progress-fill" data-width="${state.progress}"></div>
      </div>
      <div class="badge-progress-text">${state.current} / ${state.target}</div>
    `;
  } else if (!state.unlocked) {
    progressHtml = `
      <div class="badge-progress-text">0 / ${state.target}</div>
    `;
  }

  card.innerHTML = `
    <div class="badge-icon">
      <span class="badge-icon-emoji">${badge.emoji}</span>
      <div class="badge-lock">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
    </div>
    <div class="badge-name">${t[badge.nameKey]}</div>
    ${progressHtml}
  `;

  card.addEventListener('click', () => openBadgeModal(badge, state));

  return card;
}

function renderAll() {
  currentData = getProgressData();
  currentBadgeStates = {};

  const t = I18N[currentLang];

  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageSub').textContent = t.pageSub;
  document.getElementById('phLabel').textContent = t.phLabel;
  document.getElementById('streakSectionTitle').textContent = t.streakSectionTitle;
  document.getElementById('sessionSectionTitle').textContent = t.sessionSectionTitle;
  document.getElementById('skillSectionTitle').textContent = t.skillSectionTitle;
  document.getElementById('specialSectionTitle').textContent = t.specialSectionTitle;

  // Calculate all badge states
  BADGES.forEach(b => {
    currentBadgeStates[b.id] = checkBadge(b, currentData);
  });

  // Render each category
  const categories = ['streak', 'session', 'skill', 'special'];
  const gridIds = {
    streak: 'streakGrid',
    session: 'sessionGrid',
    skill: 'skillGrid',
    special: 'specialGrid'
  };
  const countIds = {
    streak: 'streakCount',
    session: 'sessionCount',
    skill: 'skillCount',
    special: 'specialCount'
  };

  let totalUnlocked = 0;

  categories.forEach(cat => {
    const grid = document.getElementById(gridIds[cat]);
    grid.innerHTML = '';

    const catBadges = BADGES.filter(b => b.category === cat);
    let catUnlocked = 0;

    catBadges.forEach(b => {
      const state = currentBadgeStates[b.id];
      const card = renderBadgeCard(b, state);
      grid.appendChild(card);
      if (state.unlocked) {
        catUnlocked++;
        totalUnlocked++;
      }
    });

    document.getElementById(countIds[cat]).textContent = `${catUnlocked}/${catBadges.length}`;
  });

  // Progress header
  const total = BADGES.length;
  document.getElementById('phCount').textContent = totalUnlocked;
  document.getElementById('phTotal').textContent = total;

  const overallProgress = Math.round((totalUnlocked / total) * 100);
  setTimeout(() => {
    document.getElementById('phBarFill').style.width = overallProgress + '%';
    document.querySelectorAll('.badge-progress-fill').forEach(el => {
      el.style.width = el.dataset.width + '%';
    });
  }, 300);
}

/* ============================================

============================================ */
function openBadgeModal(badge, state) {
  const t = I18N[currentLang];
  const overlay = document.getElementById('modalOverlay');
  const iconEl = document.getElementById('modalBadgeIcon');

  document.getElementById('modalBadgeEmoji').textContent = badge.emoji;
  document.getElementById('modalTitle').textContent = t[badge.nameKey];
  document.getElementById('modalDesc').textContent = t[badge.descKey];

  // Icon styling
  iconEl.className = 'modal-badge-icon ' + (state.unlocked ? 'unlocked' : 'locked');

  // Progress
  document.getElementById('modalProgressLabel').textContent = t.progress;
  document.getElementById('modalProgressValue').textContent = `${state.current} / ${state.target}`;
  document.getElementById('modalProgressFill').style.width = state.progress + '%';

  if (state.unlocked) {
    document.getElementById('modalProgressWrap').style.display = 'none';
  } else {
    document.getElementById('modalProgressWrap').style.display = 'flex';
  }

  // Status
  const statusEl = document.getElementById('modalStatus');
  statusEl.className = 'modal-status ' + (state.unlocked ? 'unlocked' : 'locked');

  if (state.unlocked) {
    statusEl.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
    document.getElementById('modalStatusText').textContent = t.unlockedStatus;
  } else {
    statusEl.querySelector('svg').innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>';
    document.getElementById('modalStatusText').textContent = t.lockedStatus;
  }

  document.getElementById('modalCloseLabel').textContent = t.closeBtn;

  overlay.classList.add('show');
}

function closeBadgeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeBadgeModal();
});

document.getElementById('modalCloseBtn').addEventListener('click', closeBadgeModal);

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langLabel').textContent = lang === 'en' ? 'EN' : 'ع';

/* ============================================
   CONFETTI
============================================ */
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');

const CONF_COLORS = [
  '#0E7C7B', '#4DB6AC', '#5B9BD5', '#9B7EDE',
  '#FFC107', '#FFD54F', '#FF9800', '#E8A0BF'
];

let confettiPieces = [];
let confettiActive = false;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function createConfetti(count = 60) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;

  for (let i = 0; i < count; i++) {
    confettiPieces.push({
      x: Math.random() * w,
      y: -10 - Math.random() * h * 0.5,
      w: 5 + Math.random() * 6,
      h: 6 + Math.random() * 8,
      color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.15,
      vy: 1.4 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 1.3,
      shape: Math.random() < 0.7 ? 'rect' : 'circle',
      opacity: 1
    });
  }
}

function drawConfetti() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  confettiPieces.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vRot;
    p.vy += 0.02;
    p.vx *= 0.995;

    if (p.y > h * 0.7) p.opacity -= 0.008;
    if (p.y > h + 20 || p.opacity <= 0) {
      confettiPieces.splice(i, 1);
      return;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(p.opacity, 0);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.restore();
  });
}

function confettiLoop() {
  if (!confettiActive) return;
  drawConfetti();
  if (confettiPieces.length > 0) {
    requestAnimationFrame(confettiLoop);
  } else {
    confettiActive = false;
  }
}

function startConfetti() {
  resizeCanvas();
  createConfetti(70);
  confettiActive = true;
  confettiLoop();
}

  if (unlockedCount > 0) {
