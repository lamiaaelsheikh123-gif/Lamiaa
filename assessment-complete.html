 <!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Assessment Complete</title>

<!-- ✅ الخطوط الأصلية: Poppins + Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS — Omega Design System
============================================ */
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;

  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;

  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;

  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 23, 42, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 148, 135, 0.18);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 148, 135, 0.05), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.confetti-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
}

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }
.content > * { flex-shrink: 0; }

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  padding: 4px 0;
}

.hero-icon {
  position: relative;
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.4);
  animation: iconPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
}

@keyframes iconPop {
  0%   { opacity: 0; transform: scale(0.4) rotate(-20deg); }
  60%  { opacity: 1; transform: scale(1.15) rotate(8deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.hero-icon::after {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 148, 135, 0.28) 0%, transparent 65%);
  filter: blur(26px);
  z-index: -1;
  animation: pulseGlow 2.4s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.12); }
}

.hero-icon-inner {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--g-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 12px 32px rgba(14, 148, 135, 0.35),
    inset 0 -4px 12px rgba(0, 0, 0, 0.1),
    inset 0 4px 12px rgba(255, 255, 255, 0.3);
}

.hero-icon-inner svg {
  width: 42px;
  height: 42px;
  stroke: #fff;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawCheck 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.6s forwards;
}

@keyframes drawCheck {
  to { stroke-dashoffset: 0; }
}

.hero-title {
  font-size: 26px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.5px;
  line-height: 1.2;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.4s forwards;
}

html[lang="ar"] .hero-title { font-family: var(--f-ar); font-size: 25px; letter-spacing: 0; }

.hero-desc {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 300px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.55s forwards;
}

html[lang="ar"] .hero-desc { font-family: var(--f-ar); font-size: 14.5px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.ai-note {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.10), rgba(59, 130, 246, 0.10));
  border: 1.5px solid rgba(139, 92, 246, 0.25);
  border-radius: var(--r-lg);
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.7s forwards;
  position: relative;
  overflow: hidden;
}

.ai-note::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 2.5s ease-in-out infinite;
}

@keyframes shimmer {
  0%   { left: -100%; }
  100% { left: 200%; }
}

.ai-spark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--g-brand);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
  animation: sparkPulse 1.8s ease-in-out infinite;
  position: relative;
  z-index: 2;
}

@keyframes sparkPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}

.ai-spark svg {
  width: 18px;
  height: 18px;
  stroke: #fff;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ai-text {
  flex: 1;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--c-navy);
  line-height: 1.5;
  position: relative;
  z-index: 2;
}

html[lang="ar"] .ai-text { font-family: var(--f-ar); font-size: 13.5px; }

.ai-dots {
  display: inline-flex;
  gap: 2px;
  margin-inline-start: 4px;
}

.ai-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c-purple);
  animation: dotBounce 1.2s ease-in-out infinite;
}

.ai-dots span:nth-child(1) { animation-delay: 0s; }
.ai-dots span:nth-child(2) { animation-delay: 0.15s; }
.ai-dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%           { opacity: 1; transform: translateY(-4px); }
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline-start: 4px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.6s ease 0.85s forwards;
}

.section-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; letter-spacing: 0; }

.section-count {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-slate);
  background: rgba(14, 148, 135, 0.08);
  padding: 3px 9px;
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-count { font-family: var(--f-ar); font-size: 12.5px; }

.skills-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding-bottom: 4px;
}

.skill-card {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(16px);
  animation: skillIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.skill-card:nth-child(1) { animation-delay: 0.95s; }
.skill-card:nth-child(2) { animation-delay: 1.00s; }
.skill-card:nth-child(3) { animation-delay: 1.05s; }
.skill-card:nth-child(4) { animation-delay: 1.10s; }
.skill-card:nth-child(5) { animation-delay: 1.15s; }
.skill-card:nth-child(6) { animation-delay: 1.20s; }
.skill-card:nth-child(7) { animation-delay: 1.25s; }

@keyframes skillIn {
  to { opacity: 1; transform: translateY(0); }
}

.skill-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.skill-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.skill-icon svg {
  width: 16px;
  height: 16px;
  stroke: #fff;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  position: relative;
  z-index: 2;
}

.skill-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
}

.skill-icon.memory::before    { background: linear-gradient(135deg, #0E9487, #2EC4B6); }
.skill-icon.attention::before { background: linear-gradient(135deg, #EF4444, #FBBF24); }
.skill-icon.speed::before     { background: linear-gradient(135deg, #3B82F6, #2EC4B6); }
.skill-icon.problem::before   { background: linear-gradient(135deg, #8B5CF6, #3B82F6); }
.skill-icon.visual::before    { background: linear-gradient(135deg, #2EC4B6, #8B5CF6); }
.skill-icon.language::before  { background: linear-gradient(135deg, #FBBF24, #EC4899); }
.skill-icon.numerical::before { background: linear-gradient(135deg, #3B82F6, #8B5CF6); }

.skill-name {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  line-height: 1.2;
  flex: 1;
}

html[lang="ar"] .skill-name { font-family: var(--f-ar); font-size: 12.5px; letter-spacing: 0; }

.skill-score-wrap {
  display: flex;
  align-items: baseline;
  gap: 3px;
}

.skill-score {
  font-size: 24px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -1px;
  line-height: 1;
  font-feature-settings: "tnum";
}

.skill-percent {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-slate);
}

.skill-bar {
  width: 100%;
  height: 5px;
  background: rgba(14, 148, 135, 0.08);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.skill-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--r-pill);
  background: var(--g-brand);
  transition: width 1.2s cubic-bezier(0.65, 0, 0.35, 1) 1.4s;
  box-shadow: 0 0 8px rgba(14, 148, 135, 0.3);
}

.skill-card.high .skill-score { color: var(--c-success); }
.skill-card.mid  .skill-score { color: var(--c-warning); }
.skill-card.low  .skill-score { color: var(--c-error); }

.skill-card.high .skill-bar-fill { background: linear-gradient(90deg, #22C55E, #4ADE80); }
.skill-card.mid  .skill-bar-fill { background: linear-gradient(90deg, #FBBF24, #F59E0B); }
.skill-card.low  .skill-bar-fill { background: linear-gradient(90deg, #EF4444, #F87171); }

.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 18px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 148, 135, 0.32);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.7s ease 1.4s forwards;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(14, 148, 135, 0.4);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .confetti-canvas { display: none; }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

      <!-- Top Bar -->
      <div class="topbar">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Hero -->
        <div class="hero">
          <div class="hero-icon">
            <div class="hero-icon-inner">
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </div>
          <h1 class="hero-title" id="heroTitle">Assessment Complete!</h1>
          <p class="hero-desc" id="heroDesc">You've finished all 7 cognitive challenges. Great job!</p>
        </div>

        <!-- AI Note -->
        <div class="ai-note">
          <div class="ai-spark">
            <svg viewBox="0 0 24 24">
              <path d="M12 3 L13.5 9 L19.5 10.5 L13.5 12 L12 18 L10.5 12 L4.5 10.5 L10.5 9 Z"></path>
              <path d="M19 3 L19.8 6 L22.5 6.8 L19.8 7.5 L19 10.5 L18.2 7.5 L15.5 6.8 L18.2 6 Z" opacity="0.7"></path>
            </svg>
          </div>
          <div class="ai-text" id="aiText">
            AI is analyzing your results
            <span class="ai-dots"><span></span><span></span><span></span></span>
          </div>
        </div>

        <!-- Summary -->
        <div class="section-head">
          <div class="section-title" id="sectionTitle">Your Results</div>
          <div class="section-count" id="sectionCount">7 skills</div>
        </div>

        <div class="skills-grid" id="skillsGrid"></div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="nextBtn">
          <span id="nextLabel">See My Cognitive Profile</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    heroTitle: 'Assessment Complete!',
    heroDesc: "You've finished all 7 cognitive challenges. Great job!",
    aiText: 'AI is analyzing your results',
    sectionTitle: 'Your Results',
    sectionCount: '7 skills',
    nextLabel: 'See My Cognitive Profile',

    skills: {
      memory:    'Memory',
      attention: 'Attention',
      speed:     'Processing Speed',
      problem:   'Problem Solving',
      visual:    'Visual Skills',
      language:  'Language',
      numerical: 'Numerical'
    }
  },
  ar: {
    heroTitle: 'اكتمل التقييم!',
    heroDesc: 'أتممت جميع التحديات الذهنية السبعة. عمل رائع!',
    aiText: 'الذكاء الاصطناعي يحلل نتائجك',
    sectionTitle: 'نتائجك',
    sectionCount: '7 مهارات',
    nextLabel: 'شاهد ملفك الذهني',

    skills: {
      memory:    'الذاكرة',
      attention: 'الانتباه',
      speed:     'سرعة المعالجة',
      problem:   'حل المشكلات',
      visual:    'المهارات البصرية',
      language:  'اللغة',
      numerical: 'الرقمي'
    }
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl = document.documentElement;

  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('langCurrent').textContent = lang === 'en' ? 'EN' : 'ع';
  document.getElementById('langOther').textContent = lang === 'en' ? 'ع' : 'EN';

  const t = I18N[lang];

  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroDesc').textContent = t.heroDesc;
  document.getElementById('aiText').innerHTML = t.aiText + ' <span class="ai-dots"><span></span><span></span><span></span></span>';
  document.getElementById('sectionTitle').textContent = t.sectionTitle;
  document.getElementById('sectionCount').textContent = t.sectionCount;
  document.getElementById('nextLabel').textContent = t.nextLabel;

  renderSkills();
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   GET SCORE
============================================ */
function getScore(storageKey) {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
    if (typeof data.accuracy === 'number') return data.accuracy;
    return 0;
  } catch (e) { return 0; }
}

function getScoreClass(score) {
  if (score >= 70) return 'high';
  if (score >= 40) return 'mid';
  return 'low';
}

/* ============================================
   RENDER SKILLS
============================================ */
function renderSkills() {
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = '';

  const t = I18N[currentLang];

  SKILLS.forEach((skill) => {
    const score = getScore(skill.storageKey);
    const cls = getScoreClass(score);

    const card = document.createElement('div');
    card.className = `skill-card ${cls}`;
    card.innerHTML = `
      <div class="skill-head">
        <div class="skill-icon ${skill.key}">
          ${skill.icon}
        </div>
        <div class="skill-name">${t.skills[skill.key]}</div>
      </div>
      <div class="skill-score-wrap">
        <div class="skill-score" data-target="${score}">0</div>
        <div class="skill-percent">%</div>
      </div>
      <div class="skill-bar">
        <div class="skill-bar-fill" data-width="${score}"></div>
      </div>
    `;
    grid.appendChild(card);
  });

  setTimeout(() => {
    document.querySelectorAll('.skill-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
    document.querySelectorAll('.skill-score').forEach(el => {
      animateNumber(el, 0, parseInt(el.dataset.target), 1200);
    });
  }, 100);
}

function animateNumber(el, start, end, duration) {
  const startTime = performance.now();
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.round(start + (end - start) * eased);
    el.textContent = value;
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = end;
  }
  requestAnimationFrame(step);
}

/* ============================================
   CONFETTI
============================================ */
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');

const CONF_COLORS = [
  '#0E9487', '#2EC4B6',
  '#3B82F6', '#8B5CF6',
  '#FBBF24', '#F59E0B',
  '#EC4899', '#22C55E'
];

let confettiPieces = [];
let confettiActive = false;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function createConfetti(count = 80) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;

  for (let i = 0; i < count; i++) {
    confettiPieces.push({
      x: Math.random() * w,
      y: -10 - Math.random() * h * 0.5,
      w: 5 + Math.random() * 6,
      h: 6 + Math.random() * 8,
      color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.15,
      vy: 1.5 + Math.random() * 2.5,
      vx: (Math.random() - 0.5) * 1.5,
      shape: Math.random() < 0.7 ? 'rect' : 'circle',
      opacity: 1
    });
  }
}

function drawConfetti() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;

  ctx.clearRect(0, 0, w, h);

  confettiPieces.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vRot;
    p.vy += 0.02;
    p.vx *= 0.995;

    if (p.y > h * 0.7) p.opacity -= 0.008;

    if (p.y > h + 20 || p.opacity <= 0) {
      confettiPieces.splice(i, 1);
      return;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(p.opacity, 0);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.restore();
  });
}

function confettiLoop() {
  if (!confettiActive) return;
  drawConfetti();
  if (confettiPieces.length > 0) {
    requestAnimationFrame(confettiLoop);
  } else {
    confettiActive = false;
  }
}

function startConfetti() {
  resizeCanvas();
  createConfetti(90);
  confettiActive = true;
  confettiLoop();

  setTimeout(() => {
    createConfetti(60);
    if (!confettiActive) {
      confettiActive = true;
      confettiLoop();
    }
  }, 800);
}
