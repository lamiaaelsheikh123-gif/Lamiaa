<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Profile Setup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);
  --sh-focus: 0 0 0 4px rgba(14, 124, 123, 0.12);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.screen::-webkit-scrollbar { display: none; }

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   TOP BAR
============================================ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateX(-2px);
}

html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 32px 26px 30px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.15s forwards;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(14, 124, 123, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 66%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 0 10px rgba(14, 124, 123, 0.3);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

.progress-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.4px;
  white-space: nowrap;
}

html[lang="ar"] .progress-text { font-family: var(--f-ar); letter-spacing: 0; font-size: 12.5px; }

/* Heading */
.heading-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 0.25s forwards;
}

.heading {
  font-size: 24px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
}

html[lang="ar"] .heading { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.subheading {
  font-size: 13.5px;
  color: var(--c-slate);
  line-height: 1.55;
}

html[lang="ar"] .subheading { font-family: var(--f-ar); font-size: 14.5px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   SECTION
============================================ */
.section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title .num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--g-brand);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(14, 124, 123, 0.25);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14px; letter-spacing: 0; }

/* ============================================
   AGE INPUT
============================================ */
.age-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  transition: all 0.25s ease;
}

.age-wrap:focus-within {
  border-color: var(--c-primary);
  box-shadow: var(--sh-focus);
}

.age-wrap.error {
  border-color: var(--c-error);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

.age-btn {
  width: 40px; height: 40px;
  border-radius: var(--r-sm);
  background: rgba(14, 124, 123, 0.08);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.age-btn:hover { background: rgba(14, 124, 123, 0.15); transform: scale(1.05); }
.age-btn:active { transform: scale(0.92); }

.age-btn svg {
  width: 16px; height: 16px;
  stroke: var(--c-primary);
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
}

.age-input {
  flex: 1;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--c-navy);
  border: none;
  outline: none;
  background: transparent;
  -moz-appearance: textfield;
  appearance: textfield;
  letter-spacing: 0.5px;
}

.age-input::-webkit-outer-spin-button,
.age-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.age-unit {
  font-size: 13px;
  color: var(--c-slate);
  font-weight: 500;
  padding-inline-end: 8px;
}

html[lang="ar"] .age-unit { font-family: var(--f-ar); font-size: 14px; }

.err-msg {
  font-size: 11.5px;
  color: var(--c-error);
  font-weight: 500;
  padding-inline-start: 4px;
  min-height: 0;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.3s ease;
}

.section.has-error .err-msg {
  min-height: 16px;
  max-height: 30px;
  opacity: 1;
}

html[lang="ar"] .err-msg { font-family: var(--f-ar); font-size: 12.5px; }

/* ============================================
   CHIPS (Training Days)
============================================ */
.chips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.chip {
  padding: 12px 6px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  text-align: center;
  transition: all 0.28s cubic-bezier(0.65, 0, 0.35, 1);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.2px;
}

html[lang="ar"] .chip { font-family: var(--f-ar); font-size: 13px; letter-spacing: 0; }

.chip:hover {
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-2px);
}

.chip.active {
  background: var(--g-brand);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.3);
  transform: translateY(-2px);
}

.chip.active::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%);
  animation: chipPop 0.5s ease;
}

@keyframes chipPop {
  0%   { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

/* ============================================
   RADIO CARDS (Preferred Time)
============================================ */
.radio-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.radio-card {
  position: relative;
  padding: 14px 8px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: all 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  cursor: pointer;
  overflow: hidden;
}

.radio-card:hover {
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-2px);
}

.radio-card.active {
  background: var(--g-brand);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 10px 24px rgba(14, 124, 123, 0.28);
  transform: translateY(-3px);
}

.radio-card svg {
  width: 22px; height: 22px;
  stroke: var(--c-primary);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.3s ease;
}

.radio-card.active svg { stroke: #fff; }

.radio-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  transition: color 0.3s ease;
}

.radio-card.active .radio-label { color: #fff; }

html[lang="ar"] .radio-label { font-family: var(--f-ar); font-size: 13px; }

/* ============================================
   DURATION CARDS
============================================ */
.duration-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.duration-card {
  padding: 14px 4px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  text-align: center;
  transition: all 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}

.duration-card:hover {
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-2px);
}

.duration-card.active {
  background: var(--g-brand);
  border-color: transparent;
  box-shadow: 0 10px 24px rgba(14, 124, 123, 0.28);
  transform: translateY(-3px);
}

.duration-num {
  font-size: 18px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  transition: color 0.3s ease;
}

.duration-unit {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  transition: color 0.3s ease;
}

.duration-card.active .duration-num,
.duration-card.active .duration-unit { color: #fff; }

html[lang="ar"] .duration-num { font-family: var(--f-ar); }
html[lang="ar"] .duration-unit { font-family: var(--f-ar); text-transform: none; letter-spacing: 0; }

/* Stagger each section */
.section { opacity: 0; transform: translateY(14px); }
.section:nth-child(3) { animation: fadeUp 0.6s ease 0.35s forwards; }
.section:nth-child(4) { animation: fadeUp 0.6s ease 0.45s forwards; }
.section:nth-child(5) { animation: fadeUp 0.6s ease 0.55s forwards; }
.section:nth-child(6) { animation: fadeUp 0.6s ease 0.65s forwards; }

/* ============================================
   BOTTOM
============================================ */
.bottom {
  position: relative;
  z-index: 10;
  padding: 20px 26px 44px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 124, 123, 0.35);
}

.btn-primary:active:not(:disabled) { transform: scale(0.97); }

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: 0 8px 20px rgba(14, 124, 123, 0.15);
}

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover:not(:disabled) .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

/* ============================================
   REDUCED MOTION
============================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="progress-text" id="progressText">Step 2 of 3</div>
        </div>

        <!-- Heading -->
        <div class="heading-wrap">
          <h1 class="heading" id="heading">Let's build your profile</h1>
          <p class="subheading" id="subheading">A few details to shape your personalized training plan.</p>
        </div>

        <!-- Section 1: Age -->
        <div class="section" id="sectionAge">
          <div class="section-title">
            <span class="num">1</span>
            <span id="titleAge">Your Age</span>
          </div>
          <div class="age-wrap" id="ageWrap">
            <button class="age-btn" id="ageMinus" aria-label="Decrease">
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="number" class="age-input" id="ageInput" value="24" min="6" max="120" />
            <span class="age-unit" id="ageUnit">years</span>
            <button class="age-btn" id="agePlus" aria-label="Increase">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
          <div class="err-msg" id="errAge"></div>
        </div>

        <!-- Section 2: Training Days -->
        <div class="section" id="sectionDays">
          <div class="section-title">
            <span class="num">2</span>
            <span id="titleDays">Training Days</span>
          </div>
          <div class="chips" id="daysChips">
            <button class="chip" data-day="sun">Sun</button>
            <button class="chip" data-day="mon">Mon</button>
            <button class="chip" data-day="tue">Tue</button>
            <button class="chip" data-day="wed">Wed</button>
            <button class="chip" data-day="thu">Thu</button>
            <button class="chip" data-day="fri">Fri</button>
            <button class="chip" data-day="sat">Sat</button>
          </div>
          <div class="err-msg" id="errDays"></div>
        </div>

        <!-- Section 3: Preferred Time -->
        <div class="section" id="sectionTime">
          <div class="section-title">
            <span class="num">3</span>
            <span id="titleTime">Preferred Time</span>
          </div>
          <div class="radio-row" id="timeOptions">
            <button class="radio-card" data-time="morning">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
              <span class="radio-label" id="timeMorning">Morning</span>
            </button>
            <button class="radio-card" data-time="afternoon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path>
              </svg>
              <span class="radio-label" id="timeAfternoon">Afternoon</span>
            </button>
            <button class="radio-card" data-time="evening">
              <svg viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span class="radio-label" id="timeEvening">Evening</span>
            </button>
          </div>
          <div class="err-msg" id="errTime"></div>
        </div>

        <!-- Section 4: Daily Duration -->
        <div class="section" id="sectionDuration">
          <div class="section-title">
            <span class="num">4</span>
            <span id="titleDuration">Daily Available Time</span>
          </div>
          <div class="duration-row" id="durationOptions">
            <button class="duration-card" data-min="10">
              <span class="duration-num">10</span>
              <span class="duration-unit" id="unitMin1">min</span>
            </button>
            <button class="duration-card" data-min="15">
              <span class="duration-num">15</span>
              <span class="duration-unit" id="unitMin2">min</span>
            </button>
            <button class="duration-card" data-min="20">
              <span class="duration-num">20</span>
              <span class="duration-unit" id="unitMin3">min</span>
            </button>
            <button class="duration-card" data-min="30">
              <span class="duration-num">30</span>
              <span class="duration-unit" id="unitMin4">min</span>
            </button>
          </div>
          <div class="err-msg" id="errDuration"></div>
        </div>

      </div>

      <!-- Bottom -->
      <div class="bottom">
        <button class="btn-primary" id="continueBtn" disabled>
          <span id="continueLabel">Continue</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    progress: 'Step 2 of 3',
    heading: "Let's build your profile",
    subheading: 'A few details to shape your personalized training plan.',

    titleAge: 'Your Age',
    titleDays: 'Training Days',
    titleTime: 'Preferred Time',
    titleDuration: 'Daily Available Time',

    ageUnit: 'years',

    days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],

    timeMorning: 'Morning',
    timeAfternoon: 'Afternoon',
    timeEvening: 'Evening',

    unitMin: 'min',

    continue: 'Continue',

    errAge: 'Age must be between 6 and 120',
    errDays: 'Select at least one day',
    errTime: 'Please pick a preferred time',
    errDuration: 'Please choose a daily duration'
  },
  ar: {
    progress: 'الخطوة 2 من 3',
    heading: 'هيا نبني ملفك',
    subheading: 'بعض التفاصيل لتشكيل خطة التدريب المخصصة لك.',

    titleAge: 'عمرك',
    titleDays: 'أيام التدريب',
    titleTime: 'الوقت المفضل',
    titleDuration: 'الوقت اليومي المتاح',

    ageUnit: 'سنة',

    days: ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'],

    timeMorning: 'صباحًا',
    timeAfternoon: 'بعد الظهر',
    timeEvening: 'مساءً',

    unitMin: 'دقيقة',

    continue: 'متابعة',

    errAge: 'العمر يجب أن يكون بين 6 و 120',
    errDays: 'اختر يومًا واحدًا على الأقل',
    errTime: 'الرجاء اختيار الوقت المفضل',
    errDuration: 'الرجاء اختيار الوقت اليومي'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  document.getElementById('progressText').textContent = I18N[lang].progress;
  document.getElementById('heading').textContent      = I18N[lang].heading;
  document.getElementById('subheading').textContent   = I18N[lang].subheading;

  document.getElementById('titleAge').textContent      = I18N[lang].titleAge;
  document.getElementById('titleDays').textContent     = I18N[lang].titleDays;
  document.getElementById('titleTime').textContent     = I18N[lang].titleTime;
  document.getElementById('titleDuration').textContent = I18N[lang].titleDuration;

  document.getElementById('ageUnit').textContent = I18N[lang].ageUnit;

  document.getElementById('timeMorning').textContent   = I18N[lang].timeMorning;
  document.getElementById('timeAfternoon').textContent = I18N[lang].timeAfternoon;
  document.getElementById('timeEvening').textContent   = I18N[lang].timeEvening;

  ['unitMin1', 'unitMin2', 'unitMin3', 'unitMin4'].forEach(id => {
    document.getElementById(id).textContent = I18N[lang].unitMin;
  });

  // Days labels
  const dayChips = document.querySelectorAll('#daysChips .chip');
  dayChips.forEach((chip, i) => {
    chip.textContent = I18N[lang].days[i];
  });

  document.getElementById('continueLabel').textContent = I18N[lang].continue;

  // Errors (لو ظاهرة)
  refreshErrors();
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   STATE
============================================ */
const state = {
  age: 24,
  days: [],
  time: null,
  duration: null
};

/* ============================================
   AGE INPUT
============================================ */
const ageInput = document.getElementById('ageInput');
const ageMinus = document.getElementById('ageMinus');
const agePlus  = document.getElementById('agePlus');
const ageWrap  = document.getElementById('ageWrap');
const sectionAge = document.getElementById('sectionAge');

function setAge(val) {
  val = Math.max(6, Math.min(120, val));
  state.age = val;
  ageInput.value = val;
  clearError('age');
  checkComplete();
}

ageMinus.addEventListener('click', () => setAge(state.age - 1));
agePlus.addEventListener('click',  () => setAge(state.age + 1));

ageInput.addEventListener('input', () => {
  const v = parseInt(ageInput.value);
  if (!isNaN(v)) state.age = v;
  checkComplete();
});

ageInput.addEventListener('blur', () => {
  let v = parseInt(ageInput.value);
  if (isNaN(v) || v < 6 || v > 120) {
    showError('age', 'errAge');
  } else {
    setAge(v);
  }
});

/* ============================================
   DAYS CHIPS
============================================ */
const dayChips = document.querySelectorAll('#daysChips .chip');

dayChips.forEach(chip => {
  chip.addEventListener('click', () => {
    const day = chip.dataset.day;
    const idx = state.days.indexOf(day);

    if (idx > -1) {
      state.days.splice(idx, 1);
      chip.classList.remove('active');
    } else {
      state.days.push(day);
      chip.classList.add('active');
    }

    if (state.days.length > 0) clearError('days');
    checkComplete();
  });
});

/* ============================================
   TIME OPTIONS
============================================ */
const timeCards = document.querySelectorAll('#timeOptions .radio-card');

timeCards.forEach(card => {
  card.addEventListener('click', () => {
    timeCards.forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    state.time = card.dataset.time;
    clearError('time');
    checkComplete();
  });
});

/* ============================================
   DURATION OPTIONS
============================================ */
const durationCards = document.querySelectorAll('#durationOptions .duration-card');

durationCards.forEach(card => {
  card.addEventListener('click', () => {
    durationCards.forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    state.duration = parseInt(card.dataset.min);
    clearError('duration');
    checkComplete();
  });
});

/* ============================================
   VALIDATION & COMPLETE
============================================ */
function checkComplete() {
  const ageOk      = state.age >= 6 && state.age <= 120;
  const daysOk     = state.days.length > 0;
  const timeOk     = state.time !== null;
  const durationOk = state.duration !== null;

  document.getElementById('continueBtn').disabled = !(ageOk && daysOk && timeOk && durationOk);
}

const errEls = {
  age:      document.getElementById('errAge'),
  days:     document.getElementById('errDays'),
  time:     document.getElementById('errTime'),
  duration: document.getElementById('errDuration')
};

const sections = {
  age:      sectionAge,
  days:     document.getElementById('sectionDays'),
  time:     document.getElementById('sectionTime'),
  duration: document.getElementById('sectionDuration')
};

const errKeys = {
  age: 'errAge',
  days: 'errDays',
  time: 'errTime',
  duration: 'errDuration'
};

function showError(field, key) {
  sections[field].classList.add('has-error');
  errEls[field].textContent = I18N[currentLang][key];
  if (field === 'age') ageWrap.classList.add('error');
}

function clearError(field) {
  sections[field].classList.remove('has-error');
  errEls[field].textContent = '';
  if (field === 'age') ageWrap.classList.remove('error');
}

function refreshErrors() {
  Object.keys(sections).forEach(field => {
    if (sections[field].classList.contains('has-error')) {
      errEls[field].textContent = I18N[currentLang][errKeys[field]];
    }
  });
}

/* ============================================
   CONTINUE
============================================ */
document.getElementById('continueBtn').addEventListener('click', () => {
  // Save
  localStorage.setItem('memento_age', state.age);
  localStorage.setItem('memento_days', JSON.stringify(state.days));
  localStorage.setItem('memento_time', state.time);
  localStorage.setItem('memento_duration', state.duration);

  // Animation
  const btn = document.getElementById('continueBtn');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => { btn.style.transform = ''; }, 150);





  setTimeout(() => {
  window.location.href = 'assessment-intro.html';
}, 250);


});

/* ============================================
   BACK
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'account-type.html';
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
checkComplete();
</script>

</body>
</html>
