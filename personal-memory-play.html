<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Personal Memory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B; --c-primary-light: #4DB6AC; --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5; --c-navy: #0F2C4C; --c-slate: #5A6C7D;
  --c-bg: #FAF8F3; --c-card: #FFFFFF; --c-border: #EAE6DE;
  --c-error: #E57373; --c-success: #4CAF50; --c-warning: #FF9800;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-heart: linear-gradient(135deg, #E8A0BF, #9B7EDE);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(232, 160, 191, 0.15), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(155, 126, 222, 0.12), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(232, 160, 191, 0.12), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(155, 126, 222, 0.10), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.exit-btn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(232, 160, 191, 0.3);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.exit-btn:hover {
  background: #fff;
  border-color: rgba(229, 115, 115, 0.4);
  transform: scale(1.05);
}

.exit-btn svg {
  width: 15px; height: 15px;
  stroke: var(--c-slate); stroke-width: 2.4; fill: none;
  stroke-linecap: round;
}

.exit-btn:hover svg { stroke: var(--c-error); }

/* HUD */
.hud {
  display: flex; gap: 6px; align-items: center;
}

.hud-box {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(232, 160, 191, 0.3);
  border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 700;
  color: var(--c-navy);
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
  font-feature-settings: "tnum";
}

.hud-box svg {
  width: 12px; height: 12px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.hud-box.q { color: var(--c-secondary); }
.hud-box.score { color: var(--c-success); }

/* Voice indicator */
.voice-indicator {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  background: linear-gradient(135deg, rgba(155, 126, 222, 0.15), rgba(232, 160, 191, 0.15));
  border: 1px solid rgba(155, 126, 222, 0.3);
  border-radius: var(--r-pill);
  font-size: 10.5px; font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.3px;
}

.voice-indicator svg {
  width: 11px; height: 11px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.voice-indicator.speaking svg {
  animation: voicePulse 1s ease-in-out infinite;
}

@keyframes voicePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.25); opacity: 0.7; }
}

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 22px 24px;
  display: flex; flex-direction: column; gap: 14px;
  overflow: hidden;
  min-height: 0;
}

/* STATUS */
.status-wrap {
  text-align: center;
  display: flex; flex-direction: column; gap: 4px;
  min-height: 46px;
  justify-content: center;
  flex-shrink: 0;
}

.status-text {
  font-size: 16px; font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}

.status-text .pulse-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--g-heart);
  animation: pulseDot 1s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.4); opacity: 0.5; }
}

html[lang="ar"] .status-text { font-family: var(--f-ar); font-size: 15.5px; }

.status-sub { font-size: 12px; color: var(--c-slate); font-weight: 500; }
html[lang="ar"] .status-sub { font-family: var(--f-ar); font-size: 13px; }

/* PROGRESS PIPS */
.pips-row {
  display: flex; justify-content: center; gap: 5px;
  padding: 2px 0 4px;
  min-height: 20px;
  flex-shrink: 0;
}

.pip {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(232, 160, 191, 0.2);
  transition: all 0.3s ease;
}

.pip.filled {
  background: var(--g-heart);
  transform: scale(1.1);
  box-shadow: 0 0 6px rgba(232, 160, 191, 0.5);
}

.pip.correct {
  background: var(--c-success);
  box-shadow: 0 0 6px rgba(76, 175, 80, 0.5);
}

.pip.wrong {
  background: var(--c-error);
  box-shadow: 0 0 6px rgba(229, 115, 115, 0.5);
}

/* PLAY AREA */
.play-area {
  flex: 1;
  display: flex; flex-direction: column;
  gap: 12px;
  min-height: 0;
}

/* Question card */
.question-card {
  position: relative;
  background: linear-gradient(135deg, rgba(232, 160, 191, 0.10), rgba(155, 126, 222, 0.10));
  border: 1.5px solid rgba(232, 160, 191, 0.3);
  border-radius: var(--r-xl);
  padding: 20px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  overflow: hidden;
  flex-shrink: 0;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 4px;
  background: var(--g-heart);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
}

.q-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(155, 126, 222, 0.3);
  border-radius: var(--r-pill);
  font-size: 9.5px; font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

html[lang="ar"] .q-badge {
  font-family: var(--f-ar);
  text-transform: none; letter-spacing: 0;
  font-size: 10.5px;
}

.q-badge svg {
  width: 11px; height: 11px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.q-text {
  font-size: 22px; font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.3;
  text-align: center;
}

html[lang="ar"] .q-text { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

/* Speaker animation */
.speaker-wrap {
  position: relative;
  width: 60px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--g-heart);
  box-shadow: 0 10px 28px rgba(232, 160, 191, 0.4);
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.25s ease;
}

.speaker-wrap:hover { transform: scale(1.05); }
.speaker-wrap:active { transform: scale(0.95); }

.speaker-wrap.speaking {
  animation: speakerPulse 1s ease-in-out infinite;
}

@keyframes speakerPulse {
  0%, 100% { box-shadow: 0 10px 28px rgba(232, 160, 191, 0.4), 0 0 0 0 rgba(232, 160, 191, 0.5); }
  50%      { box-shadow: 0 10px 28px rgba(232, 160, 191, 0.4), 0 0 0 12px rgba(232, 160, 191, 0); }
}

.speaker-wrap svg {
  width: 28px; height: 28px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Waveform */
.waveform {
  display: flex; align-items: center; justify-content: center;
  gap: 3px;
  height: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.waveform.active { opacity: 1; }

.waveform span {
  width: 3px;
  background: var(--c-secondary);
  border-radius: var(--r-pill);
  animation: waveBounce 1.2s ease-in-out infinite;
}

.waveform span:nth-child(1) { animation-delay: 0s; height: 8px; }
.waveform span:nth-child(2) { animation-delay: 0.15s; height: 14px; }
.waveform span:nth-child(3) { animation-delay: 0.30s; height: 18px; }
.waveform span:nth-child(4) { animation-delay: 0.45s; height: 14px; }
.waveform span:nth-child(5) { animation-delay: 0.60s; height: 8px; }

@keyframes waveBounce {
  0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
  50%      { transform: scaleY(1.3); opacity: 1; }
}

/* Options grid */
.options-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  min-height: 0;
  align-content: start;
}

.option-card {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.65, 0, 0.35, 1);
  overflow: hidden;
  opacity: 0;
  transform: translateY(14px);
  animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  min-height: 100px;
}

@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

.option-card:nth-child(1) { animation-delay: 0.05s; }
.option-card:nth-child(2) { animation-delay: 0.10s; }
.option-card:nth-child(3) { animation-delay: 0.15s; }
.option-card:nth-child(4) { animation-delay: 0.20s; }

.option-card:hover:not(.locked) {
  border-color: rgba(155, 126, 222, 0.4);
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(155, 126, 222, 0.15);
}

.option-card:active:not(.locked) { transform: scale(0.96); }

/* Avatar */
.option-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--g-heart);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(232, 160, 191, 0.35);
  border: 2.5px solid #fff;
}

.option-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.option-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  text-align: center;
  line-height: 1.2;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .option-name { font-family: var(--f-ar); font-size: 13.5px; letter-spacing: 0; }

/* Option states */
.option-card.correct {
  background: linear-gradient(135deg, rgba(76, 175, 80, 0.10), rgba(102, 187, 106, 0.05));
  border-color: var(--c-success);
  border-width: 2.5px;
  box-shadow: 0 12px 30px rgba(76, 175, 80, 0.25);
  transform: translateY(-3px);
}

.option-card.correct .check-badge {
  display: flex;
}

.option-card.wrong {
  background: linear-gradient(135deg, rgba(229, 115, 115, 0.10), rgba(239, 83, 80, 0.05));
  border-color: var(--c-error);
  border-width: 2.5px;
  animation: wrongShake 0.4s ease;
  opacity: 0.7;
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-8px); }
  75%      { transform: translateX(8px); }
}

.check-badge {
  position: absolute;
  top: 6px; right: 6px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--c-success);
  display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
}

html[dir="rtl"] .check-badge { right: auto; left: 6px; }

.check-badge svg {
  width: 12px; height: 12px;
  stroke: #fff; stroke-width: 3.5; fill: none;
}

.option-card.locked { pointer-events: none; }

/* Repeat button */
.repeat-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.85);
  border: 1.5px solid rgba(155, 126, 222, 0.25);
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.2px;
  transition: all 0.25s ease;
  align-self: center;
  margin-top: 4px;
}

.repeat-btn:hover {
  background: #fff;
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(155, 126, 222, 0.2);
}

.repeat-btn:active { transform: scale(0.96); }

.repeat-btn svg {
  width: 13px; height: 13px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .repeat-btn { font-family: var(--f-ar); font-size: 12.5px; letter-spacing: 0; }

/* EMPTY STATE (no memory bank) */
.empty-state {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 20px;
}

.empty-icon {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(232, 160, 191, 0.2), rgba(155, 126, 222, 0.2));
  display: flex; align-items: center; justify-content: center;
  animation: floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

.empty-icon svg {
  width: 40px; height: 40px;
  stroke: var(--c-secondary); stroke-width: 2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.empty-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
}

html[lang="ar"] .empty-title { font-family: var(--f-ar); font-size: 19px; letter-spacing: 0; }

.empty-text {
  font-size: 13px;
  color: var(--c-slate);
  font-weight: 500;
  line-height: 1.6;
  max-width: 280px;
}

html[lang="ar"] .empty-text { font-family: var(--f-ar); font-size: 14px; }

.empty-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 14px 24px;
  background: var(--g-heart);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  border-radius: var(--r-md);
  box-shadow: 0 12px 28px rgba(232, 160, 191, 0.35);
  transition: all 0.25s ease;
  margin-top: 8px;
}

.empty-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(232, 160, 191, 0.45);
}

.empty-btn:active { transform: scale(0.97); }

.empty-btn svg {
  width: 15px; height: 15px;
  stroke: #fff; stroke-width: 2.6; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .empty-btn { font-family: var(--f-ar); font-size: 15px; }

/* OVERLAYS */
.overlay {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(250, 248, 243, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  gap: 18px;
  padding: 30px;
  text-align: center;
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay.hidden { display: none; }

.countdown-num {
  font-size: 110px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -4px;
  line-height: 1;
  animation: countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes countIn {
  0%   { opacity: 0; transform: scale(0.5); }
  60%  { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

.countdown-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-align: center;
  max-width: 280px;
  line-height: 1.5;
}

html[lang="ar"] .countdown-label { font-family: var(--f-ar); font-size: 15px; }

/* Game Over */
.gameover-icon {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--g-heart);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 20px 40px rgba(232, 160, 191, 0.4);
  animation: gameOverPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes gameOverPop {
  0%   { transform: scale(0.3); }
  60%  { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.gameover-icon svg {
  width: 50px; height: 50px;
  stroke: #fff; stroke-width: 2.8; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.gameover-title {
  font-size: 26px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

html[lang="ar"] .gameover-title { font-family: var(--f-ar); font-size: 25px; letter-spacing: 0; }

.gameover-sub {
  font-size: 13.5px;
  color: var(--c-slate);
  font-weight: 500;
  max-width: 280px;
  line-height: 1.55;
}

html[lang="ar"] .gameover-sub { font-family: var(--f-ar); font-size: 14.5px; }

.gameover-stats {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.gameover-stat {
  padding: 12px 18px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 80px;
}

.gameover-stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.8px;
  line-height: 1;
  font-feature-settings: "tnum";
}

.gameover-stat-value.good { color: var(--c-success); }
.gameover-stat-value.blue { color: var(--c-primary); }

.gameover-stat-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
}

html[lang="ar"] .gameover-stat-label {
  font-family: var(--f-ar);
  text-transform: none; letter-spacing: 0;
  font-size: 11px;
}

/* Buttons */
.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-heart);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(232, 160, 191, 0.35);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(232, 160, 191, 0.45); }
.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="exit-btn" id="exitBtn" aria-label="Exit">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="hud">
          <div class="voice-indicator" id="voiceIndicator" style="display:none;">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            </svg>
            <span id="voiceLabel">Voice ON</span>
          </div>

          <div class="hud-box q">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="hudQ">1</span>/<span id="hudTotal">8</span>
          </div>

          <div class="hud-box score">
            <svg viewBox="0 0 24 24">
              <polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"></polygon>
            </svg>
            <span id="hudScore">0</span>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Status -->
        <div class="status-wrap">
          <div class="status-text" id="statusText">
            <span class="pulse-dot"></span>
            <span id="statusMain">Get ready...</span>
          </div>
          <div class="status-sub" id="statusSub"></div>
        </div>

        <!-- Progress Pips -->
        <div class="pips-row" id="pipsRow"></div>

        <!-- Empty State (no Memory Bank) -->
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
          <div class="empty-title" id="emptyTitle">No Memories Yet</div>
          <div class="empty-text" id="emptyText">Add people to your Memory Bank first, then come back to train with them.</div>
          <button class="empty-btn" id="emptyBtn">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span id="emptyBtnLabel">Add Person</span>
          </button>
        </div>

        <!-- Main Play Area -->
        <div class="play-area" id="playArea" style="display:none;">

          <!-- Question Card -->
          <div class="question-card">
            <div class="q-badge">
              <svg viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span id="qBadgeText">Personal Memory</span>
            </div>

            <div class="speaker-wrap" id="speakerBtn">
              <svg viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </div>

            <div class="waveform" id="waveform">
              <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="q-text" id="qText">Who is this person?</div>
          </div>

          <!-- Options -->
          <div class="options-grid" id="optionsGrid"></div>

          <button class="repeat-btn" id="repeatBtn">
            <svg viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span id="repeatLabel">Repeat Question</span>
          </button>

        </div>

      </div>

      <!-- Countdown Overlay -->
      <div class="overlay" id="countdownOverlay">
        <div class="countdown-num" id="countdownNum">3</div>
        <div class="countdown-label" id="countdownLabel">Get ready to start</div>
      </div>

      <!-- Game Over Overlay -->
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="gameover-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="gameover-title" id="gameOverTitle">Great job!</div>
        <div class="gameover-sub" id="gameOverSub">You completed the Personal Memory session.</div>

        <div class="gameover-stats">
          <div class="gameover-stat">
            <div class="gameover-stat-value good" id="finalScore">0</div>
            <div class="gameover-stat-label" id="finalScoreLabel">Score</div>
          </div>
          <div class="gameover-stat">
            <div class="gameover-stat-value blue" id="finalCorrect">0</div>
            <div class="gameover-stat-label" id="finalCorrectLabel">Correct</div>
          </div>
        </div>

        <button class="btn-primary" id="gameOverBtn" style="margin-top: 8px;">
          <span id="gameOverBtnLabel">Back to Home</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    getReady: 'Get ready...',
    question: 'Question',
    whoIsPerson: 'Who is this person?',
    whichIsPerson: 'Which one is {name}?',
    correct: 'Correct!',
    wrong: 'Not quite',
    nextQuestion: 'Next question coming up...',
    gameOverTitle: 'Great job!',
    gameOverSub: 'You completed the Personal Memory session.',
    score: 'Score',
    correctCount: 'Correct',
    backHome: 'Back to Home',
    voiceOn: 'Voice ON',
    repeat: 'Repeat Question',
    personalMemory: 'Personal Memory',
    emptyTitle: 'No Memories Yet',
    emptyText: 'Add people to your Memory Bank first, then come back to train with them.',
    addPerson: 'Add Person',
    countdownLabel: 'Get ready to start',
    mins: 'min'
  },
  ar: {
    getReady: 'استعد...',
    question: 'سؤال',
    whoIsPerson: 'من هذا الشخص؟',
    whichIsPerson: 'أي واحد هو {name}؟',
    correct: 'صحيح!',
    wrong: 'ليس تمامًا',
    nextQuestion: 'السؤال التالي قادم...',
    gameOverTitle: 'عمل رائع!',
    gameOverSub: 'أتممت جلسة الذاكرة الشخصية.',
    score: 'النقاط',
    correctCount: 'صحيح',
    backHome: 'العودة للرئيسية',
    voiceOn: 'الصوت مفعّل',
    repeat: 'إعادة السؤال',
    personalMemory: 'الذاكرة الشخصية',
    emptyTitle: 'لا توجد ذكريات بعد',
    emptyText: 'أضف أشخاصًا إلى بنك الذكريات أولًا، ثم عد للتدريب معهم.',
    addPerson: 'أضف شخص',
    countdownLabel: 'استعد للبدء',
    mins: 'دقيقة'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   STATE
============================================ */
const state = {
  totalRounds: 8,
  currentIdx: 0,
  score: 0,
  correctCount: 0,
  wrongCount: 0,
  locked: false,
  isPlaying: false,
  voiceMode: false,
  currentQuestion: null,
  people: [],
  places: [],
  events: [],
  allItems: []
};

/* ============================================
   DOM REFS
============================================ */
const $ = id => document.getElementById(id);
const statusMain = $('statusMain');
const statusSub = $('statusSub');
const pipsRow = $('pipsRow');
const hudQ = $('hudQ');
const hudTotal = $('hudTotal');
const hudScore = $('hudScore');

/* ============================================
   HELPERS
============================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

function setStatus(main, sub = '') {
  statusMain.textContent = main;
  statusSub.textContent = sub;
}

function updateHUD() {
  hudQ.textContent = state.currentIdx + 1;
  hudTotal.textContent = state.totalRounds;
  hudScore.textContent = state.score;
}

function renderPips(filledCount = 0, mode = 'filled') {
  pipsRow.innerHTML = '';
  for (let i = 0; i < state.totalRounds; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip';
    if (i < filledCount) pip.classList.add(mode);
    pipsRow.appendChild(pip);
  }
}

/* ============================================
   LOAD MEMORY BANK
============================================ */
function loadMemoryBank() {
  function getItems(category) {
    try {
      const arr = JSON.parse(localStorage.getItem('memento_bank_' + category) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  state.people = getItems('people');
  state.places = getItems('places');
  state.events = getItems('events');
  state.allItems = [...state.people, ...state.places, ...state.events];
}

/* ============================================
   GENERATE QUESTION
============================================ */
function generateQuestion() {
  const t = I18N[currentLang];
  const people = state.people;

  // Need at least 4 people for a good multiple choice
  // If less, pad with available items
  const pool = people.length >= 4 ? people : state.allItems;

  if (pool.length < 2) return null;

  // Pick the correct answer (random from pool)
  const correctItem = pool[rnd(0, pool.length - 1)];

  // Pick 3 distractors (different from correct)
  const distractors = pool.filter(item => item !== correctItem);
  shuffle(distractors);
  const wrongs = distractors.slice(0, 3);

  // If we don't have enough distractors, pad with generic names
  const genericNames = ['Ahmed', 'Sara', 'Mona', 'Khaled', 'Layla', 'Omar', 'Nour', 'Hana'];
  while (wrongs.length < 3) {
    const name = genericNames[rnd(0, genericNames.length - 1)];
    if (!wrongs.find(w => w.name === name) && correctItem.name !== name) {
      wrongs.push({ name, photo: null, _generic: true });
    }
  }

  // Question types
  const qTypes = ['whoIsPerson', 'whichIsPerson'];
  const qType = qTypes[rnd(0, qTypes.length - 1)];

  let questionText;
  if (qType === 'whoIsPerson') {
    questionText = t.whoIsPerson;
  } else {
    questionText = t.whichIsPerson.replace('{name}', correctItem.name);
  }

  // Build options (correct + 3 wrongs, shuffled)
  const allOptions = shuffle([
    { ...correctItem, _correct: true },
    ...wrongs.map(w => ({ ...w, _correct: false }))
  ]);

  return {
    questionText,
    correctItem,
    options: allOptions,
    qType
  };
}

/* ============================================
   RENDER QUESTION
============================================ */
function renderQuestion() {
  if (state.currentIdx >= state.totalRounds) {
    showGameOver();
    return;
  }

  updateHUD();
  renderPips(state.currentIdx);

  const q = generateQuestion();
  if (!q) {
    showEmptyState();
    return;
  }

  state.currentQuestion = q;
  state.locked = false;

  $('qText').textContent = q.questionText;

  const grid = $('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.dataset.correct = String(opt._correct);

    const letter = (opt.name || '?').charAt(0).toUpperCase();
    const photo = opt.photo ? `<img src="${opt.photo}" alt="">` : letter;

    card.innerHTML = `
      <div class="option-avatar">${photo}</div>
      <div class="option-name">${opt.name || '—'}</div>
      <div class="check-badge">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
    `;

    card.addEventListener('click', () => handleAnswer(card, opt));
    grid.appendChild(card);
  });

  setStatus(
    `${I18N[currentLang].question} ${state.currentIdx + 1}`,
    q.qType === 'whichIsPerson' ? '' : ''
  );

  // Auto-speak if voice mode on
  if (state.voiceMode && 'speechSynthesis' in window) {
    setTimeout(() => speakQuestion(q.questionText), 500);
  }
}

/* ============================================
   HANDLE ANSWER
============================================ */
function handleAnswer(card, opt) {
  if (state.locked || !state.isPlaying) return;
  state.locked = true;

  const isCorrect = opt._correct;
  const pip = pipsRow.children[state.currentIdx];

  if (isCorrect) {
    state.correctCount++;
    state.score += 10;
    card.classList.add('correct');
    if (pip) pip.classList.add('correct');
    updateHUD();
    setStatus(I18N[currentLang].correct);

    if (state.voiceMode && 'speechSynthesis' in window) {
      speakText(I18N[currentLang].correct, currentLang === 'ar' ? 'ar-EG' : 'en-US');
    }
  } else {
    state.wrongCount++;
    card.classList.add('wrong');
    if (pip) pip.classList.add('wrong');

    // Reveal correct answer
    document.querySelectorAll('#optionsGrid .option-card').forEach(c => {
      if (c.dataset.correct === 'true') c.classList.add('correct');
    });
    updateHUD();
    setStatus(I18N[currentLang].wrong);
  }

  document.querySelectorAll('#optionsGrid .option-card').forEach(c => c.classList.add('locked'));

  setTimeout(() => {
    state.currentIdx++;
    renderQuestion();
  }, isCorrect ? 900 : 1500);
}

/* ============================================
   VOICE — Text to Speech
============================================ */
function speakQuestion(text) {
  const speakerBtn = $('speakerBtn');
  const waveform = $('waveform');
  const voiceIndicator = $('voiceIndicator');

  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';
  utter.rate = 0.95;
  utter.pitch = 1;

  utter.onstart = () => {
    speakerBtn.classList.add('speaking');
    waveform.classList.add('active');
    voiceIndicator.classList.add('speaking');
  };

  utter.onend = () => {
    speakerBtn.classList.remove('speaking');
    waveform.classList.remove('active');
    voiceIndicator.classList.remove('speaking');
  };

  utter.onerror = () => {
    speakerBtn.classList.remove('speaking');
    waveform.classList.remove('active');
    voiceIndicator.classList.remove('speaking');
  };

  window.speechSynthesis.speak(utter);
}

function speakText(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || (currentLang === 'ar' ? 'ar-EG' : 'en-US');
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
}

/* ============================================
   EMPTY STATE
============================================ */
function showEmptyState() {
  $('playArea').style.display = 'none';
  $('emptyState').style.display = 'flex';
  $('countdownOverlay').classList.add('hidden');
}

/* ============================================
   GAME OVER
============================================ */
function showGameOver() {
  state.isPlaying = false;
  const t = I18N[currentLang];
  const overlay = $('gameOverOverlay');

  $('finalScore').textContent = state.score;
  $('finalCorrect').textContent = state.correctCount;
  $('finalScoreLabel').textContent = t.score;
  $('finalCorrectLabel').textContent = t.correctCount;
  $('gameOverTitle').textContent = t.gameOverTitle;
  $('gameOverSub').textContent = t.gameOverSub;
  $('gameOverBtnLabel').textContent = t.backHome;

  overlay.classList.remove('hidden');

  // Save result
  const accuracy = state.totalRounds > 0
    ? Math.round((state.correctCount / state.totalRounds) * 100)
    : 0;

  const result = {
    score: state.score,
    correct: state.correctCount,
    wrong: state.wrongCount,
    total: state.totalRounds,
    accuracy,
    timestamp: Date.now()
  };
  localStorage.setItem('memento_personal_memory_result', JSON.stringify(result));

  // Save to today's queue result
  try {
    const idx = parseInt(localStorage.getItem('memento_current_exercise_idx') || '0');
    let queue = JSON.parse(localStorage.getItem('memento_workout_queue') || '[]');
    if (queue[idx]) queue[idx].done = true;
    localStorage.setItem('memento_workout_queue', JSON.stringify(queue));
  } catch (e) {}
}

/* ============================================
   COUNTDOWN
============================================ */
async function showCountdown() {
  const overlay = $('countdownOverlay');
  const num = $('countdownNum');
  const label = $('countdownLabel');
  label.textContent = I18N[currentLang].countdownLabel;
  overlay.classList.remove('hidden');

  const seq = ['3', '2', '1', 'GO!'];
  for (const v of seq) {
    num.textContent = v;
    num.style.animation = 'none';
    void num.offsetWidth;
    num.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
    await sleep(v === 'GO!' ? 600 : 850);
  }
  overlay.classList.add('hidden');
}

/* ============================================
   START GAME
============================================ */
async function startGame() {
  loadMemoryBank();

  const t = I18N[currentLang];

  // Check if there's enough data
  if (state.allItems.length < 2) {
    $('emptyTitle').textContent = t.emptyTitle;
    $('emptyText').textContent = t.emptyText;
    $('emptyBtnLabel').textContent = t.addPerson;
    showEmptyState();
    return;
  }

  // Check voice mode
  state.voiceMode = localStorage.getItem('memento_voice_mode') === 'true';

  if (state.voiceMode) {
    $('voiceIndicator').style.display = 'inline-flex';
    $('voiceLabel').textContent = t.voiceOn;
  }

  $('playArea').style.display = 'flex';
  $('emptyState').style.display = 'none';

  updateHUD();
  renderPips(0);

  setStatus(t.getReady, '');

  await showCountdown();

  state.isPlaying = true;
  state.currentIdx = 0;
  state.score = 0;
  state.correctCount = 0;
  state.wrongCount = 0;

  renderQuestion();
}

/* ============================================
   LANGUAGE APPLY
============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';

  const t = I18N[lang];
  $('qBadgeText').textContent = t.personalMemory;
  $('repeatLabel').textContent = t.repeat;
  $('voiceLabel').textContent = t.voiceOn;
}

/* ============================================
   EVENTS
============================================ */
$('exitBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  const msg = currentLang === 'en'
    ? 'Exit exercise? Your progress will be lost.'
    : 'هل تريد الخروج من التمرين؟ ستفقد تقدمك.';
  if (confirm(msg)) {
    window.location.href = 'home.html';
  }
});

$('gameOverBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  window.location.href = 'home.html';
});

$('emptyBtn').addEventListener('click', () => {
  window.location.href = 'personal-memory-bank.html';
});

$('repeatBtn').addEventListener('click', () => {
  if (state.currentQuestion && state.voiceMode) {
    speakQuestion(state.currentQuestion.questionText);
  }
});

$('speakerBtn').addEventListener('click', () => {
  if (state.currentQuestion && state.voiceMode) {
    speakQuestion(state.currentQuestion.questionText);
  }
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
startGame();
</script>

</body>
</html>
