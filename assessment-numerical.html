<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Numerical Assessment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS — Omega Design System
============================================ */
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;

  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;

  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;

  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 23, 42, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 148, 135, 0.05), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.exit-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.exit-btn:hover {
  background: #fff;
  border-color: rgba(239, 68, 68, 0.4);
  transform: scale(1.05);
}

.exit-btn svg {
  width: 15px; height: 15px;
  stroke: var(--c-slate);
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
}

.exit-btn:hover svg { stroke: var(--c-error); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-1px);
}

.lang-toggle svg {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(14, 148, 135, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 100%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  box-shadow: 0 0 10px rgba(14, 148, 135, 0.3);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

.progress-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.4px;
  white-space: nowrap;
}

html[lang="ar"] .progress-text { font-family: var(--f-ar); letter-spacing: 0; font-size: 12.5px; }

.phase {
  display: none;
  flex-direction: column;
  flex: 1;
  gap: 14px;
  animation: phaseIn 0.5s ease forwards;
  min-height: 0;
}

.phase.active { display: flex; }

@keyframes phaseIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ready-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 10px 0;
}

.ready-icon {
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: readyFloat 3s ease-in-out infinite;
}

@keyframes readyFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

.ready-icon::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, transparent 65%);
  filter: blur(24px);
  z-index: -1;
  animation: pulseGlow 2.8s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.08); }
}

.ready-icon svg { width: 100%; height: 100%; }

.ready-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
  max-width: 300px;
}

html[lang="ar"] .ready-title { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.ready-desc {
  font-size: 14px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 300px;
}

html[lang="ar"] .ready-desc { font-family: var(--f-ar); font-size: 15px; }

.ready-desc b {
  color: var(--c-blue);
  font-weight: 700;
}

.ready-meta {
  display: flex;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-navy);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
}

.meta-pill svg {
  width: 12px; height: 12px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[lang="ar"] .meta-pill { font-family: var(--f-ar); font-size: 12.5px; }

.hud {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.hud-box {
  flex: 1;
  padding: 8px 6px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.hud-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.1;
}

.hud-label {
  font-size: 9.5px;
  color: var(--c-slate);
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .hud-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
}

.hud-box.q .hud-value { color: var(--c-primary); }
.hud-box.score .hud-value { color: var(--c-success); }

.q-scroll {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
  padding-bottom: 4px;
}

.q-scroll::-webkit-scrollbar { display: none; }
.q-scroll > * { flex-shrink: 0; }

.timer-row {
  display: flex;
  justify-content: center;
  padding: 4px 0;
}

.timer-wrap {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.timer-wrap svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}

.timer-track {
  fill: none;
  stroke: rgba(14, 148, 135, 0.10);
  stroke-width: 5;
}

.timer-ring {
  fill: none;
  stroke: url(#numTimerGrad);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 144.51;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.9s linear;
}

.timer-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--c-primary);
  letter-spacing: -0.5px;
}

.timer-wrap.warning .timer-num {
  color: var(--c-error);
  animation: blinkNum 0.6s ease-in-out infinite;
}

.timer-wrap.warning .timer-ring {
  stroke: #EF4444;
}

@keyframes blinkNum {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

.question-card {
  position: relative;
  background: #fff;
  border-radius: var(--r-xl);
  border: 1.5px solid var(--c-border);
  padding: 26px 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
  overflow: hidden;
  animation: phaseIn 0.4s ease;
  align-items: center;
  min-height: 140px;
  justify-content: center;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 4px;
  background: var(--g-brand);
}

.q-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(59, 130, 246, 0.12);
  color: var(--c-blue);
  font-size: 10.5px;
  font-weight: 700;
  border-radius: var(--r-pill);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

html[lang="ar"] .q-badge {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

.q-text {
  font-size: 34px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -1px;
  text-align: center;
  line-height: 1.2;
  font-feature-settings: "tnum";
  margin: 4px 0;
}

html[lang="ar"] .q-text {
  font-family: var(--f-ar);
  font-size: 32px;
  letter-spacing: 0;
}

.q-text.small {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.5;
}

html[lang="ar"] .q-text.small { font-size: 17px; }

.options-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.opt {
  padding: 20px 12px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  font-size: 20px;
  font-weight: 700;
  color: var(--c-navy);
  text-align: center;
  transition: all 0.25s cubic-bezier(0.65, 0, 0.35, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  letter-spacing: -0.3px;
  font-feature-settings: "tnum";
}

html[lang="ar"] .opt { font-family: var(--f-ar); letter-spacing: 0; }

.opt::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.opt:hover:not(:disabled) {
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
}

.opt:active:not(:disabled) { transform: scale(0.96); }

.opt:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.opt.correct {
  background: linear-gradient(135deg, #22C55E, #4ADE80);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 12px 28px rgba(34, 197, 94, 0.32);
  transform: translateY(-2px);
  opacity: 1;
}

.opt.correct::after { opacity: 1; animation: optPop 0.5s ease; }

.opt.wrong {
  background: linear-gradient(135deg, #EF4444, #F87171);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 12px 28px rgba(239, 68, 68, 0.32);
  animation: wrongShake 0.4s ease;
  opacity: 1;
}

.opt.wrong::after { opacity: 1; animation: optPop 0.5s ease; }

.opt.revealed {
  background: linear-gradient(135deg, #22C55E, #4ADE80);
  border-color: transparent;
  color: #fff;
  opacity: 1;
  animation: revealPulse 0.8s ease;
}

@keyframes revealPulse {
  0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70%  { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 12px 28px rgba(34, 197, 94, 0.32); }
}

@keyframes optPop {
  0%   { transform: scale(0.4); opacity: 1; }
  100% { transform: scale(2.2); opacity: 0; }
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0) translateY(-2px); }
  25%      { transform: translateX(-8px) translateY(-2px); }
  75%      { transform: translateX(8px) translateY(-2px); }
}

.feedback-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 8px 0;
}

.result-circle {
  position: relative;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.5);
  animation: circleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
}

@keyframes circleIn {
  to { opacity: 1; transform: scale(1); }
}

.result-circle svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}

.result-track {
  fill: none;
  stroke: rgba(14, 148, 135, 0.08);
  stroke-width: 10;
}

.result-ring {
  fill: none;
  stroke: url(#resultGrad);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 408.4;
  stroke-dashoffset: 408.4;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.5s;
}

.result-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
}

.result-score {
  font-size: 40px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1.5px;
  line-height: 1;
}

.result-label {
  font-size: 11.5px;
  color: var(--c-slate);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

html[lang="ar"] .result-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12.5px;
}

.result-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.3;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1s forwards;
}

html[lang="ar"] .result-title { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.result-desc {
  font-size: 13px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 290px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1.15s forwards;
}

html[lang="ar"] .result-desc { font-family: var(--f-ar); font-size: 14px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.stats-row {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  margin-top: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1.3s forwards;
}

.stat-box {
  flex: 1;
  padding: 12px 8px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.stat-value {
  font-size: 17px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  font-feature-settings: "tnum";
}

.stat-label {
  font-size: 10.5px;
  color: var(--c-slate);
  font-weight: 500;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
}

html[lang="ar"] .stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

.stat-box.good .stat-value { color: var(--c-success); }
.stat-box.bad  .stat-value { color: var(--c-error); }
.stat-box.blue .stat-value { color: var(--c-primary); }

.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 148, 135, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 148, 135, 0.35);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

.countdown-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(248, 250, 252, 0.92);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 50;
  border-radius: var(--r-xl);
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.countdown-num {
  font-size: 100px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -4px;
  animation: countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes countIn {
  0%   { opacity: 0; transform: scale(0.5); }
  60%  { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

/* ============================================

============================================ */

    metaTime: '15 ثانية / سؤال',

    hudQLabel: 'سؤال',

    resultLabel: 'الدقة',
    resultTitleGreat: 'بارع بالأرقام!',
    resultTitleGood: 'أرقام دقيقة!',
    resultTitleOk: 'واصل التدريب!',
    resultDescGreat: 'تفكير رقمي استثنائي!',
    resultDescGood: 'مهارات رقمية قوية.',
    resultDescOk: 'كل محاولة تشحذك!',
    statCorrectLabel: 'صحيح',
    statWrongLabel: 'خطأ',
    statTimeLabel: 'متوسط الوقت',
    nextLabel: 'عرض النتائج'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('langCurrent').textContent = lang === 'en' ? 'EN' : 'ع';
  document.getElementById('langOther').textContent = lang === 'en' ? 'ع' : 'EN';

  const t = I18N[lang];

  document.getElementById('progressText').textContent = t.progress;
  document.getElementById('readyTitle').textContent = t.readyTitle;
  document.getElementById('readyDesc').innerHTML = t.readyDesc;
  document.getElementById('metaQ').textContent = t.metaQ;
  document.getElementById('metaTime').textContent = t.metaTime;
  document.getElementById('readyLabel').textContent = t.readyLabel;

  document.getElementById('hudQLabel').textContent = t.hudQLabel;
  document.getElementById('hudScoreLabel').textContent = t.hudScoreLabel;

  document.getElementById('resultLabel').textContent = t.resultLabel;
  document.getElementById('statCorrectLabel').textContent = t.statCorrectLabel;
  document.getElementById('statWrongLabel').textContent = t.statWrongLabel;
  document.getElementById('statTimeLabel').textContent = t.statTimeLabel;
  document.getElementById('nextLabel').textContent = t.nextLabel;

  if (state.isPlaying && state.currentQ < state.questions.length) {
    renderQuestion(state.currentQ, true);
  }
  if (document.getElementById('phaseFeedback').classList.contains('active')) {
    updateFeedbackTexts();
  }
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   HELPERS
============================================ */
function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function generateOptions(correct, spread = 6) {
  const opts = new Set([correct]);
  let attempts = 0;
  while (opts.size < 4 && attempts < 100) {
    const delta = (Math.random() < 0.5 ? -1 : 1) * rnd(1, spread);
    const wrong = correct + delta;
    if (wrong > 0 && wrong !== correct) opts.add(wrong);
    attempts++;
  }
  let filler = correct + 1;
  while (opts.size < 4) {
    if (!opts.has(filler)) opts.add(filler);
    filler++;
  }
  return shuffle([...opts]);
}

/* ✅ Helper — يجيب نص السؤال بأمان لأي نوع */
function getQuestionText(q) {
  // Arabic?
  if (currentLang === 'ar') {
    // لو موجود textAR استخدمه
    if (q.textAR) return q.textAR;
  }
  // English — جرب text ثم textEN
  return q.text || q.textEN || '';
}

/* ============================================
   QUESTION GENERATORS
============================================ */
function genMath() {
  const kind = Math.random();
  let a, b, op, answer;

  if (kind < 0.4) {
    a = rnd(8, 45); b = rnd(5, 35);
    op = '+'; answer = a + b;
  } else if (kind < 0.75) {
    a = rnd(25, 70); b = rnd(5, a - 3);
    op = '−'; answer = a - b;
  } else {
    a = rnd(2, 9); b = rnd(2, 9);
    op = '×'; answer = a * b;
  }

  return {
    type: 'math',
    text: `${a} ${op} ${b} = ?`,
    answer,
    options: generateOptions(answer, 6)
  };
}

function genPattern() {
  const kind = rnd(0, 2);
  let seq, answer, spread;

  if (kind === 0) {
    const start = rnd(2, 12);
    const step = rnd(2, 8);
    seq = [start, start + step, start + 2 * step, start + 3 * step];
    answer = start + 4 * step;
    spread = Math.max(step + 2, 6);
  } else if (kind === 1) {
    const start = rnd(1, 3);
    const mult = rnd(2, 3);
    seq = [start, start * mult, start * mult * mult, start * mult * mult * mult];
    answer = start * Math.pow(mult, 4);
    spread = Math.max(mult * 3, 4);
  } else {
    const start = rnd(1, 4);
    seq = [
      start * start,
      (start + 1) * (start + 1),
      (start + 2) * (start + 2),
      (start + 3) * (start + 3)
    ];
    answer = (start + 4) * (start + 4);
    spread = 6;
  }

  return {
    type: 'pattern',
    text: seq.join(', ') + ', ?',
    answer,
    options: generateOptions(answer, spread)
  };
}

function genWord() {
  const kinds = [
    () => {
      const total = rnd(12, 25);
      const give = rnd(3, total - 4);
      const name = ['Sarah', 'Ali', 'Mona', 'Omar'][rnd(0, 3)];
      const item = ['apples', 'candies', 'books', 'stickers'][rnd(0, 3)];
      return {
        textEN: `${name} has ${total} ${item} and gives ${give} away. How many are left?`,
        textAR: `لدى ${name} ${total} ${item} وأعطى ${give}. كم تبقى؟`,
        answer: total - give,
        options: generateOptions(total - give, 4)
      };
    },
    () => {
      const each = rnd(3, 8);
      const count = rnd(3, 6);
      const totalPrice = each * count;
      return {
        textEN: `If 1 book costs $${each}, how much do ${count} books cost?`,
        textAR: `إذا كان ثمن كتاب واحد $${each}، فكم ثمن ${count} كتب؟`,
        answer: totalPrice,
        options: generateOptions(totalPrice, Math.max(each, 4))
      };
    },
    () => {
      const speed = rnd(2, 6);
      const hours = rnd(2, 5);
      return {
        textEN: `A car travels ${speed} km each hour. How far in ${hours} hours?`,
        textAR: `سيارة تسير ${speed} كم في الساعة. كم تقطع في ${hours} ساعات؟`,
        answer: speed * hours,
        options: generateOptions(speed * hours, 6)
      };
    }
  ];

  const kind = kinds[rnd(0, kinds.length - 1)]();
  return {
    type: 'word',
    text: kind.textEN,
    textAR: kind.textAR,
    answer: kind.answer,
    options: kind.options
  };
}

/* ✅ FIX: genCompare الآن يرجع text + textAR بدل textEN */
function genCompare() {
  const a1 = rnd(3, 9), b1 = rnd(3, 9);
  const a2 = rnd(3, 9), b2 = rnd(3, 9);
  const left = a1 * b1;
  const right = a2 * b2;

  const answer = Math.max(left, right);
  const unique = [...new Set([left, right, left + right, Math.abs(left - right)])].filter(v => v > 0);
  let filler = answer + 1;
  while (unique.length < 4) {
    if (!unique.includes(filler)) unique.push(filler);
    filler++;
  }

  return {
    type: 'compare',
    text:   `Which is larger?  ${a1} × ${b1}  or  ${a2} × ${b2}`,
    textAR: `أيهما أكبر؟  ${a1} × ${b1}  أم  ${a2} × ${b2}`,
    answer,
    options: shuffle(unique.slice(0, 4))
  };
}

function generateQuestions() {
  return [
    genMath(),
    genPattern(),
    genMath(),
    genWord(),
    genCompare()
  ];
}

/* ============================================
   STATE
============================================ */
const TIME_PER_QUESTION = 15;
const CIRCUMFERENCE = 144.51;

const state = {
  currentQ: 0,
  questions: [],
  correctCount: 0,
  wrongCount: 0,
  responseTimes: [],
  questionStartTime: 0,
  isPlaying: false,
  locked: false,
  timeLeft: TIME_PER_QUESTION
};

let timerInterval = null;
let timerCountdownInterval = null;

/* ============================================
   READY → PLAYING
============================================ */
document.getElementById('readyBtn').addEventListener('click', () => {
  state.questions = generateQuestions();
  startCountdown();
});

function startCountdown() {
  goToPhase('phasePlaying');
  const overlay = document.getElementById('countdownOverlay');
  const num = document.getElementById('countdownNum');
  overlay.style.display = 'flex';

  let n = 3;
  num.textContent = n;
  num.style.animation = 'none';
  void num.offsetWidth;
  num.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';

  const cd = setInterval(() => {
    n--;
    if (n > 0) {
      num.textContent = n;
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
    } else if (n === 0) {
      num.textContent = 'GO!';
      num.style.fontSize = '70px';
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = 'countIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
    } else {
      clearInterval(cd);
      overlay.style.display = 'none';
      num.style.fontSize = '';
      state.isPlaying = true;
      state.currentQ = 0;
      showQuestion();
    }
  }, 1000);
}

/* ============================================
   RENDER QUESTION — ✅ يستخدم helper الجديد
============================================ */
function renderQuestion(index, isRefresh = false) {
  if (index >= state.questions.length) return;
  const q = state.questions[index];
  const t = I18N[currentLang];

  document.getElementById('hudQ').textContent = index + 1;
  document.getElementById('hudTotal').textContent = state.questions.length;
  document.getElementById('hudScore').textContent = state.correctCount;

  let badge = t.typeMath;
  if (q.type === 'pattern') badge = t.typePattern;
  else if (q.type === 'word') badge = t.typeWord;
  else if (q.type === 'compare') badge = t.typeCompare;
  document.getElementById('qBadge').textContent = badge;

  const qTextEl = document.getElementById('qText');
  qTextEl.textContent = getQuestionText(q);
  qTextEl.classList.toggle('small', q.type === 'word' || q.type === 'compare');
}

function showQuestion() {
  if (state.currentQ >= state.questions.length) {
    endGame();
    return;
  }

  state.locked = false;
  const q = state.questions[state.currentQ];
  const t = I18N[currentLang];

  document.getElementById('hudQ').textContent = state.currentQ + 1;
  document.getElementById('hudTotal').textContent = state.questions.length;
  document.getElementById('hudScore').textContent = state.correctCount;

  let badge = t.typeMath;
  if (q.type === 'pattern') badge = t.typePattern;
  else if (q.type === 'word') badge = t.typeWord;
  else if (q.type === 'compare') badge = t.typeCompare;
  document.getElementById('qBadge').textContent = badge;

  const qTextEl = document.getElementById('qText');
  qTextEl.textContent = getQuestionText(q);
  qTextEl.classList.toggle('small', q.type === 'word' || q.type === 'compare');
  qTextEl.style.animation = 'none';
  void qTextEl.offsetWidth;
  qTextEl.style.animation = 'phaseIn 0.4s ease';

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = val;
    btn.dataset.value = val;
    btn.addEventListener('click', () => handleAnswer(val, btn));
    grid.appendChild(btn);
  });

  state.questionStartTime = Date.now();
  startQuestionTimer();
}

/* ============================================
   TIMER
============================================ */
function startQuestionTimer() {
  stopQuestionTimer();

  const ring = document.getElementById('timerRing');
  const num  = document.getElementById('timerNum');
  const wrap = document.getElementById('timerWrap');

  state.timeLeft = TIME_PER_QUESTION;

  ring.style.transition = 'none';
  ring.style.strokeDashoffset = '0';
  num.textContent = state.timeLeft;
  wrap.classList.remove('warning');

  setTimeout(() => {
    ring.style.transition = `stroke-dashoffset ${TIME_PER_QUESTION}s linear`;
    ring.style.strokeDashoffset = CIRCUMFERENCE;
  }, 50);

  timerCountdownInterval = setInterval(() => {
    state.timeLeft--;
    num.textContent = Math.max(state.timeLeft, 0);

    if (state.timeLeft <= 5) {
      wrap.classList.add('warning');
    }

    if (state.timeLeft <= 0) {
      clearInterval(timerCountdownInterval);
    }
  }, 1000);

  timerInterval = setTimeout(() => {
    clearInterval(timerCountdownInterval);
    if (!state.locked && state.isPlaying) {
      handleTimeout();
    }
  }, TIME_PER_QUESTION * 1000);
}

function stopQuestionTimer() {
  clearTimeout(timerInterval);
  clearInterval(timerCountdownInterval);
  const ring = document.getElementById('timerRing');
  if (ring) {
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '0';
  }
}

/* ============================================
   HANDLE ANSWER
============================================ */
function handleAnswer(val, btn) {
  if (state.locked || !state.isPlaying) return;
  state.locked = true;
  stopQuestionTimer();

  const elapsed = (Date.now() - state.questionStartTime) / 1000;
  state.responseTimes.push(elapsed);

  const q = state.questions[state.currentQ];
  const isCorrect = val === q.answer;

  if (isCorrect) {
    state.correctCount++;
    btn.classList.add('correct');
    document.getElementById('hudScore').textContent = state.correctCount;
  } else {
    state.wrongCount++;
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o => {
      if (parseInt(o.dataset.value) === q.answer) o.classList.add('revealed');
    });
  }

  document.querySelectorAll('.opt').forEach(o => o.disabled = true);

  setTimeout(() => {
    state.currentQ++;
    if (state.currentQ >= state.questions.length) {
      endGame();
    } else {
      showQuestion();
    }
  }, isCorrect ? 700 : 1100);
}

function handleTimeout() {
  if (state.locked) return;
  state.locked = true;

  state.wrongCount++;
  state.responseTimes.push(TIME_PER_QUESTION);

  const q = state.questions[state.currentQ];
  document.querySelectorAll('.opt').forEach(o => {
    if (parseInt(o.dataset.value) === q.answer) o.classList.add('revealed');
    o.disabled = true;
  });

  setTimeout(() => {
    state.currentQ++;
    if (state.currentQ >= state.questions.length) {
      endGame();
    } else {
      showQuestion();
    }
  }, 1100);
}

/* ============================================
   END GAME
============================================ */
function endGame() {
  state.isPlaying = false;
  stopQuestionTimer();

  const accuracy = Math.round((state.correctCount / state.questions.length) * 100);
  const avgTime = state.responseTimes.length > 0
    ? state.responseTimes.reduce((a, b) => a + b, 0) / state.responseTimes.length
    : 0;

  const result = {
    correct: state.correctCount,
    wrong: state.wrongCount,
    total: state.questions.length,
    accuracy,
    avgResponseTime: parseFloat(avgTime.toFixed(2))
  };
  localStorage.setItem('omega_numerical_result', JSON.stringify(result));

  setTimeout(() => showFeedback(result), 400);
}

/* ============================================
   FEEDBACK
============================================ */
function showFeedback(result) {
  document.getElementById('resultScore').textContent = result.accuracy + '%';
  document.getElementById('statCorrect').textContent = result.correct + '/' + result.total;
  document.getElementById('statWrong').textContent   = result.wrong;
  document.getElementById('statTime').textContent    = result.avgResponseTime.toFixed(2) + 's';

  const ring = document.getElementById('resultRing');
  const circumference = 408.4;
  setTimeout(() => {
    ring.style.strokeDashoffset = circumference * (1 - result.accuracy / 100);
  }, 400);

  window._feedback = { accuracy: result.accuracy };
  updateFeedbackTexts();
  goToPhase('phaseFeedback');
}

function updateFeedbackTexts() {
  const t = I18N[currentLang];
  const { accuracy } = window._feedback || { accuracy: 0 };
  const titleEl = document.getElementById('resultTitle');
  const descEl  = document.getElementById('resultDesc');

  if (accuracy >= 80) {
    titleEl.textContent = t.resultTitleGreat;
    descEl.textContent  = t.resultDescGreat;
  } else if (accuracy >= 50) {
    titleEl.textContent = t.resultTitleGood;
    descEl.textContent  = t.resultDescGood;
  } else {
    titleEl.textContent = t.resultTitleOk;
    descEl.textContent  = t.resultDescOk;
  }
}

/* ============================================
   PHASE SWITCH
============================================ */
function goToPhase(id) {
  document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================
   NEXT → COMPLETE
============================================ */
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => { btn.style.transform = ''; }, 150);
  setTimeout(() => {
    window.location.href = 'assessment-complete.html';
  }, 250);
});

/* ============================================
   EXIT
============================================ */
document.getElementById('exitBtn').addEventListener('click', () => {
  if (state.isPlaying) state.isPlaying = false;
  stopQuestionTimer();
  const msg = currentLang === 'en'
    ? 'Exit assessment? Your progress will be lost.'
    : 'هل تريد الخروج من التقييم؟ ستفقد تقدمك.';
  if (confirm(msg)) {
    window.location.href = 'assessment-intro.html';
  }
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
</script>
