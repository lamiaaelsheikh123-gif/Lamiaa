<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Attention Assessment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-red: #E53935;
  --c-blue-shape: #4285F4;
  --c-green: #4CAF50;
  --c-yellow: #FFC107;
  --c-purple: #9B7EDE;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-danger: linear-gradient(135deg, #E53935, #E57373);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* PHONE FRAME */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

/* SCREEN */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.08), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.exit-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.exit-btn:hover {
  background: #fff;
  border-color: rgba(229, 115, 115, 0.4);
  transform: scale(1.05);
}

.exit-btn svg {
  width: 15px; height: 15px;
  stroke: var(--c-slate);
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
}

.exit-btn:hover svg { stroke: var(--c-error); }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 14px; height: 14px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}

.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(14, 124, 123, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 28.57%;
  background: var(--g-brand);
  border-radius: var(--r-pill);
  box-shadow: 0 0 10px rgba(14, 124, 123, 0.3);
  transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
}

html[dir="rtl"] .progress-fill { left: auto; right: 0; }

.progress-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.4px;
  white-space: nowrap;
}

html[lang="ar"] .progress-text { font-family: var(--f-ar); letter-spacing: 0; font-size: 12.5px; }

/* PHASES */
.phase {
  display: none;
  flex-direction: column;
  flex: 1;
  gap: 14px;
  animation: phaseIn 0.5s ease forwards;
  min-height: 0;
}

.phase.active { display: flex; }

@keyframes phaseIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============ PHASE 1: READY ============ */
.ready-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 10px 0;
}

.ready-icon {
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: readyFloat 3s ease-in-out infinite;
}

@keyframes readyFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

.ready-icon::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(229, 115, 115, 0.15) 0%, transparent 65%);
  filter: blur(24px);
  z-index: -1;
  animation: pulseGlow 2.8s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.08); }
}

.ready-icon svg { width: 100%; height: 100%; }

.ready-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.4px;
  line-height: 1.25;
  max-width: 300px;
}

html[lang="ar"] .ready-title { font-family: var(--f-ar); font-size: 23px; letter-spacing: 0; }

.ready-desc {
  font-size: 14px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 300px;
}

html[lang="ar"] .ready-desc { font-family: var(--f-ar); font-size: 15px; }

.ready-desc b {
  color: var(--c-red);
  font-weight: 700;
}

/* Target chip — dynamic */
.target-chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: #fff;
  border: 1.5px solid rgba(14, 124, 123, 0.2);
  border-radius: var(--r-pill);
  box-shadow: 0 6px 20px rgba(15, 44, 76, 0.06);
}

.target-chip .target-shape {
  width: 22px; height: 22px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: targetPulse 1.5s ease-in-out infinite;
}

@keyframes targetPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.2); }
}

.target-chip .target-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
}

html[lang="ar"] .target-chip .target-label { font-family: var(--f-ar); font-size: 14px; }

.ready-meta {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-navy);
  box-shadow: 0 4px 12px rgba(15, 44, 76, 0.04);
}

.meta-pill svg {
  width: 12px; height: 12px;
  stroke: var(--c-primary);
  stroke-width: 2.4;
  fill: none;
}

html[lang="ar"] .meta-pill { font-family: var(--f-ar); font-size: 12.5px; }

/* ============ PHASE 2: PLAYING ============ */
.hud {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.hud-box {
  flex: 1;
  padding: 8px 6px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  transition: all 0.3s ease;
}

.hud-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.1;
}

.hud-label {
  font-size: 9.5px;
  color: var(--c-slate);
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .hud-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
}

.hud-box.hits .hud-value { color: var(--c-success); }
.hud-box.missed .hud-value { color: var(--c-error); }
.hud-box.time .hud-value { color: var(--c-primary); }

.hud-box.time.warning .hud-value {
  color: var(--c-red);
  animation: blink 1s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.5; }
}

/* Target reminder bar */
.target-reminder {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(14, 124, 123, 0.06);
  border-radius: var(--r-md);
  border: 1px solid rgba(14, 124, 123, 0.12);
  flex-shrink: 0;
}

.target-reminder .target-shape-mini {
  width: 16px; height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.target-reminder .target-reminder-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-navy);
}

html[lang="ar"] .target-reminder .target-reminder-label { font-family: var(--f-ar); font-size: 13px; }

/* Play area */
.play-area {
  position: relative;
  flex: 1;
  background: #fff;
  border-radius: var(--r-xl);
  border: 1.5px solid var(--c-border);
  overflow: hidden;
  min-height: 0;
  box-shadow: 0 8px 24px rgba(15, 44, 76, 0.04);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.play-area::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(14, 124, 123, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14, 124, 123, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}

/* Shapes */
.shape {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transform-origin: center;
  animation: shapeIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  will-change: transform, opacity;
  -webkit-tap-highlight-color: transparent;
}

@keyframes shapeIn {
  0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes shapeOut {
  0%   { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

.shape.hit {
  animation: hitPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  pointer-events: none;
}

@keyframes hitPop {
  0%   { transform: scale(1); opacity: 1; }
  50%  { transform: scale(1.5); opacity: 0.9; }
  100% { transform: scale(2.2); opacity: 0; }
}

.shape.missed-tap {
  animation: wrongShake 0.4s ease forwards;
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-8px) rotate(-4deg); }
  75%      { transform: translateX(8px) rotate(4deg); }
}

.shape.disappear {
  animation: shapeOut 0.3s ease forwards;
  pointer-events: none;
}

/* Shape styles */
.shape-circle {
  border-radius: 50%;
}

.shape-square {
  border-radius: 20%;
}

.shape-triangle {
  width: 0;
  height: 0;
  border-left: solid transparent;
  border-right: solid transparent;
  border-bottom: solid;
  position: relative;
}

/* ============ PHASE 3: FEEDBACK ============ */
.feedback-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 8px 0;
}

.result-circle {
  position: relative;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.5);
  animation: circleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
}

@keyframes circleIn {
  to { opacity: 1; transform: scale(1); }
}

.result-circle svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}

.result-track {
  fill: none;
  stroke: rgba(14, 124, 123, 0.08);
  stroke-width: 10;
}

.result-ring {
  fill: none;
  stroke: url(#resultGrad);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 408.4;
  stroke-dashoffset: 408.4;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.5s;
}

.result-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
}

.result-score {
  font-size: 40px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1.5px;
  line-height: 1;
}

.result-label {
  font-size: 11.5px;
  color: var(--c-slate);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

html[lang="ar"] .result-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12.5px;
}

.result-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.3;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1s forwards;
}

html[lang="ar"] .result-title { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.result-desc {
  font-size: 13px;
  color: var(--c-slate);
  line-height: 1.6;
  max-width: 290px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1.15s forwards;
}

html[lang="ar"] .result-desc { font-family: var(--f-ar); font-size: 14px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.stats-row {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  margin-top: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.6s ease 1.3s forwards;
}

.stat-box {
  flex: 1;
  padding: 12px 8px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.stat-value {
  font-size: 17px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  font-feature-settings: "tnum";
}

.stat-label {
  font-size: 10.5px;
  color: var(--c-slate);
  font-weight: 500;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
}

html[lang="ar"] .stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

.stat-box.good .stat-value { color: var(--c-success); }
.stat-box.bad  .stat-value { color: var(--c-error); }

/* BOTTOM */
.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.28);
  transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(14, 124, 123, 0.35);
}

.btn-primary:active:not(:disabled) { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

/* Countdown overlay */
.countdown-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(250, 248, 243, 0.92);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 50;
  border-radius: var(--r-xl);
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.countdown-num {
  font-size: 100px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -4px;
  animation: countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes countIn {
  0%   { opacity: 0; transform: scale(0.5); }
  60%  { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;

}
</style>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    progress: 'Step 2 of 7',
    readyTitle: 'Attention Challenge',
    readyDesc: 'Tap <b>only the target</b> as fast as you can. Ignore everything else!',
    metaTime: '30 sec',
    metaTarget: 'Focus test',
    readyLabel: "I'm Ready",

    hudHitsLabel: 'Hits',
    hudMissedLabel: 'Wrong',
    hudTimeLabel: 'Time',

    // Target names
    targetRedCircles: 'Red Circles',
    targetBlueSquares: 'Blue Squares',
    targetGreenTriangles: 'Green Triangles',
    targetYellowCircles: 'Yellow Circles',
    targetPurpleSquares: 'Purple Squares',

    resultLabel: 'Accuracy',
    resultTitleGreat: 'Laser focus!',
    resultTitleGood: 'Sharp focus!',
    resultTitleOk: 'Nice try!',
    resultDescGreat: 'Outstanding attention control. Your focus is excellent!',
    resultDescGood: 'Great job spotting the targets. Attention is looking strong.',
    resultDescOk: 'Your attention needs a little more training — practice helps!',
    statHitsLabel: 'Hits',
    statWrongLabel: 'Wrong',
    statMissedLabel: 'Missed',
    nextLabel: 'Next Challenge'
  },
  ar: {
    progress: 'الخطوة 2 من 7',
    readyTitle: 'تحدي الانتباه',
    readyDesc: 'اضغط على <b>الهدف فقط</b> بأسرع ما يمكن. تجاهل كل شيء آخر!',
    metaTime: '30 ثانية',
    metaTarget: 'اختبار التركيز',
    readyLabel: 'أنا جاهز',

    hudHitsLabel: 'إصابات',
    hudMissedLabel: 'خطأ',
    hudTimeLabel: 'الوقت',

    targetRedCircles: 'الدوائر الحمراء',
    targetBlueSquares: 'المربعات الزرقاء',
    targetGreenTriangles: 'المثلثات الخضراء',
    targetYellowCircles: 'الدوائر الصفراء',
    targetPurpleSquares: 'المربعات البنفسجية',

    resultLabel: 'الدقة',
    resultTitleGreat: 'تركيز خارق!',
    resultTitleGood: 'تركيز قوي!',
    resultTitleOk: 'محاولة جيدة!',
    resultDescGreat: 'تحكم ممتاز في الانتباه. تركيزك رائع!',
    resultDescGood: 'عمل رائع في رصد الأهداف. انتباهك قوي.',
    resultDescOk: 'انتباهك يحتاج مزيدًا من التدريب — التدريب يساعد!',
    statHitsLabel: 'إصابات',
    statWrongLabel: 'خطأ',
    statMissedLabel: 'مفقود',
    nextLabel: 'التحدي التالي'
  }
};

/* ============================================
   TARGET TYPES (5 أنواع، عشوائي كل جلسة)
============================================ */
const TARGET_TYPES = [
  { id: 'red-circles',      shape: 'circle',   color: '#E53935', labelKey: 'targetRedCircles',      btn: '🔴' },
  { id: 'blue-squares',     shape: 'square',   color: '#4285F4', labelKey: 'targetBlueSquares',     btn: '🟦' },
  { id: 'green-triangles',  shape: 'triangle', color: '#4CAF50', labelKey: 'targetGreenTriangles',  btn: '🟢' },
  { id: 'yellow-circles',   shape: 'circle',   color: '#FFC107', labelKey: 'targetYellowCircles',   btn: '🟡' },
  { id: 'purple-squares',   shape: 'square',   color: '#9B7EDE', labelKey: 'targetPurpleSquares',   btn: '🟪' }
];

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

/* ============================================
   STATE
============================================ */
const GAME_DURATION = 30;
const SPAWN_INTERVAL = 750;
const SHAPE_LIFETIME = 1500;
const TARGET_RATIO = 0.4;

const state = {
  targetType: null,
  hits: 0,
  wrongTaps: 0,
  missedTargets: 0,
  timeLeft: GAME_DURATION,
  isPlaying: false
};

let spawnInterval = null;
let timerInterval = null;

/* ============================================
   DOM
============================================ */
const playArea     = document.getElementById('playArea');
const hudHits      = document.getElementById('hudHits');
const hudMissed    = document.getElementById('hudMissed');
const hudTime      = document.getElementById('hudTime');
const hudTimeBox   = document.getElementById('hudTimeBox');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownNum = document.getElementById('countdownNum');

/* ============================================
   APPLY LANGUAGE
============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';

  const t = I18N[lang];

  document.getElementById('progressText').textContent = t.progress;
  document.getElementById('readyTitle').textContent  = t.readyTitle;
  document.getElementById('readyDesc').innerHTML     = t.readyDesc;
  document.getElementById('metaTime').textContent    = t.metaTime;
  document.getElementById('metaTarget').textContent  = t.metaTarget;
  document.getElementById('readyLabel').textContent  = t.readyLabel;

  document.getElementById('hudHitsLabel').textContent   = t.hudHitsLabel;
  document.getElementById('hudMissedLabel').textContent = t.hudMissedLabel;
  document.getElementById('hudTimeLabel').textContent   = t.hudTimeLabel;

  document.getElementById('resultLabel').textContent     = t.resultLabel;
  document.getElementById('statHitsLabel').textContent   = t.statHitsLabel;
  document.getElementById('statWrongLabel').textContent  = t.statWrongLabel;
  document.getElementById('statMissedLabel').textContent = t.statMissedLabel;
  document.getElementById('nextLabel').textContent       = t.nextLabel;

  // Update target labels (from current target type)
  if (state.targetType) {
    const targetLabel = t[state.targetType.labelKey];
    document.getElementById('targetLabelReady').textContent = targetLabel;
    document.getElementById('targetLabelPlay').textContent  = targetLabel;
  }

  if (document.getElementById('phaseFeedback').classList.contains('active')) {
    updateFeedbackTexts();
  }
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   RENDER TARGET SHAPE
============================================ */
function renderTargetShape(container, size = 22) {
  if (!state.targetType) return;

  const { shape, color } = state.targetType;
  container.innerHTML = '';

  const el = document.createElement('div');
  el.style.width  = size + 'px';
  el.style.height = size + 'px';

  if (shape === 'circle') {
    el.style.borderRadius = '50%';
    el.style.background = color;
    el.style.boxShadow = `0 0 10px ${color}80`;
  } else if (shape === 'square') {
    el.style.borderRadius = '20%';
    el.style.background = color;
    el.style.boxShadow = `0 0 10px ${color}80`;
  } else if (shape === 'triangle') {
    const borderSize = size / 2;
    el.style.width = '0';
    el.style.height = '0';
    el.style.borderLeft   = `${borderSize}px solid transparent`;
    el.style.borderRight  = `${borderSize}px solid transparent`;
    el.style.borderBottom = `${size}px solid ${color}`;
    el.style.filter = `drop-shadow(0 0 6px ${color}80)`;
  }

  container.appendChild(el);
}

/* ============================================
   PICK RANDOM TARGET
============================================ */
function pickRandomTarget() {
  state.targetType = TARGET_TYPES[Math.floor(Math.random() * TARGET_TYPES.length)];
  console.log('🎯 Target:', state.targetType.id);

  // Update UI
  const t = I18N[currentLang];
  const targetLabel = t[state.targetType.labelKey];

  document.getElementById('targetLabelReady').textContent = targetLabel;
  document.getElementById('targetLabelPlay').textContent  = targetLabel;

  renderTargetShape(document.getElementById('targetShapeReady'), 22);
  renderTargetShape(document.getElementById('targetShapePlay'),  16);
}

/* ============================================
   START COUNTDOWN
============================================ */
document.getElementById('readyBtn').addEventListener('click', () => {
  startCountdown();
});

function startCountdown() {
  goToPhase('phasePlaying');
  countdownOverlay.style.display = 'flex';

  let n = 3;
  countdownNum.textContent = n;
  countdownNum.style.animation = 'none';
  void countdownNum.offsetWidth;
  countdownNum.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';

  const cd = setInterval(() => {
    n--;
    if (n > 0) {
      countdownNum.textContent = n;
      countdownNum.style.animation = 'none';
      void countdownNum.offsetWidth;
      countdownNum.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
    } else if (n === 0) {
      countdownNum.textContent = 'GO!';
      countdownNum.style.fontSize = '70px';
      countdownNum.style.animation = 'none';
      void countdownNum.offsetWidth;
      countdownNum.style.animation = 'countIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
    } else {
      clearInterval(cd);
      countdownOverlay.style.display = 'none';
      countdownNum.style.fontSize = '';
      startGame();
    }
  }, 1000);
}

/* ============================================
   GAME LOOP
============================================ */
function startGame() {
  state.isPlaying = true;
  state.hits = 0;
  state.wrongTaps = 0;
  state.missedTargets = 0;
  state.timeLeft = GAME_DURATION;

  updateHUD();

  for (let i = 0; i < 3; i++) {
    setTimeout(() => spawnShape(), i * 200);
  }

  spawnInterval = setInterval(() => {
    if (state.timeLeft > 0) spawnShape();
  }, SPAWN_INTERVAL);

  timerInterval = setInterval(() => {
    state.timeLeft--;
    hudTime.textContent = state.timeLeft;

    if (state.timeLeft <= 10) {
      hudTimeBox.classList.add('warning');
    }

    if (state.timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

/* ============================================
   SPAWN SHAPE
============================================ */
function spawnShape() {
  if (!state.isPlaying) return;

  const areaRect = playArea.getBoundingClientRect();
  const areaW = areaRect.width;
  const areaH = areaRect.height;

  const isTarget = Math.random() < TARGET_RATIO;
  let shapeType, color, size;

  if (isTarget) {
    shapeType = state.targetType.shape;
    color = state.targetType.color;
    size = 52;
  } else {
    // ✅ Distractor: random shape/color — but NEVER the exact target combo
    const distractorTypes = TARGET_TYPES.filter(t => t.id !== state.targetType.id);
    const randomType = distractorTypes[Math.floor(Math.random() * distractorTypes.length)];
    shapeType = randomType.shape;
    color = randomType.color;
    size = 48;
  }

  const padding = 8;
  const maxX = areaW - size - padding;
  const maxY = areaH - size - padding;
  const x = padding + Math.random() * Math.max(maxX - padding, 1);
  const y = padding + Math.random() * Math.max(maxY - padding, 1);

  const el = document.createElement('div');
  el.className = `shape shape-${shapeType}`;
  el.style.position = 'absolute';

  if (shapeType === 'triangle') {
    const borderSize = size / 2;
    el.style.left = (x - borderSize) + 'px';
    el.style.top  = y + 'px';
    el.style.borderLeftWidth   = borderSize + 'px';
    el.style.borderRightWidth  = borderSize + 'px';
    el.style.borderBottomWidth = size + 'px';
    el.style.borderBottomColor = color;
    el.style.width  = '0';
    el.style.height = '0';
    el.style.filter = `drop-shadow(0 4px 10px ${color}55)`;
  } else {
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    el.style.background = color;
    el.style.boxShadow = `0 4px 14px ${color}55`;
  }

  el.addEventListener('click', (e) => {
    e.stopPropagation();
    handleShapeTap(el, isTarget);
  });

  el.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    handleShapeTap(el, isTarget);
  }, { passive: false });

  playArea.appendChild(el);

  const timeout = setTimeout(() => {
    if (!el.parentNode) return;
    if (isTarget && !el.classList.contains('hit')) {
      state.missedTargets++;
      updateHUD();
    }
    el.classList.add('disappear');
    setTimeout(() => el.remove(), 300);
  }, SHAPE_LIFETIME);

  el._timeout = timeout;
  el._isTarget = isTarget;
}

/* ============================================
   HANDLE TAP
============================================ */
function handleShapeTap(el, isTarget) {
  if (!state.isPlaying) return;
  if (el.classList.contains('hit')) return;

  if (el._timeout) {
    clearTimeout(el._timeout);
    el._timeout = null;
  }

  if (isTarget) {
    state.hits++;
    el.classList.add('hit');
    updateHUD();
    setTimeout(() => el.remove(), 400);
  } else {
    state.wrongTaps++;
    el.classList.add('missed-tap');
    updateHUD();
    setTimeout(() => {
      if (el.parentNode) {
        el.classList.add('disappear');
        setTimeout(() => el.remove(), 300);
      }
    }, 300);
  }
}

/* ============================================
   UPDATE HUD
============================================ */
function updateHUD() {
  hudHits.textContent = state.hits;
  hudMissed.textContent = state.wrongTaps;
  hudTime.textContent = state.timeLeft;

  hudHits.style.transform = 'scale(1.2)';
  setTimeout(() => { hudHits.style.transform = 'scale(1)'; }, 150);
}

/* ============================================
   END GAME
============================================ */
function endGame() {
  state.isPlaying = false;
  clearInterval(spawnInterval);
  clearInterval(timerInterval);

  playArea.querySelectorAll('.shape').forEach(el => {
    if (el._isTarget && !el.classList.contains('hit')) {
      state.missedTargets++;
    }
    el.classList.add('disappear');
    setTimeout(() => el.remove(), 300);
  });

  const totalTargets = state.hits + state.missedTargets;
  const accuracy = totalTargets > 0
    ? Math.round((state.hits / totalTargets) * 100)
    : 0;

  const result = {
    targetType: state.targetType.id,
    hits: state.hits,
    wrongTaps: state.wrongTaps,
    missedTargets: state.missedTargets,
    totalTargets,
    accuracy,
    duration: GAME_DURATION
  };
  localStorage.setItem('memento_attention_result', JSON.stringify(result));

  setTimeout(() => {
    showFeedback(result);
  }, 400);
}

/* ============================================
   FEEDBACK
============================================ */
function showFeedback(result) {
  document.getElementById('resultScore').textContent = result.accuracy + '%';
  document.getElementById('statHits').textContent    = result.hits;
  document.getElementById('statWrong').textContent   = result.wrongTaps;
  document.getElementById('statMissed').textContent  = result.missedTargets;

  const ring = document.getElementById('resultRing');
  const circumference = 408.4;
  setTimeout(() => {
    ring.style.strokeDashoffset = circumference * (1 - result.accuracy / 100);
  }, 400);

  window._feedback = { accuracy: result.accuracy };
  updateFeedbackTexts();

  goToPhase('phaseFeedback');
}

function updateFeedbackTexts() {
  const t = I18N[currentLang];
  const { accuracy } = window._feedback || { accuracy: 0 };
  const titleEl = document.getElementById('resultTitle');
  const descEl  = document.getElementById('resultDesc');

  if (accuracy >= 80) {
    titleEl.textContent = t.resultTitleGreat;
    descEl.textContent  = t.resultDescGreat;
  } else if (accuracy >= 50) {
    titleEl.textContent = t.resultTitleGood;
    descEl.textContent  = t.resultDescGood;
  } else {
    titleEl.textContent = t.resultTitleOk;
    descEl.textContent  = t.resultDescOk;
  }
}

/* ============================================
   PHASE SWITCH
============================================ */
function goToPhase(id) {
  document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================
   NEXT
============================================ */
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => { btn.style.transform = ''; }, 150);

  setTimeout(() => {
    window.location.href = 'assessment-speed.html';
  }, 250);
});

/* ============================================
   EXIT
============================================ */
document.getElementById('exitBtn').addEventListener('click', () => {
  if (state.isPlaying) {
    state.isPlaying = false;
    clearInterval(spawnInterval);
    clearInterval(timerInterval);
  }
  const msg = currentLang === 'en'
    ? 'Exit assessment? Your progress will be lost.'
    : 'هل تريد الخروج من التقييم؟ ستفقد تقدمك.';
  if (confirm(msg)) {
    window.location.href = 'assessment-intro.html';
  }
});

/* ============================================
   INIT
============================================ */
pickRandomTarget();
applyLanguage(currentLang);
</script>
