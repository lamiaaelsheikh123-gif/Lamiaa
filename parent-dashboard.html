<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Parent Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B; --c-primary-light: #4DB6AC; --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5; --c-navy: #0F2C4C; --c-slate: #5A6C7D;
  --c-bg: #FAF8F3; --c-card: #FFFFFF; --c-border: #EAE6DE;
  --c-error: #E57373; --c-success: #4CAF50; --c-warning: #FF9800;
  --c-fire: #FF6B35;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-child: linear-gradient(135deg, #9B7EDE 0%, #5B9BD5 100%);
  --g-fire: linear-gradient(135deg, #FF6B35, #FF9800, #FFB74D);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(91, 155, 213, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(155, 126, 222, 0.2);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.back-btn:hover { background: #fff; border-color: rgba(155, 126, 222, 0.5); transform: translateX(-2px); }
html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg { width: 16px; height: 16px; stroke: var(--c-secondary); stroke-width: 2.4; fill: none; }
html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.lang-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(155, 126, 222, 0.2);
  border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600;
  color: var(--c-navy);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.lang-toggle:hover { background: #fff; border-color: rgba(155, 126, 222, 0.5); transform: translateY(-1px); }
.lang-toggle svg { width: 14px; height: 14px; stroke: var(--c-secondary); stroke-width: 2.2; fill: none; }

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }

@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* PARENT BADGE */
.parent-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  background: linear-gradient(135deg, rgba(155, 126, 222, 0.15), rgba(91, 155, 213, 0.10));
  border: 1px solid rgba(155, 126, 222, 0.3);
  border-radius: var(--r-pill);
  font-size: 10px;
  font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  align-self: flex-start;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.1s forwards;
}

.parent-badge svg {
  width: 12px; height: 12px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .parent-badge {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

/* CHILD HEADER */
.child-header {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 16px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  position: relative;
  overflow: hidden;
  opacity: 0; transform: translateY(14px);
  animation: fadeUp 0.5s ease 0.2s forwards;
}

.child-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 4px;
  background: var(--g-child);
}

.child-avatar {
  width: 62px; height: 62px;
  border-radius: 50%;
  background: var(--g-child);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(155, 126, 222, 0.35);
  position: relative;
  text-transform: uppercase;
}

.child-avatar::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(155, 126, 222, 0.25);
}

.child-info {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
}

.child-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .child-name { font-family: var(--f-ar); font-size: 17px; letter-spacing: 0; }

.child-meta {
  font-size: 11.5px;
  color: var(--c-slate);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

html[lang="ar"] .child-meta { font-family: var(--f-ar); font-size: 12.5px; }

.child-meta-divider {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--c-border);
}

/* STATS GRID */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.3s forwards;
}

.stat-card {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
}

.stat-card.s1::before { background: var(--g-child); }
.stat-card.s2::before { background: linear-gradient(180deg, #FF9800, #FFB74D); }
.stat-card.s3::before { background: var(--g-fire); }
.stat-card.s4::before { background: linear-gradient(180deg, #4CAF50, #66BB6A); }

.stat-head { display: flex; align-items: center; gap: 8px; }

.stat-icon {
  width: 26px; height: 26px;
  border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.stat-icon.s1 { background: linear-gradient(135deg, #9B7EDE, #5B9BD5); }
.stat-icon.s2 { background: linear-gradient(135deg, #FF9800, #FFB74D); }
.stat-icon.s3 { background: linear-gradient(135deg, #FF6B35, #FF9800); }
.stat-icon.s4 { background: linear-gradient(135deg, #4CAF50, #66BB6A); }

.stat-icon svg {
  width: 13px; height: 13px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.stat-label {
  font-size: 10px; font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}

.stat-value {
  font-size: 22px; font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.8px;
  line-height: 1;
  font-feature-settings: "tnum";
  display: flex; align-items: baseline; gap: 3px;
}

.stat-value small {
  font-size: 11px; font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0;
}

/* SECTION HEAD */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-inline-start: 4px; margin-top: 4px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease forwards;
}

.section-head.s1 { animation-delay: 0.4s; }
.section-head.s2 { animation-delay: 0.55s; }
.section-head.s3 { animation-delay: 0.7s; }

.section-title {
  font-size: 13.5px; font-weight: 700;
  color: var(--c-navy);
  display: flex; align-items: center; gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px; height: 14px;
  background: var(--g-child);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; }

/* SKILLS LIST */
.skills-list {
  display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.5s forwards;
}

.skill-row {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
  transition: all 0.25s ease;
}

.skill-row:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(15, 44, 76, 0.06);
}

.skill-header {
  display: flex; align-items: center; gap: 10px;
}

.skill-icon {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.skill-icon svg {
  width: 15px; height: 15px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  position: relative; z-index: 2;
}

.skill-icon::before { content: ''; position: absolute; inset: 0; z-index: 1; }
.skill-icon.memory::before    { background: linear-gradient(135deg, #0E7C7B, #4DB6AC); }
.skill-icon.attention::before { background: linear-gradient(135deg, #E57373, #FF9800); }
.skill-icon.speed::before     { background: linear-gradient(135deg, #5B9BD5, #4DB6AC); }
.skill-icon.problem::before   { background: linear-gradient(135deg, #9B7EDE, #5B9BD5); }
.skill-icon.visual::before    { background: linear-gradient(135deg, #4DB6AC, #9B7EDE); }
.skill-icon.language::before  { background: linear-gradient(135deg, #FF9800, #E8A0BF); }
.skill-icon.numerical::before { background: linear-gradient(135deg, #5B9BD5, #9B7EDE); }

.skill-name {
  flex: 1;
  font-size: 12.5px; font-weight: 700;
  color: var(--c-navy);
}

html[lang="ar"] .skill-name { font-family: var(--f-ar); font-size: 13.5px; }

.skill-score-mini {
  font-size: 14px;
  font-weight: 800;
  font-feature-settings: "tnum";
  letter-spacing: -0.3px;
}

.skill-score-mini.high { color: var(--c-success); }
.skill-score-mini.mid  { color: var(--c-warning); }
.skill-score-mini.low  { color: var(--c-error); }

/* Progress bar */
.skill-bar-track {
  width: 100%;
  height: 6px;
  background: rgba(155, 126, 222, 0.10);
  border-radius: var(--r-pill);
  overflow: hidden;
}

.skill-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--r-pill);
  background: var(--g-child);
  box-shadow: 0 0 8px rgba(155, 126, 222, 0.3);
  transition: width 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.9s;
}

.skill-bar-fill.high { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
.skill-bar-fill.mid  { background: linear-gradient(90deg, #FF9800, #FFB74D); }
.skill-bar-fill.low  { background: linear-gradient(90deg, #E57373, #EF5350); }

/* SCHEDULE */
.schedule-list {
  display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.65s forwards;
}

.day-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  transition: all 0.25s ease;
}

.day-row.today {
  background: linear-gradient(135deg, rgba(155, 126, 222, 0.08), rgba(91, 155, 213, 0.06));
  border-color: rgba(155, 126, 222, 0.35);
}

.day-row.rest {
  opacity: 0.55;
  border-style: dashed;
}

.day-name-mini {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  min-width: 40px;
}

html[lang="ar"] .day-name-mini {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
}

.day-row.today .day-name-mini { color: var(--c-secondary); }

.day-icon-wrap {
  display: flex;
  gap: 4px;
  flex: 1;
  flex-wrap: wrap;
}

.day-skill-icon {
  width: 22px; height: 22px;
  border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}

.day-skill-icon svg {
  width: 11px; height: 11px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  position: relative; z-index: 2;
}

.day-skill-icon::before { content: ''; position: absolute; inset: 0; z-index: 1; }
.day-skill-icon.memory::before    { background: linear-gradient(135deg, #0E7C7B, #4DB6AC); }
.day-skill-icon.attention::before { background: linear-gradient(135deg, #E57373, #FF9800); }
.day-skill-icon.speed::before     { background: linear-gradient(135deg, #5B9BD5, #4DB6AC); }
.day-skill-icon.problem::before   { background: linear-gradient(135deg, #9B7EDE, #5B9BD5); }

.day-status {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.day-status.done {
  background: rgba(76, 175, 80, 0.12);
  color: var(--c-success);
}

.day-status.missed {
  background: rgba(229, 115, 115, 0.12);
  color: var(--c-error);
}

.day-status.upcoming {
  background: rgba(91, 155, 213, 0.12);
  color: var(--c-blue);
}

.day-status.rest {
  background: rgba(90, 108, 125, 0.12);
  color: var(--c-slate);
}

html[lang="ar"] .day-status { font-family: var(--f-ar); font-size: 11px; letter-spacing: 0; }

/* AI INSIGHT */
.ai-insight {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(155, 126, 222, 0.12), rgba(91, 155, 213, 0.08));
  border: 1.5px solid rgba(155, 126, 222, 0.28);
  border-radius: var(--r-lg);
  position: relative;
  overflow: hidden;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.8s forwards;
}

.ai-insight::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0%   { left: -100%; }
  100% { left: 200%; }
}

.ai-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--g-child);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(155, 126, 222, 0.35);
  position: relative; z-index: 2;
  animation: aiPulse 2s ease-in-out infinite;
}

@keyframes aiPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}

.ai-icon svg {
  width: 18px; height: 18px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.ai-content {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
  position: relative; z-index: 2;
}

.ai-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--c-secondary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

html[lang="ar"] .ai-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11.5px;
}

.ai-text {
  font-size: 12.5px;
  color: var(--c-navy);
  font-weight: 500;
  line-height: 1.55;
}

html[lang="ar"] .ai-text { font-family: var(--f-ar); font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="langLabel">EN</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Parent Badge -->
        <div class="parent-badge">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="parentBadgeText">Parent Dashboard</span>
        </div>

        <!-- Child Header -->
        <div class="child-header">
          <div class="child-avatar" id="childAvatar">O</div>
          <div class="child-info">
            <div class="child-name" id="childName">Omar</div>
            <div class="child-meta">
              <span id="childAge">9 years</span>
              <div class="child-meta-divider"></div>
              <span id="childLevel">Level 3</span>
            </div>
          </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-card s1">
            <div class="stat-head">
              <div class="stat-icon s1">

              <div class="stat-label" id="statCompletedLabel">Completed</div>

          <div class="stat-card s2">

              <div class="stat-icon s2">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>

              <div class="stat-label" id="statMissedLabel">Missed</div>

                <svg viewBox="0 0 24 24">
                  <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z"></path>
                </svg>
              </div>
              <div class="stat-label" id="statStreakLabel">Streak</div>
            </div>
            <div class="stat-value"><span id="statStreak">0</span><small id="statStreakUnit">days</small></div>
          </div>

          <div class="stat-card s4">
            <div class="stat-head">
              <div class="stat-icon s4">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <circle cx="12" cy="12" r="6"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                </svg>
              </div>
              <div class="stat-label" id="statAccuracyLabel">Accuracy</div>
            </div>
            <div class="stat-value"><span id="statAccuracy">0</span><small>%</small></div>
          </div>
        </div>

        <!-- Cognitive Skills -->
        <div class="section-head s1">
          <div class="section-title" id="skillsSectionTitle">Cognitive Skills</div>
        </div>

        <div class="skills-list" id="skillsList">
          <!-- Filled by JS -->
        </div>

        <!-- Weekly Schedule -->
        <div class="section-head s2">
          <div class="section-title" id="scheduleSectionTitle">This Week</div>
        </div>

        <div class="schedule-list" id="scheduleList">
          <!-- Filled by JS -->
        </div>

        <!-- AI Insight -->
        <div class="ai-insight">
          <div class="ai-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3 L13.5 9 L19.5 10.5 L13.5 12 L12 18 L10.5 12 L4.5 10.5 L10.5 9 Z"></path>
              <path d="M19 3 L19.8 6 L22.5 6.8 L19.8 7.5 L19 10.5 L18.2 7.5 L15.5 6.8 L18.2 6 Z" opacity="0.7"></path>
            </svg>
          </div>
          <div class="ai-content">
            <div class="ai-label" id="aiLabel">AI Insight for Parents</div>
            <div class="ai-text" id="aiText">Your child is making steady progress.</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    parentBadge: 'Parent Dashboard',
    skillsSectionTitle: 'Cognitive Skills',
    scheduleSectionTitle: 'This Week',
    statCompletedLabel: 'Completed',
    statMissedLabel: 'Missed',
    statStreakLabel: 'Streak',
    statAccuracyLabel: 'Accuracy',
    statStreakUnit: 'days',
    aiLabel: 'AI Insight for Parents',
    years: 'years',
    level: 'Level',
    today: 'Today',
    done: 'Done',
    missed: 'Missed',
    upcoming: 'Upcoming',
    rest: 'Rest',
    noChild: 'No child profile found',
    insightHigh: 'Your child is doing really well! Keep supporting the daily routine.',
    insightMid: 'Your child is making steady progress. A little encouragement goes a long way.',
    insightLow: 'Your child is getting started. Short, consistent sessions will help build the habit.',
    skills: {
      memory: 'Memory', attention: 'Attention', speed: 'Processing Speed',
      problem: 'Problem Solving', visual: 'Visual Skills', language: 'Language',
      numerical: 'Numerical'
    },
    dayNames: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  },
  ar: {
    parentBadge: 'لوحة ولي الأمر',
    skillsSectionTitle: 'المهارات الذهنية',
    scheduleSectionTitle: 'هذا الأسبوع',
    statCompletedLabel: 'مكتملة',
    statMissedLabel: 'مفقودة',
    statStreakLabel: 'السلسلة',
    statAccuracyLabel: 'الدقة',
    statStreakUnit: 'أيام',
    aiLabel: 'رؤية الذكاء الاصطناعي للوالدين',
    years: 'سنة',
    level: 'المستوى',
    today: 'اليوم',
    done: 'مكتمل',
    missed: 'مفقود',
    upcoming: 'قادم',
    rest: 'راحة',
    noChild: 'لا يوجد ملف طفل',
    insightHigh: 'طفلك يؤدي بشكل رائع! استمر في دعم الروتين اليومي.',
    insightMid: 'طفلك يحرز تقدمًا مطردًا. القليل من التشجيع يساعد كثيرًا.',
    insightLow: 'طفلك في البداية. الجلسات القصيرة المنتظمة ستساعد في بناء العادة.',
    skills: {
      memory: 'الذاكرة', attention: 'الانتباه', speed: 'سرعة المعالجة',
      problem: 'حل المشكلات', visual: 'المهارات البصرية', language: 'اللغة',
      numerical: 'الرقمي'
    },
    dayNames: ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت']
  }
};

/* ============================================
   SKILL ICONS
============================================ */
const SKILL_ICONS = {
  memory: `<svg viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path></svg>`,
  attention: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`,
  speed: `<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`,
  problem: `<svg viewBox="0 0 24 24"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg>`,
  visual: `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  language: `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
  numerical: `<svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>`
};

const SKILL_KEYS = ['memory', 'attention', 'speed', 'problem', 'visual', 'language', 'numerical'];
const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   DATA LOADING
============================================ */
function loadChildData() {
  // Child profile
  let childProfile = {};
  try {
    childProfile = JSON.parse(localStorage.getItem('memento_child_profile') || '{}');
  } catch (e) { childProfile = {}; }

  const childName = childProfile.name || 'Child';
  const childAge = childProfile.age || 9;

  // Skills — current (with fallback)
  const skills = SKILL_KEYS.map(key => {
    let data = {};
    try {
      data = JSON.parse(localStorage.getItem('memento_' + key + '_result') || '{}');
    } catch (e) {}

    const score = typeof data.accuracy === 'number'
      ? data.accuracy
      : Math.max(30, 55 + Math.floor(Math.random() * 35));

    return { key, score };
  });

  // Stats (simulated for now)
  const completed = parseInt(localStorage.getItem('memento_child_completed') || '8');
  const missed = parseInt(localStorage.getItem('memento_child_missed') || '2');
  const streak = parseInt(localStorage.getItem('memento_child_streak') || '4');
  const accuracy = Math.round(
    skills.reduce((sum, s) => sum + s.score, 0) / skills.length
  );

  return { childName, childAge, skills, completed, missed, streak, accuracy };
}

/* ============================================
   BUILD SCHEDULE
============================================ */
function buildWeekSchedule(childData) {
  const todayIdx = new Date().getDay();

  // Simulated: child trains Mon, Wed, Fri, Sun
  const trainingDays = [0, 1, 3, 5]; // Sun, Mon, Wed, Fri

  // Simulate status: past days are done/missed, today is upcoming/done
  const schedule = DAY_KEYS.map((key, idx) => {
    const isTrainingDay = trainingDays.includes(idx);
    const isToday = idx === todayIdx;
    const isPast = idx < todayIdx;

    let status = 'upcoming';
    let skills = [];

    if (!isTrainingDay) {
      status = 'rest';
    } else if (isPast) {
      // Simulate: 80% done, 20% missed
      status = Math.random() > 0.2 ? 'done' : 'missed';
      // Random 2 skills
      skills = [SKILL_KEYS[Math.floor(Math.random() * 3)], SKILL_KEYS[Math.floor(Math.random() * 3)]];
      skills = [...new Set(skills)];
    } else if (isToday) {
      status = 'upcoming';
      skills = ['memory', 'attention'];
    }

    return { key, idx, isToday, status, skills };
  });

  return schedule;
}

/* ============================================
   RENDER
============================================ */
function renderAll() {
  const t = I18N[currentLang];
  const data = loadChildData();

  // Top bar
  document.getElementById('langLabel').textContent = currentLang === 'en' ? 'EN' : 'ع';

  // Badge
  document.getElementById('parentBadgeText').textContent = t.parentBadge;

  // Child header
  document.getElementById('childAvatar').textContent = data.childName.charAt(0).toUpperCase();
  document.getElementById('childName').textContent = data.childName;
  document.getElementById('childAge').textContent = data.childAge + ' ' + t.years;
  document.getElementById('childLevel').textContent = t.level + ' 3';

  // Stats
  document.getElementById('statCompletedLabel').textContent = t.statCompletedLabel;
  document.getElementById('statMissedLabel').textContent = t.statMissedLabel;
  document.getElementById('statStreakLabel').textContent = t.statStreakLabel;
  document.getElementById('statAccuracyLabel').textContent = t.statAccuracyLabel;
  document.getElementById('statStreakUnit').textContent = t.statStreakUnit;

  document.getElementById('statCompleted').textContent = data.completed;
  document.getElementById('statMissed').textContent = data.missed;
  document.getElementById('statStreak').textContent = data.streak;
  document.getElementById('statAccuracy').textContent = data.accuracy;

  // Section titles
  document.getElementById('skillsSectionTitle').textContent = t.skillsSectionTitle;
  document.getElementById('scheduleSectionTitle').textContent = t.scheduleSectionTitle;

  // Skills
  renderSkills(data);

  // Schedule
  renderSchedule();

  // AI Insight
  document.getElementById('aiLabel').textContent = t.aiLabel;
  const insight = data.accuracy >= 70
    ? t.insightHigh
    : (data.accuracy >= 50 ? t.insightMid : t.insightLow);
  document.getElementById('aiText').textContent = insight;
}

function renderSkills(data) {
  const t = I18N[currentLang];
  const container = document.getElementById('skillsList');
  container.innerHTML = '';

  data.skills.forEach(skill => {
    const cls = skill.score >= 70 ? 'high' : (skill.score >= 40 ? 'mid' : 'low');

    const row = document.createElement('div');
    row.className = 'skill-row';
    row.innerHTML = `
      <div class="skill-header">
        <div class="skill-icon ${skill.key}">${SKILL_ICONS[skill.key]}</div>
        <div class="skill-name">${t.skills[skill.key]}</div>
        <div class="skill-score-mini ${cls}">${skill.score}%</div>
      </div>
      <div class="skill-bar-track">
        <div class="skill-bar-fill ${cls}" data-width="${skill.score}"></div>
      </div>
    `;
    container.appendChild(row);
  });

  setTimeout(() => {
    container.querySelectorAll('.skill-bar-fill').forEach(el => {
      el.style.width = el.dataset.width + '%';
    });
  }, 200);
}

function renderSchedule() {
  const t = I18N[currentLang];
  const schedule = buildWeekSchedule();
  const container = document.getElementById('scheduleList');
  container.innerHTML = '';

  schedule.forEach(day => {
    const statusLabel = t[day.status] || day.status;
    const dayName = t.dayNames[day.idx];

    let skillsHtml = '';
    if (day.status === 'rest') {
      skillsHtml = `<span style="font-size:13px;">😴</span>`;
    } else {
      skillsHtml = day.skills.map(key =>
        `<div class="day-skill-icon ${key}">${SKILL_ICONS[key]}</div>`
      ).join('');
    }

    const row = document.createElement('div');
    row.className = 'day-row';
    if (day.isToday) row.classList.add('today');
    if (day.status === 'rest') row.classList.add('rest');

    row.innerHTML = `
      <div class="day-name-mini">${dayName}</div>
      <div class="day-icon-wrap">${skillsHtml}</div>
      <div class="day-status ${day.status}">${statusLabel}</div>
    `;
    container.appendChild(row);
  });
}

/* ============================================
   LANGUAGE APPLY
============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';
  renderAll();
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

/* ============================================
   NAVIGATION
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'home.html';
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
</script>

</body>
</html>
